    myTours.slice().reverse().forEach(function(t){
      var isChamp=t.champion===p.id;
      h.push('<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:#161E2E;border-radius:8px;margin-bottom:5px">');
      h.push('<span style="font-size:16px">'+(isChamp?'🏆':'🎾')+'</span>');
      h.push('<div style="flex:1"><div style="font-size:13px;font-weight:600">'+esc(t.name)+'</div><div style="font-size:11px;color:#4A5A72">'+t.date+(t.arena?' · '+esc(t.arena):'')+'</div></div>');
      if(isChamp)h.push('<span style="font-size:11px;font-weight:700;color:#C8A84B">CAMPEÃO</span>');
      h.push('</div>');
    });
    h.push('</div>');
  }

  // TÍTULOS HISTÓRICOS
  var tArr=Array.isArray(p.titulosAntes)?p.titulosAntes:(p.titulosAntes?[p.titulosAntes]:[]);
  if(tArr.length>0){
    h.push('<div style="background:rgba(200,168,75,.08);border:1px solid rgba(200,168,75,.25);border-radius:12px;padding:12px 14px;margin-bottom:16px">');
    h.push('<div style="font-size:11px;color:#C8A84B;font-weight:700;margin-bottom:8px">🌟 TÍTULOS ANTERIORES</div>');
    tArr.forEach(function(t){
      h.push('<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="color:#C8A84B">🏆</span><span style="font-size:13px;color:#E2EAF4">'+esc(t)+'</span></div>');
    });
    h.push('</div>');
  }

  // CONQUISTAS APP
  var badges=[];
  if(totalVit>=1)badges.push('🎯 Primeira vitória');
  if(totalVit>=10)badges.push('🔥 10 vitórias');
  if(totalVit>=25)badges.push('💎 25 vitórias');
  if(totalJogos>=20)badges.push('⚡ Veterano');
  if(myTitles.length>=1)badges.push('🏆 Campeão');
  if(myTitles.length>=3)badges.push('👑 Multi-Campeão');
  if(badges.length){
    h.push('<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:700;color:#4A5A72;margin-bottom:8px">CONQUISTAS</div><div style="display:flex;flex-wrap:wrap;gap:6px">');
    badges.forEach(function(b){h.push('<span style="background:rgba(200,168,75,.15);color:#C8A84B;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">'+b+'</span>')});
    h.push('</div></div>');
  }

  // ÚLTIMAS PARTIDAS
  var myMatches=S.matches.filter(function(m){return m.pA===p.id||m.pB===p.id}).slice(-5).reverse();
  if(myMatches.length){
    h.push('<div style="font-size:11px;font-weight:700;color:#4A5A72;margin-bottom:8px">ÚLTIMAS PARTIDAS</div>');
    myMatches.forEach(function(m){
      var won=m.winnerId===p.id;var opp=m.pA===p.id?m.pB:m.pA;
      var myS=m.pA===p.id?m.sA:m.sB,opS=m.pA===p.id?m.sB:m.sA;
      h.push('<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161E2E;border-radius:8px;margin-bottom:6px">');
      h.push('<span style="font-size:14px;font-weight:700;color:'+(won?'#22C55E':'#EF4444')+'">'+(won?'V':'D')+'</span>');
      h.push('<div style="flex:1"><div style="font-size:13px;font-weight:600">vs '+nm_(opp)+'</div><div style="font-size:11px;color:#4A5A72">'+(m.arena||'—')+' · '+m.date+'</div></div>');
      h.push('<div style="font-weight:800;font-size:14px;color:'+(won?'#22C55E':'#EF4444')+'">'+myS+'×'+opS+'</div>');
      h.push('</div>');
    });
  }

  // ESTATÍSTICAS AVANÇADAS
  var allM=S.matches.filter(function(m){return m.pA===p.id||m.pB===p.id}).sort(function(a,b){return new Date(a.created)-new Date(b.created)});
  if(allM.length>=3){
    h.push('<div style="font-size:11px;font-weight:700;color:#4A5A72;margin-bottom:8px;margin-top:6px">📊 ESTATÍSTICAS AVANÇADAS</div>');
    h.push('<div style="background:#161E2E;border-radius:12px;padding:14px;margin-bottom:10px">');
    // Win rate
    var wins=allM.filter(function(m){return m.winnerId===p.id}).length;
    var winRate=Math.round(wins/allM.length*100);
    h.push('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">');
    h.push('<span style="font-size:12px;color:#4A5A72">Taxa de vitória</span>');
    h.push('<span style="font-size:18px;font-weight:900;color:'+(winRate>=50?'#22C55E':'#EF4444')+'">'+winRate+'%</span>');
    h.push('</div>');
    // Barra progresso
    h.push('<div style="height:6px;background:#06080D;border-radius:3px;margin-bottom:12px"><div style="height:100%;width:'+winRate+'%;background:linear-gradient(90deg,#C8A84B,#22C55E);border-radius:3px"></div></div>');
    // Sequência atual
    var seq=0,seqType='';
    for(var mi=allM.length-1;mi>=0;mi--){
      var w=allM[mi].winnerId===p.id;
      if(mi===allM.length-1){seqType=w?'V':'D';seq=1;}
      else if((w&&seqType==='V')||(!w&&seqType==='D'))seq++;
      else break;
    }
    h.push('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">');
    h.push('<span style="font-size:12px;color:#4A5A72">Sequência atual</span>');
    h.push('<span style="font-size:14px;font-weight:700;color:'+(seqType==='V'?'#22C55E':'#EF4444')+'">'+seq+(seqType==='V'?' vitórias':(seq===1?' derrota':' derrotas'))+'</span>');
    h.push('</div>');
    // Últimas 5 partidas
    h.push('<div style="font-size:11px;color:#4A5A72;margin-bottom:6px">Últimas '+Math.min(5,allM.length)+' partidas</div>');
    h.push('<div style="display:flex;gap:5px;margin-bottom:10px">');
    allM.slice(-5).forEach(function(m){
      var w=m.winnerId===p.id;
      h.push('<div style="width:32px;height:32px;border-radius:50%;background:'+(w?'rgba(34,197,94,.15)':'rgba(239,68,68,.15)')+';border:2px solid '+(w?'#22C55E':'#EF4444')+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:'+(w?'#22C55E':'#EF4444')+'">'+(w?'V':'D')+'</div>');
    });
    h.push('</div>');
    // % por categoria do adversário
    var catMap={Pro:0,A:0,B:0,C:0,D:0},catTotal={Pro:0,A:0,B:0,C:0,D:0};
    allM.forEach(function(m){
      var oppId=m.pA===p.id?m.pB:m.pA;
      var opp=S.players.find(function(x){return x.id===oppId});
      var cat=opp&&opp.cat;
      if(cat&&catMap[cat]!==undefined){
        catTotal[cat]++;
        if(m.winnerId===p.id)catMap[cat]++;
      }
    });
    var hasCat=Object.keys(catTotal).some(function(c){return catTotal[c]>0});
    if(hasCat){
      h.push('<div style="font-size:11px;color:#4A5A72;margin-bottom:6px">Win rate por categoria do adversário</div>');
      ['Pro','A','B','C','D'].forEach(function(cat){
        if(!catTotal[cat])return;
        var pct=Math.round(catMap[cat]/catTotal[cat]*100);
        h.push('<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">');
        h.push('<div style="font-size:11px;font-weight:700;color:#C8A84B;min-width:28px">'+cat+'</div>');
        h.push('<div style="flex:1;height:6px;background:#06080D;border-radius:3px"><div style="height:100%;width:'+pct+'%;background:'+(pct>=50?'#22C55E':'#EF4444')+';border-radius:3px"></div></div>');
        h.push('<div style="font-size:11px;font-weight:700;color:'+(pct>=50?'#22C55E':'#EF4444')+';min-width:36px;text-align:right">'+pct+'%</div>');
        h.push('<div style="font-size:10px;color:#4A5A72">('+catTotal[cat]+')</div>');
        h.push('</div>');
      });
    }
    h.push('</div>');
  }

  // CONFRONTO DIRETO (head-to-head)
  var opponents=S.players.filter(function(x){return x.id!==p.id});
  if(opponents.length>0){
    h.push('<div style="font-size:11px;font-weight:700;color:#4A5A72;margin-bottom:8px;margin-top:6px">⚔️ CONFRONTO DIRETO</div>');
    h.push('<div style="display:flex;gap:6px;margin-bottom:10px">');
    h.push('<select id="h2h-sel" class="inp" style="margin:0;flex:1" onchange="set({h2hOpp:this.value})">');
    h.push('<option value="">Escolher adversário…</option>');
    opponents.sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(o){
      h.push('<option value="'+o.id+'"'+(S.h2hOpp===o.id?' selected':'')+'>'+esc(o.name)+'</option>');
    });
    h.push('</select>');
    h.push('</div>');

    if(S.h2hOpp){
      var opp=S.players.find(function(x){return x.id===S.h2hOpp});
      var dual=S.matches.filter(function(m){return (m.pA===p.id&&m.pB===S.h2hOpp)||(m.pB===p.id&&m.pA===S.h2hOpp)})
        .sort(function(a,b){return new Date(b.date)-new Date(a.date)});
      var myW=dual.filter(function(m){return m.winnerId===p.id}).length;
      var opW=dual.length-myW;
      if(opp){
        h.push('<div style="background:#161E2E;border-radius:12px;padding:14px;margin-bottom:14px">');
        h.push('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(dual.length?'10px':'0')+'">');
        h.push('<div style="font-size:13px;font-weight:700">'+esc(p.name)+' <span style="color:#4A5A72">vs</span> '+esc(opp.name)+'</div>');
        h.push('<div style="font-size:18px;font-weight:900"><span style="color:#22C55E">'+myW+'</span><span style="color:#4A5A72;font-weight:400"> — </span><span style="color:#EF4444">'+opW+'</span></div>');
        h.push('</div>');
        if(dual.length===0){
          h.push('<div style="font-size:12px;color:#4A5A72">Nenhum confronto registrado ainda.</div>');
        }else{
          dual.forEach(function(m){
            var won2=m.winnerId===p.id;
            var myS2=m.pA===p.id?m.sA:m.sB,opS2=m.pA===p.id?m.sB:m.sA;
            h.push('<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#06080D;border-radius:8px;margin-bottom:5px">');
            h.push('<span style="font-size:13px;font-weight:700;color:'+(won2?'#22C55E':'#EF4444')+'">'+(won2?'V':'D')+'</span>');
            h.push('<div style="flex:1;font-size:11px;color:#4A5A72">'+(m.arena||'—')+' · '+m.date+'</div>');
            h.push('<div style="font-weight:800;font-size:13px;color:'+(won2?'#22C55E':'#EF4444')+'">'+myS2+'×'+opS2+'</div>');
            h.push('</div>');
          });
        }
        h.push('</div>');
      }
    }
  }


  // HISTÓRICO DE DUPLAS
  var pHist=partnerHistory(p.id);
  if(pHist.length>0){
    h.push('<div style="font-size:11px;font-weight:700;color:#4A5A72;margin-bottom:8px;margin-top:6px">🤝 HISTÓRICO DE DUPLAS</div>');
    pHist.forEach(function(ph){
      var partner=S.players.find(function(x){return x.id===ph.partnerId});
      var open=S.duplaHistOpp===ph.partnerId;
      h.push('<div style="background:#161E2E;border-radius:12px;padding:12px 14px;margin-bottom:8px">');
      h.push('<div onclick="set({duplaHistOpp:'+(open?'null':"'"+ph.partnerId+"'")+'})" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">');
      h.push('<div style="font-size:13px;font-weight:700">'+(partner?esc(partner.name):'?')+'</div>');
      h.push('<div style="display:flex;align-items:center;gap:8px"><span style="font-size:15px;font-weight:900"><span style="color:#22C55E">'+ph.wins+'</span><span style="color:#4A5A72;font-weight:400"> — </span><span style="color:#EF4444">'+ph.losses+'</span></span><span style="color:#4A5A72;font-size:12px">'+(open?'▲':'▼')+'</span></div>');
      h.push('</div>');
      if(open){
        h.push('<div style="margin-top:8px">');
        ph.games.slice().reverse().forEach(function(g){
          h.push('<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #06080D">');
          h.push('<span style="font-size:12px;font-weight:700;color:'+(g.won?'#22C55E':'#EF4444')+'">'+(g.won?'V':'D')+'</span>');
          h.push('<div style="flex:1;font-size:11px;color:#4A5A72">'+esc(g.tname||'')+(g.arena?' · '+esc(g.arena):'')+' · '+g.date+'</div>');
          h.push('<div style="font-weight:800;font-size:12px;color:'+(g.won?'#22C55E':'#EF4444')+'">'+g.myS+'×'+g.opS+'</div>');
          h.push('</div>');
        });
        h.push('</div>');
      }
      h.push('</div>');
    });
  }

  return h.join('');
}

// ── INIT ──
// Carrega do localStorage enquanto aguarda Firebase
var stored_p=load('bl_p');var stored_m=load('bl_m');var stored_t=load('bl_t');var stored_n=load('bl_n');var stored_c=load('bl_conv');var stored_g=load('bl_gchat');var stored_ch=load('bl_chal');var stored_ui=load('bl_ui');
if(stored_p)S.players=stored_p;
if(stored_m)S.matches=stored_m;
if(stored_t)S.tours=stored_t;
if(stored_n)S.notifications=stored_n;
if(stored_c)S.conversations=stored_c;
if(stored_g)S.generalChat=stored_g;
if(stored_ch)S.challenges=stored_ch;
// Restaurar aba e torneio aberto após refresh
if(stored_ui){
  if(stored_ui.tab)S.tab=stored_ui.tab;
  if(stored_ui.selId&&S.tours){var _rt=S.tours.find(function(t){return t.id===stored_ui.selId});if(_rt){S.sel=_rt;S.modal='tournament';}}
}
render();

// Listener Firebase — sincroniza em tempo real com todos os dispositivos
fbdb.ref('/').on('value', function(snapshot){
  var data=snapshot.val()||{};
  var changed=false;
  if(data.bl_p){S.players=data.bl_p;changed=true}
  if(data.bl_m){S.matches=data.bl_m;changed=true}
  if(data.bl_t){
    S.tours=data.bl_t;changed=true;
    // Atualiza S.sel se o torneio aberto foi modificado (sincroniza pra todos os devices)
    if(S.sel&&S.sel.id){
      var updated=data.bl_t.find(function(t){return t.id===S.sel.id});
      if(updated)S.sel=updated;
    }
  }
  if(data.bl_n){S.notifications=data.bl_n;changed=true}
  if(data.bl_conv){S.conversations=data.bl_conv;changed=true}
  if(data.bl_gchat){S.generalChat=data.bl_gchat;changed=true}
  if(data.bl_chal){S.challenges=data.bl_chal;changed=true}
  if(changed)render();
}, function(err){
  console.warn('Firebase offline, usando localStorage');
});
</script>

<script>
(function(){
  var _dp;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();_dp=e;
    document.getElementById('pwa-banner').style.display='block';
  });
  var btn=document.getElementById('pwa-btn');
  if(btn) btn.addEventListener('click',function(){
    if(_dp){_dp.prompt();_dp.userChoice.then(function(){_dp=null;document.getElementById('pwa-banner').style.display='none';});}
  });
  window.addEventListener('appinstalled',function(){document.getElementById('pwa-banner').style.display='none';});
})();
</script>

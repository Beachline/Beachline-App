// ── BLI ──
function bli(pid,matches){
  var now=Date.now();
  return Math.round(matches.filter(function(m){return m.winnerId===pid}).reduce(function(s,m){
    var d=(now-new Date(m.date).getTime())/86400000;
    return s+100*(d>90?.4:d>30?.7:1);
  },0));
}
function stats(pid,matches){
  var pm=matches.filter(function(m){return m.pA===pid||m.pB===pid});
  var w=pm.filter(function(m){return m.winnerId===pid}).length;
  return{played:pm.length,wins:w,losses:pm.length-w,rate:pm.length>0?Math.round(w/pm.length*100):0};
}
function bliHist(pid,matches){
  var s=matches.filter(function(m){return m.pA===pid||m.pB===pid}).sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  var r=[],d=[];s.forEach(function(m){r.push(m);d.push({v:bli(pid,r)})});return d;
}

// ── REI/RAINHA ──
var RR_MISTA=[4,8,16,32];
function validRR(n,cat,c){if(n<4)return false;if(cat==='mista')return RR_MISTA.indexOf(n)>=0;return Math.min(c,Math.floor(n/4))>=1}
function optC(n,max){return Math.min(max,Math.floor(n/4))}
function berger(active,r){
  var n=active.length;if(n<4||n%4!==0)return[];
  var wh=active.slice(1),st=r%(n-1);
  var rot=wh.slice(st).concat(wh.slice(0,st));
  var arr=[active[0]].concat(rot);
  var pairs=[];for(var i=0;i<n/2;i++)pairs.push([arr[i],arr[n-1-i]]);
  var cs=[];for(var c=0;c<n/4;c++)cs.push({id:uid(),t1:pairs[c*2],t2:pairs[c*2+1],sA:null,sB:null});
  return cs;
}
// ── BERGER MISTO V2 — garante sempre 1H+1M por equipe ──
// Parceiros: Latin square — homem[i] joga com mulher[(i+r)%half] (cobre todas as combinações em `half` rodadas, sem repetir dupla)
// Adversários: busca aleatória que maximiza cobertura H-vs-H e M-vs-M, evitando repetir jogo (conjunto de 4 jogadores)
function bergerMistaV2(men,women){
  var n=men.length; // n homens = n mulheres
  // Berger Round-Robin determinístico: n-1 rodadas, cada par de homens se enfrenta EXATAMENTE UMA VEZ
  // Fix men[n-1]; rotaciona men[0..n-2]
  var numR=n-1;
  function bergerPairs(n){
    var rounds=[];
    for(var r=0;r<n-1;r++){
      var rot=[];for(var i=0;i<n-1;i++)rot.push((r+i)%(n-1));
      var pairs=[[rot[0],n-1]];
      for(var i=1;i<=(n-2)/2;i++)pairs.push([rot[i],rot[n-1-i]]);
      rounds.push(pairs);
    }
    return rounds;
  }
  var menPairs=bergerPairs(n);
  // Parceiro: man[i] joga com woman[(i+r)%n] na rodada r
  // Isso garante: cada (homem, mulher) parceria aparece no máximo uma vez (Latin square)
  // E como todos os índices de homens são distintos, cada mulher joga exatamente uma vez por rodada
  return menPairs.map(function(pairs,r){
    return pairs.map(function(pr){
      var a=pr[0],b=pr[1];
      return{id:uid(),t1:[men[a],women[(a+r)%n]],t2:[men[b],women[(b+r)%n]],sA:null,sB:null};
    });
  });
}

function genSchedMista(pids,players,nrO,nc){
  // Separa por gênero
  var men=pids.filter(function(id){var p=players.find(function(p){return p.id===id});return p&&p.gender==='M'});
  var women=pids.filter(function(id){var p=players.find(function(p){return p.id===id});return p&&p.gender==='F'});
  var roundsCourts=bergerMistaV2(men,women);
  var courtsPerRound=roundsCourts[0]?roundsCourts[0].length:1;
  nc=nc||courtsPerRound;
  if(nc>=courtsPerRound){
    return roundsCourts.map(function(courts,r){return{round:r+1,sitters:[],courts:courts}});
  }
  // Repacotamento: limita a `nc` quadras por rodada. Jogos que não couberem
  // ficam na frente da fila — seus jogadores têm prioridade na próxima rodada.
  var allPids=men.concat(women);
  var queue=[];
  roundsCourts.forEach(function(courts){courts.forEach(function(c){queue.push(c)})});
  var out=[];
  while(queue.length){
    var roundCourts=[],used={};
    for(var i=0;i<queue.length&&roundCourts.length<nc;i++){
      var c=queue[i];
      var ppl=c.t1.concat(c.t2);
      if(ppl.some(function(p){return used[p]}))continue;
      ppl.forEach(function(p){used[p]=true});
      roundCourts.push(c);
    }
    if(roundCourts.length===0)break; // segurança
    queue=queue.filter(function(c){return roundCourts.indexOf(c)<0});
    var sitters=allPids.filter(function(p){return !used[p]});
    out.push({round:out.length+1,sitters:sitters,courts:roundCourts});
  }
  return out;
}

function genSched(pids,nc,nrO){
  var n=pids.length,c=optC(n,nc),play=c*4,sit=n-play;
  if(sit===0){var mr=nrO||(n-1);return Array.from({length:mr},function(_,r){return{round:r+1,sitters:[],courts:berger(pids,r)}})}
  var ls={},pl={};pids.forEach(function(p){ls[p]=-999;pl[p]=0});
  var cy=Math.ceil(n/sit),nr=nrO||cy*3;
  return Array.from({length:nr},function(_,r){
    var sorted=pids.slice().sort(function(a,b){return ls[b]!==ls[a]?ls[b]-ls[a]:pl[a]-pl[b]});
    var active=sorted.slice(0,play),sitters=sorted.slice(play);
    var courts=berger(active,r);
    active.forEach(function(p){pl[p]++});sitters.forEach(function(p){ls[p]=r});
    return{round:r+1,sitters:sitters,courts:courts};
  });
}
function calcSt(sched,pids,crit){
  var all=sched.reduce(function(a,r){return a.concat(r.courts)},[]);
  var st=pids.map(function(pid){
    var mine=all.filter(function(c){return c.sA!=null&&(c.t1.indexOf(pid)>=0||c.t2.indexOf(pid)>=0)});
    var w=0,gF=0,gA=0;
    mine.forEach(function(c){var t1=c.t1.indexOf(pid)>=0;var my=t1?c.sA:c.sB,op=t1?c.sB:c.sA;if(my>op)w++;gF+=my||0;gA+=op||0});
    return{pid:pid,played:mine.length,wins:w,losses:mine.length-w,gF:gF,gA:gA,saldo:gF-gA};
  });
  function h2h(a,b){
    var d=all.filter(function(c){return c.sA!=null&&((c.t1.indexOf(a)>=0&&c.t2.indexOf(b)>=0)||(c.t1.indexOf(b)>=0&&c.t2.indexOf(a)>=0))});
    var aw=0;d.forEach(function(c){var t1=c.t1.indexOf(a)>=0;if((t1?c.sA:c.sB)>(t1?c.sB:c.sA))aw++});
    return aw-(d.length-aw);
  }
  return st.sort(function(a,b){var vd=b.wins-a.wins,sd=b.saldo-a.saldo;var p=crit==='saldo_first'?(sd||vd):(vd||sd);return p||h2h(b.pid,a.pid)});
}


// ══ RANKING CIRCUIT ENGINE ══
var DEFAULT_POINTS = {1:100,2:70,3:50,4:35,5:20,6:20,7:20,8:20,9:10,10:10,11:10,12:10,13:10,14:10,15:10,16:10};
var CAT_MULT = {'Pro':1.0,'A':0.8,'B':0.6,'C':0.4,'D':0.25,'Aberto':1.0,'Recreativo':1.0,'':1.0};

function stagePoints(pos, cat) {
  var base = DEFAULT_POINTS[pos] || (pos <= 32 ? 5 : 0);
  return Math.round(base * (CAT_MULT[cat] || 1.0));
}

function getStageResults(stage) {
  // Returns {pid: position} for finished stage
  var results = {};
  if (stage.format === 'rei_rainha' && stage.schedule) {
    var st = calcSt(stage.schedule, stage.players || [], stage.criteria || 'wins_first');
    st.forEach(function(s, i) { results[s.pid] = i + 1; });
  } else if (stage.rounds) {
    // Elimination: trace bracket positions
    var last = stage.rounds[stage.rounds.length - 1];
    if (!last) return results;
    // Champion
    if (stage.champion) results[stage.champion] = 1;
    // Vice (loser of final)
    if (last.matches && last.matches[0]) {
      var finalist = last.matches[0];
      var vice = finalist.winnerId === finalist.p1 ? finalist.p2 : finalist.p1;
      if (vice) results[vice] = 2;
    }
    // 3rd/4th from semifinal losers
    if (stage.rounds.length >= 2) {
      var semis = stage.rounds[stage.rounds.length - 2];
      var pos3 = 3;
      if (semis && semis.matches) {
        semis.matches.forEach(function(m) {
          var loser = m.winnerId === m.p1 ? m.p2 : m.p1;
          if (loser && !results[loser]) { results[loser] = pos3; pos3++; }
        });
      }
    }
    // Everyone else
    (stage.players || []).forEach(function(pid) {
      if (!results[pid]) results[pid] = 17; // participation
    });
  }
  return results;
}

function calcCircuitStandings(circuit) {
  var playerPts = {}, playerTitles = {}, playerVices = {}, playerPodiums = {};
  (circuit.stages || []).forEach(function(stage) {
    if (stage.status !== 'finished') return;
    var results = stage.results || getStageResults(stage);
    var cat = stage.cat || circuit.categoria || '';
    Object.keys(results).forEach(function(pid) {
      var pos = results[pid];
      var pts = stagePoints(pos, cat);
      playerPts[pid] = (playerPts[pid] || 0) + pts;
      if (pos === 1) playerTitles[pid] = (playerTitles[pid] || 0) + 1;
      if (pos === 2) playerVices[pid]  = (playerVices[pid]  || 0) + 1;
      if (pos <= 3)  playerPodiums[pid]= (playerPodiums[pid]|| 0) + 1;
    });
  });
  var allPids = {};
  (circuit.stages || []).forEach(function(s) { (s.players||[]).forEach(function(p){allPids[p]=1;}); });
  return Object.keys(allPids).map(function(pid) {
    return {
      pid:     pid,
      points:  playerPts[pid]   || 0,
      titles:  playerTitles[pid]|| 0,
      vices:   playerVices[pid] || 0,
      podiums: playerPodiums[pid]||0,
      stages:  (circuit.stages||[]).filter(function(s){return (s.players||[]).includes(pid)}).length
    };
  }).sort(function(a,b) {
    if (b.points  !== a.points)  return b.points  - a.points;
    if (b.titles  !== a.titles)  return b.titles  - a.titles;  // 1° critério
    if (b.vices   !== a.vices)   return b.vices   - a.vices;   // 2° critério
    if (b.podiums !== a.podiums) return b.podiums - a.podiums; // 3° critério
    return 0;
  });
}

// ── BRACKET ──
function npow2(n){var p=1;while(p<n)p*=2;return p}
function genBracket(pids,matches){
  var s=pids.slice().sort(function(a,b){return bli(b,matches)-bli(a,matches)});
  var sz=npow2(s.length),pad=s.concat(Array(sz-s.length).fill(null));
  var r1=Array.from({length:sz/2},function(_,i){var p1=pad[i],p2=pad[sz-1-i];return{id:uid(),p1:p1,p2:p2,winnerId:(!p1&&p2)?p2:(!p2&&p1)?p1:null,sA:null,sB:null}});
  return[{round:1,name:'1ª Rodada',matches:r1}];
}

// ── DUPLAS: sorteio, mapa de equipes e bracket por equipe ──
function shuffleArr(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}
  return r;
}
// Sorteia duplas. scope='categoria' agrupa por p.cat antes de sortear; 'open' sorteia todos juntos.
function pairByScope(pids,scope,players){
  var pool=pids.slice();
  var duplas=[];
  if(scope==='categoria'){
    var byCat={};
    pool.forEach(function(id){
      var p=players.find(function(x){return x.id===id});
      var cat=(p&&p.cat)||'—';
      (byCat[cat]=byCat[cat]||[]).push(id);
    });
    var leftover=[];
    Object.keys(byCat).forEach(function(cat){
      var arr=shuffleArr(byCat[cat]);
      while(arr.length>=2)duplas.push([arr.shift(),arr.shift()]);
      if(arr.length)leftover=leftover.concat(arr);
    });
    leftover=shuffleArr(leftover);
    while(leftover.length>=2)duplas.push([leftover.shift(),leftover.shift()]);
    if(leftover.length&&duplas.length)duplas[duplas.length-1].push(leftover.shift());
  }else{
    var arr2=shuffleArr(pool);
    while(arr2.length>=2)duplas.push([arr2.shift(),arr2.shift()]);
    if(arr2.length&&duplas.length)duplas[duplas.length-1].push(arr2.shift());
  }
  return duplas;
}
function teamMapFromDuplas(duplas){
  var map={};duplas.forEach(function(d,i){map['t'+i]=d});return map;
}
function teamBli(team,matches){return team.reduce(function(s,pid){return s+bli(pid,matches)},0)}
// Bracket de eliminação por equipes (duplas). teamIds: ['t0','t1',...]; teamMap: {t0:[pidA,pidB],...}
function genBracketTeams(teamIds,teamMap,matches){
  var s=teamIds.slice().sort(function(a,b){return teamBli(teamMap[b],matches)-teamBli(teamMap[a],matches)});
  var sz=npow2(s.length),pad=s.concat(Array(sz-s.length).fill(null));
  var r1=Array.from({length:sz/2},function(_,i){var p1=pad[i],p2=pad[sz-1-i];return{id:uid(),p1:p1,p2:p2,winnerId:(!p1&&p2)?p2:(!p2&&p1)?p1:null,sA:null,sB:null}});
  return[{round:1,name:'1ª Rodada',matches:r1}];
}
// Round-robin genérico (todos contra todos) para fase de grupos. Funciona com qualquer n>=2.
function roundRobinAll(ids){
  var arr=ids.slice();
  if(arr.length%2!==0)arr.push(null); // bye
  var n=arr.length,numR=n-1,half=n/2;
  var rounds=[];
  var cur=arr.slice();
  for(var r=0;r<numR;r++){
    var courts=[];
    for(var i=0;i<half;i++){
      var a=cur[i],b=cur[n-1-i];
      if(a!==null&&b!==null)courts.push({id:uid(),t1:[a],t2:[b],sA:null,sB:null});
    }
    rounds.push({round:r+1,courts:courts});
    // rotate (mantém cur[0] fixo)
    var last=cur[n-1];
    for(var k=n-1;k>1;k--)cur[k]=cur[k-1];
    cur[1]=last;
  }
  return rounds;
}
// Divide teamIds em numGroups grupos balanceados (snake por bli)
function splitGroups(teamIds,teamMap,matches,numGroups){
  var sorted=teamIds.slice().sort(function(a,b){return teamBli(teamMap[b],matches)-teamBli(teamMap[a],matches)});
  var groups=Array.from({length:numGroups},function(){return[]});
  sorted.forEach(function(id,i){
    var cyc=Math.floor(i/numGroups),g=cyc%2===0?(i%numGroups):(numGroups-1-(i%numGroups));
    groups[g].push(id);
  });
  return groups.filter(function(g){return g.length>0});
}
function advR(rounds){
  var last=rounds[rounds.length-1];
  if(!last.matches.every(function(m){return m.winnerId}))return rounds;
  var w=last.matches.map(function(m){return m.winnerId}).filter(Boolean);
  if(w.length===1)return rounds;
  var rn=rounds.length+1,rname=rn>=5?'Final':rn===4?'Semifinal':rn===3?'Quartas':rn+'ª Rodada';
  var nm=[];for(var i=0;i<w.length;i+=2)nm.push({id:uid(),p1:w[i],p2:w[i+1]||null,winnerId:w[i+1]?null:w[i],sA:null,sB:null});
  return rounds.concat([{round:rn,name:rname,matches:nm}]);
}

var RR_POS_POINTS=[100,90,82,75,69,63,58,53,49,45,41,38,35,32,29,27,25,23,21,19,17,15,14,13,12,11,10,10,10,10,10,10];

// Retorna, para um jogador, o histórico de resultados com cada parceiro que já teve
function partnerHistory(pid){
  var map={};
  function add(partnerId,won,myS,opS,arena,date,tname){
    if(!partnerId||partnerId===pid)return;
    if(!map[partnerId])map[partnerId]={wins:0,losses:0,games:[]};
    if(won)map[partnerId].wins++;else map[partnerId].losses++;
    map[partnerId].games.push({won:won,myS:myS,opS:opS,arena:arena,date:date,tname:tname});
  }
  S.tours.forEach(function(t){
    // Rei/Rainha Mista: parceiro muda a cada rodada
    if(t.format==='rei_rainha'&&t.categoria==='mista'&&t.schedule){
      t.schedule.forEach(function(r){
        r.courts.forEach(function(c){
          if(c.sA==null)return;
          [[c.t1,c.t2,c.sA,c.sB],[c.t2,c.t1,c.sB,c.sA]].forEach(function(side){
            var team=side[0],opS_=side[1],myS=side[2],opS=side[3];
            if(!team||team.indexOf(pid)<0)return;
            var partnerId=team.find(function(x){return x!==pid});
            add(partnerId,myS>opS,myS,opS,t.arena,t.date,t.name);
          });
        });
      });
    }
    // Eliminação/Simples com duplas (fixas/sorteio): teamMap define a dupla
    if(t.teamMap&&Object.keys(t.teamMap).length&&t.rounds){
      Object.keys(t.teamMap).forEach(function(teamId){
        var team=t.teamMap[teamId];
        if(team.indexOf(pid)<0)return;
        var partnerId=team.find(function(x){return x!==pid});
        (t.rounds||[]).forEach(function(round){
          (round.matches||[]).forEach(function(m){
            if(m.sA==null)return;
            if(m.p1===teamId||m.p2===teamId){
              var mine=m.p1===teamId;
              var myS=mine?m.sA:m.sB,opS=mine?m.sB:m.sA;
              add(partnerId,m.winnerId===teamId,myS,opS,t.arena,t.date,t.name);
            }
          });
        });
      });
    }
  });
  return Object.keys(map).map(function(id){return Object.assign({partnerId:id},map[id])})
    .sort(function(a,b){return(b.wins+b.losses)-(a.wins+a.losses)});
}

// ─── DANÇA DAS QUADRAS ENGINE ────────────────────────────────
function dancaShuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}
  return a;
}
function dancaGenSwapTimes(totalMs,numTrocas){
  // Generate numTrocas random times within totalMs, sorted ascending
  var times=[];
  for(var i=0;i<numTrocas;i++) times.push(Math.floor(Math.random()*totalMs*0.8)+totalMs*0.1);
  times.sort(function(a,b){return a-b});
  // Ensure minimum gap of 60s between swaps
  for(var i=1;i<times.length;i++) if(times[i]-times[i-1]<60000) times[i]=times[i-1]+60000;
  return times;
}
function dancaInit(tid){

  while(players.length<24)players.push(null);
  var grpLabels=['A','B','C','D'];
  var courtLabels=['Ouro','Prata','Bronze'];
  var groups=grpLabels.map(function(g,gi){
    var base=gi*6;
    // Generate random swap times for this group

      id:g,

      }),

  g.status='active';
  g.timerStart=now;
  g.timerEnd=now+g.totalMs;
  g.swapsDone=0;
  dd.activeGroup=grpIdx;
  var updated=S.tours.map(function(x){
    return x.id===tid?Object.assign({},x,{dancaData:dd}):x;
  });
  set({tours:updated});
  // Start tick interval for this group
  if(S._dancaTimer) clearInterval(S._dancaTimer);
  S._dancaTimer=setInterval(function(){dancaTick(tid,grpIdx);},1000);
  render();
}

function dancaDoSwap(tid,grpIdx){
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t||!t.dancaData)return;
  var dd=JSON.parse(JSON.stringify(t.dancaData));
  var g=dd.groups[grpIdx];
  // Rotate players between courts randomly
  var allP=g.players.filter(Boolean);
  var shuffled=dancaShuffle(allP);
  g.courts.forEach(function(c,ci){c.p1=shuffled[ci*2]||null;c.p2=shuffled[ci*2+1]||null;});
  g.swapsDone=(g.swapsDone||0)+1;
  dd.groups[grpIdx]=g;
  S._swapNotif={tid:tid,grpIdx:grpIdx,swapNum:g.swapsDone};
  var updated=S.tours.map(function(x){
    return x.id===tid?Object.assign({},x,{dancaData:dd}):x;
  });
  set({tours:updated});
  render();
}

function dancaTick(tid,grpIdx){
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t||!t.dancaData)return;
  var g=t.dancaData.groups[grpIdx];
  if(!g||g.status!=='active'){clearInterval(S._dancaTimer);return;}
  var now=Date.now();
  var elapsed=now-g.timerStart;
  // Check swap times
  var nextSwapIdx=g.swapsDone||0;
  if(nextSwapIdx<g.swapTimes.length && elapsed>=g.swapTimes[nextSwapIdx]){
    dancaDoSwap(tid,grpIdx);
    return;
  }
  // Check time end
  if(elapsed>=g.totalMs){
    clearInterval(S._dancaTimer);
    S._timeUpNotif=tid;
  }
  render();
}

function dancaSetCourtScore(tid,grpIdx,courtIdx,scoreA,scoreB){
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t||!t.dancaData)return;
  var dd=JSON.parse(JSON.stringify(t.dancaData));
  dd.groups[grpIdx].courts[courtIdx].scoreA=parseInt(scoreA)||0;
  dd.groups[grpIdx].courts[courtIdx].scoreB=parseInt(scoreB)||0;
  dd.groups[grpIdx].courts[courtIdx].done=true;
  var updated=S.tours.map(function(x){
    return x.id===tid?Object.assign({},x,{dancaData:dd}):x;
  });
  set({tours:updated});
}

function dancaFinishGroup(tid,grpIdx){
  // Mark group done. Rankings are: p1 of each court = rank1, p2 = rank2 for that court
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t||!t.dancaData)return;
  var dd=JSON.parse(JSON.stringify(t.dancaData));
  var g=dd.groups[grpIdx];
  g.status='done';
  // rankX[0]=winner, rankX[1]=loser for each court
  ['Ouro','Prata','Bronze'].forEach(function(c){
    var court=g.courts.find(function(x){return x.court===c});
    if(!court)return;
    var winnerFirst=court.scoreA>=court.scoreB;
    g['rank'+c]=[winnerFirst?court.p1:court.p2, winnerFirst?court.p2:court.p1];
  });
  // Check if all groups done → generate finals
  var allDone=dd.groups.every(function(x){return x.status==='done'});
  if(allDone){
    dd.phase='finals';
    dd.finals=dancaGenFinals(dd.groups);
  }
  var updated=S.tours.map(function(x){
    return x.id===tid?Object.assign({},x,{dancaData:dd}):x;
  });
  set({tours:updated});
  render();
}

function dancaGenFinals(groups){
  // For each court category, 8 players: 2 from each of 4 groups
  // Seeding: 1A×2B, 1B×2A, 1C×2D, 1D×2C (cross-group bracket)
  var cats=['Ouro','Prata','Bronze'];
  var grpIds=['A','B','C','D'];
  var finals={};
  cats.forEach(function(cat){
    // Collect: [rank0ofA, rank0ofB, rank0ofC, rank0ofD] and [rank1ofA...]
    var tops=grpIds.map(function(g){
      var grp=groups.find(function(x){return x.id===g});
      return grp&&grp['rank'+cat]?grp['rank'+cat][0]:null;
    });
    var secs=grpIds.map(function(g){
      var grp=groups.find(function(x){return x.id===g});
      return grp&&grp['rank'+cat]?grp['rank'+cat][1]:null;
    });
    // Matches: tops[i] vs secs[(i+1)%4]
    var qf=[
      {id:uid(),p1:tops[0],p2:secs[1],scoreA:null,scoreB:null,winner:null,label:'1A × 2B'},
      {id:uid(),p1:tops[1],p2:secs[0],scoreA:null,scoreB:null,winner:null,label:'1B × 2A'},
      {id:uid(),p1:tops[2],p2:secs[3],scoreA:null,scoreB:null,winner:null,label:'1C × 2D'},
      {id:uid(),p1:tops[3],p2:secs[2],scoreA:null,scoreB:null,winner:null,label:'1D × 2C'}
    ];
    var sf=[
      {id:uid(),p1:null,p2:null,scoreA:null,scoreB:null,winner:null,label:'Semi 1 (W1×W2)'},
      {id:uid(),p1:null,p2:null,scoreA:null,scoreB:null,winner:null,label:'Semi 2 (W3×W4)'}
    ];
    var fin=[{id:uid(),p1:null,p2:null,scoreA:null,scoreB:null,winner:null,label:'Final'}];
    finals[cat]={qf:qf,sf:sf,fin:fin,champion:null};
  });
  return finals;
}

function dancaSetFinalScore(tid,cat,phase,matchIdx,scoreA,scoreB){
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t||!t.dancaData||!t.dancaData.finals)return;
  var dd=JSON.parse(JSON.stringify(t.dancaData));
  var bracket=dd.finals[cat];
  var matches=bracket[phase];
  var m=matches[matchIdx];
  m.scoreA=parseInt(scoreA)||0;
  m.scoreB=parseInt(scoreB)||0;
  m.winner=m.scoreA>=m.scoreB?m.p1:m.p2;
  // Advance winners
  if(phase==='qf'){
    if(matchIdx===0||matchIdx===1) bracket.sf[0].p1=bracket.sf[0].p1||matches[0].winner, bracket.sf[0].p2=bracket.sf[0].p2||matches[1].winner;
    if(matchIdx===2||matchIdx===3) bracket.sf[1].p1=bracket.sf[1].p1||matches[2].winner, bracket.sf[1].p2=bracket.sf[1].p2||matches[3].winner;
    // update properly
    if(matches[0].winner&&matches[1].winner){bracket.sf[0].p1=matches[0].winner;bracket.sf[0].p2=matches[1].winner;}
    if(matches[2].winner&&matches[3].winner){bracket.sf[1].p1=matches[2].winner;bracket.sf[1].p2=matches[3].winner;}
  } else if(phase==='sf'){
    if(bracket.sf[0].winner&&bracket.sf[1].winner){
      bracket.fin[0].p1=bracket.sf[0].winner;
      bracket.fin[0].p2=bracket.sf[1].winner;
    }
  } else if(phase==='fin'){
    bracket.champion=m.winner;
    dd.finals[cat].champion=m.winner;
  }
  var allChamps=Object.keys(dd.finals||{}).every(function(c){return dd.finals[c].champion});
  var updated=S.tours.map(function(x){
    return x.id===tid?Object.assign({},x,{dancaData:dd,status:allChamps?'done':'active'}):x;
  });
  set({tours:updated});
  render();
}

// ─── BEACH TENNIS SCORING ENGINE ────────────────────────────
var BT_PTS=['0','15','30','40','Van'];
function btInitState(){
  S.bt={phase:'game',pA:0,pB:0,deuce:false,advA:false,advB:false,
        gA:0,gB:0,tbA:0,tbB:0,tbTotal:0,tbFirstServer:'A',
        showSide:false,winner:null,setDone:false};
}
function btServer(){
  // In tie-break: A serves 1st, then 2-2-2...
  var n=S.bt.tbTotal;
  if(n===0) return S.bt.tbFirstServer;
  var other=S.bt.tbFirstServer==='A'?'B':'A';
  return (Math.floor((n-1)/2)%2===0)?other:S.bt.tbFirstServer;
}
function btTbSideChange(){
  // Side changes when tbTotal % 4 === 1 (after points 1,5,9,13...)
  return S.bt.tbTotal%4===1;
}
function btNeedTb(){return S.bt.gA===6&&S.bt.gB===6;}
function btNeedSuperTb(){return S.bt.gA===5&&S.bt.gB===5;}// placeholder — supertie handled by 'supertie' phase
function btAddPoint(team){
  var b=S.bt;
  if(b.winner)return;
  if(b.showSide){b.showSide=false;render();return;}
  if(b.phase==='game'){
    // Normal game scoring
    if(b.deuce){
      if(team==='A'){if(b.advA){btGameWon('A');}else{b.advA=true;b.advB=false;}}
      else{if(b.advB){btGameWon('B');}else{b.advB=true;b.advA=false;}}
    } else {
      if(team==='A'){b.pA++;if(b.pA>=3&&b.pB>=3){b.deuce=true;b.pA=3;b.pB=3;}else if(b.pA>=4){btGameWon('A');}}
      else{b.pB++;if(b.pB>=3&&b.pA>=3){b.deuce=true;b.pA=3;b.pB=3;}else if(b.pB>=4){btGameWon('B');}}
    }
  } else if(b.phase==='tiebreak'||b.phase==='supertie'){
    var limit=b.phase==='supertie'?10:7;
    if(team==='A')b.tbA++;else b.tbB++;
    b.tbTotal++;
    var diff=Math.abs(b.tbA-b.tbB);
    var leader=b.tbA>b.tbB?'A':'B';
    var pts=Math.max(b.tbA,b.tbB);
    if(pts>=limit&&diff>=2){
      b.winner=leader;
      b.setDone=true;
    } else if(btTbSideChange()){
      b.showSide=true;
    }
  }
  render();
}
function btGameWon(team){
  var b=S.bt;
  b.pA=0;b.pB=0;b.deuce=false;b.advA=false;b.advB=false;
  if(team==='A')b.gA++;else b.gB++;
  // Check set win: first to 6 with gap ≥2, or 7-5
  // Amateur: 1 set to 6. At 5-5: play to 7-5 or go tiebreak at 6-6
  var winner=null;
  if(b.gA>=6&&b.gA-b.gB>=2)winner='A';
  else if(b.gB>=6&&b.gB-b.gA>=2)winner='B';
  else if(b.gA===7&&b.gB===5)winner='A';
  else if(b.gB===7&&b.gA===5)winner='B';
  if(winner){b.winner=winner;b.setDone=true;}
  else if(b.gA===6&&b.gB===6){
    // Tie-break time — ask tiebreak type in next render
    b.phase='tiebreak';b.tbA=0;b.tbB=0;b.tbTotal=0;
  }
  // Side change after each game
  b.showSide=true;
  render();
}
function btSubPoint(team){
  var b=S.bt;
  if(b.winner)return;
  if(b.phase==='game'){
    if(b.deuce){b.deuce=false;b.advA=false;b.advB=false;b.pA=3;b.pB=3;}
    else{if(team==='A'&&b.pA>0)b.pA--;else if(team==='B'&&b.pB>0)b.pB--;}
  } else {
    if(team==='A'&&b.tbA>0){b.tbA--;b.tbTotal--;}
    else if(team==='B'&&b.tbB>0){b.tbB--;b.tbTotal--;}
  }
  render();
}
function btScoreLabel(team){
  var b=S.bt;
  if(b.phase==='game'){
    if(b.deuce){return b['adv'+team]?'Van':'Deuce';}
    return BT_PTS[team==='A'?b.pA:b.pB];
  }
  return String(team==='A'?b.tbA:b.tbB);
}

// ─── VOLLEYBALL/FUTEVOLEI SCORING ENGINE ────────────────────
function rlInitState(isFv){
  var limit=isFv?18:21;
  S.rl={isFv:isFv,limit:limit,
        pA:0,pB:0,sA:0,sB:0,phase:'normal',
        tbA:0,tbB:0,showSide:false,winner:null,sideEvery:isFv?6:7};
}
function rlAddPoint(team){
  var r=S.rl;
  if(r.winner)return;
  if(r.showSide){r.showSide=false;render();return;}
  if(r.phase==='normal'){
    if(team==='A')r.pA++;else r.pB++;
    var total=r.pA+r.pB;
    if(total%r.sideEvery===0)r.showSide=true;
    var max=Math.max(r.pA,r.pB),diff=Math.abs(r.pA-r.pB);
    if(max>=r.limit&&diff>=2){rlSetWon(r.pA>r.pB?'A':'B');}
  } else {
    if(team==='A')r.tbA++;else r.tbB++;
    var tot=r.tbA+r.tbB;
    if(tot===8)r.showSide=true;// mid-tiebreak side change
    var mx=Math.max(r.tbA,r.tbB),df=Math.abs(r.tbA-r.tbB);
    if(mx>=15&&df>=2){r.winner=r.tbA>r.tbB?'A':'B';}
  }
  render();
}
function rlSetWon(team){
  var r=S.rl;
  r.pA=0;r.pB=0;
  if(team==='A')r.sA++;else r.sB++;
  // Best of 3: first to 2 sets wins (or 2 for vôlei which is best-of-2 with tiebreak)
  var maxSets=r.isFv?2:2;
  if(r.sA>=maxSets||r.sB>=maxSets){r.winner=r.sA>r.sB?'A':'B';}
  else if(r.sA===1&&r.sB===1){r.phase='tiebreak';r.tbA=0;r.tbB=0;}
  else r.showSide=true;
}
function rlSubPoint(team){
  var r=S.rl;
  if(r.phase==='normal'){if(team==='A'&&r.pA>0)r.pA--;else if(team==='B'&&r.pB>0)r.pB--;}
  else{if(team==='A'&&r.tbA>0)r.tbA--;else if(team==='B'&&r.tbB>0)r.tbB--;}
  render();
}

// ── MODO DESAFIO ──
// Nível das categorias (D=mais fraco → Pro=mais forte)
var CAT_LEVEL={D:1,C:2,B:3,A:4,Pro:5};
function catLevel(cat){return CAT_LEVEL[cat]||3}
// Pontos do desafio: base 20 + bônus proporcional se o vencedor for de categoria mais baixa
// Ex: D vence B (gap=2) → 20+20=40 · B vence A (gap=1) → 20+10=30 · mesma categoria ou favorito → 20
function challengePoints(winnerCat,loserCat){
  var gap=Math.max(0,catLevel(loserCat)-catLevel(winnerCat));
  return 20+gap*10;
}
function sendChallenge(fromIds,toIds){
  if(!fromIds.length||!toIds.length)return;
  var ch={id:uid(),type:'challenge',fromIds:fromIds,toIds:toIds,status:'pending',sA:null,sB:null,winnerSide:null,points:0,created:new Date().toISOString()};
  var u=S.challenges.concat([ch]);save('bl_chal',u);
  var fromName=fromIds.map(function(id){var p=S.players.find(function(x){return x.id===id});return p?p.name:'?'}).join(' / ');
  var n={id:uid(),type:'challenge_invite',challengeId:ch.id,fromPid:fromIds[0],toPid:toIds[0],status:'pending',created:new Date().toISOString()};
  var un=S.notifications.concat([n]);save('bl_n',un);
  set({challenges:u,notifications:un,chalFrom:[],chalTo:[]});
  toast_('Desafio enviado! ⚔️');
}
function respondChallenge(chid,nid,accept){
  var un=S.notifications.map(function(x){return x.id!==nid?x:Object.assign({},x,{status:accept?'accepted':'declined'})});
  var u=S.challenges.map(function(c){return c.id!==chid?c:Object.assign({},c,{status:accept?'accepted':'declined'})});
  save('bl_n',un);save('bl_chal',u);
  set({notifications:un,challenges:u});
  toast_(accept?'Desafio aceito! ⚔️':'Desafio recusado','#'+(accept?'22C55E':'EF4444'));
}
function recChallengeScore(chid,sa,sb){
  if(isNaN(sa)||isNaN(sb)||sa===sb){toast_('Placar inválido / sem empate','#EF4444');return}
  var u=S.challenges.map(function(c){
    if(c.id!==chid)return c;
    var winSide=sa>sb?'from':'to';
    var winIds=winSide==='from'?c.fromIds:c.toIds, loseIds=winSide==='from'?c.toIds:c.fromIds;
    var winCat=avgCat(winIds), loseCat=avgCat(loseIds);
    var pts=challengePoints(winCat,loseCat);
    return Object.assign({},c,{sA:sa,sB:sb,status:'completed',winnerSide:winSide,points:pts});
  });
  save('bl_chal',u);set({challenges:u});
  toast_('Resultado registrado! +'+ (u.find(function(c){return c.id===chid}).points)+' pts ⚔️');
}
function avgCat(pids){
  var lvls=pids.map(function(pid){var p=S.players.find(function(x){return x.id===pid});return catLevel(p&&p.cat)});
  var avg=lvls.reduce(function(a,b){return a+b},0)/lvls.length;
  var names=Object.keys(CAT_LEVEL);
  return names.reduce(function(best,c){return Math.abs(CAT_LEVEL[c]-avg)<Math.abs(CAT_LEVEL[best]-avg)?c:best},names[0]);
}
// Pontos acumulados de desafios vencidos por um jogador
function challengePointsFor(pid){
  return S.challenges.filter(function(c){return c.status==='completed'}).reduce(function(sum,c){
    var winIds=c.winnerSide==='from'?c.fromIds:c.toIds;
    return sum+(winIds.indexOf(pid)>=0?c.points:0);
  },0);
}

// ── CONVERSAS (DM + Grupos) ──
function createDM(pidA,pidB){
  if(!pidA||!pidB||pidA===pidB)return;
  var existing=S.conversations.find(function(c){return c.type==='dm'&&c.participants.indexOf(pidA)>=0&&c.participants.indexOf(pidB)>=0});
  if(existing){set({convView:existing.id,chatPicker:null,chatPickSel:[]});return}
  var c={id:uid(),type:'dm',name:'',participants:[pidA,pidB],messages:[],created:new Date().toISOString()};
  var u=S.conversations.concat([c]);save('bl_conv',u);
  set({conversations:u,convView:c.id,chatPicker:null,chatPickSel:[]});
}
function createGroup(name,pids){
  if(!name.trim()||pids.length<2)return;
  var c={id:uid(),type:'group',name:name.trim(),participants:pids.slice(),messages:[],created:new Date().toISOString()};
  var u=S.conversations.concat([c]);save('bl_conv',u);
  set({conversations:u,convView:c.id,chatPicker:null,chatPickSel:[],groupName:''});
}
function toggleChatPick(pid){
  var arr=(S.chatPickSel||[]).slice();
  var i=arr.indexOf(pid);
  if(i>=0)arr.splice(i,1);else arr.push(pid);
  S.chatPickSel=arr;renderSheet();
}
function sendGeneralMsg(){
  var inp=document.getElementById('chat-input');
  var txt=inp?inp.value:'';
  if(!txt||!txt.trim())return;
  var myIds_g=load('bl_myids')||[];var fromPid=S.chatGenAs||(myIds_g.length?myIds_g[0]:null)||(S.players[0]&&S.players[0].id)||'';
  if(!fromPid){toast_('Cadastre um jogador primeiro','#EF4444');return}
  var m={id:uid(),fromPid:fromPid,text:txt.trim(),created:new Date().toISOString()};
  var u=(S.generalChat||[]).concat([m]);save('bl_gchat',u);
  set({generalChat:u});
  setTimeout(function(){
    var box=document.getElementById('chat-box');if(box)box.scrollTop=box.scrollHeight;
    var inp2=document.getElementById('chat-input');if(inp2)inp2.value='';
  },50);
}
function sendChatMsg(){sendGeneralMsg()}
function sendConvMsg(convId){
  var inp=document.getElementById('chat-input');
  var txt=inp?inp.value:'';
  if(!txt||!txt.trim())return;
  var u=S.conversations.map(function(c){
    if(c.id!==convId)return c;
    var fromPid=c.participants[0];
    var m={id:uid(),fromPid:fromPid,text:txt.trim(),created:new Date().toISOString()};
    return Object.assign({},c,{messages:c.messages.concat([m])});
  });
  save('bl_conv',u);
  set({conversations:u});
  setTimeout(function(){
    var box=document.getElementById('chat-box');if(box)box.scrollTop=box.scrollHeight;
    var inp2=document.getElementById('chat-input');if(inp2)inp2.value='';
  },50);
}
function convTitle(c){
  if(c.type==='group')return c.name;
  var others=c.participants.map(function(pid){var p=S.players.find(function(x){return x.id===pid});return p?p.name:'?'});
  return others.join(' & ');
}

    h.push('<button onclick="set({chatPicker:\'group\',chatPickSel:[]})" style="flex:1;padding:10px;border:1.5px solid '+(S.chatPicker==='group'?'#C8A84B':'#1C2740')+';border-radius:10px;background:'+(S.chatPicker==='group'?'rgba(200,168,75,.1)':'#161E2E')+';color:'+(S.chatPicker==='group'?'#C8A84B':'#4A5A72')+';font-weight:700;font-size:13px;cursor:pointer">👥 Grupo</button>');

    h.push('<select class="inp" style="margin:0" onchange="S.chatDmB=this.value;renderSheet()"><option value="">Conversar com...</option>');

    h.push('</select>');
    if(myDmId&&S.chatDmB){
      h.push('<button onclick="createDM(\''+myDmId+'\',S.chatDmB)" style="width:100%;margin-top:10px;padding:10px;background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:10px;color:#000;font-weight:800;font-size:13px;cursor:pointer">Iniciar Conversa</button>');

  return h.join('');
  }

    var lb=b.messages.length?b.messages[b.messages.length-1].created:b.created;
    return new Date(lb)-new Date(la);
  });

function renderModalNotifications(){
  var h=[];
  var myIds=load('bl_myids')||[];
  var mine=S.notifications.filter(function(n){return myIds.indexOf(n.toPid)>=0}).sort(function(a,b){return new Date(b.created)-new Date(a.created)});
  h.push('<div style="font-size:20px;font-weight:800;margin-bottom:16px">🔔 Notificações</div>');
  if(mine.length===0){
    h.push('<div style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="color:#4A5A72">Nenhuma notificação por aqui</div></div>');
    return h.join('');
  }
  mine.forEach(function(n){
    var from=S.players.find(function(p){return p.id===n.fromPid});
    var to=S.players.find(function(p){return p.id===n.toPid});
    var t=S.tours.find(function(x){return x.id===n.tournamentId});
    h.push('<div style="background:#161E2E;border-radius:12px;padding:14px;margin-bottom:10px;border-left:3px solid '+(n.status==='pending'?'#FFD700':n.status==='accepted'?'#22C55E':'#4A5A72')+'">');
    if(n.type==='dupla_invite'){
      h.push('<div style="font-size:13px;margin-bottom:6px"><b>'+esc(from?from.name:'?')+'</b> convidou <b>'+esc(to?to.name:'?')+'</b> para formar dupla</div>');
      h.push('<div style="font-size:12px;color:#4A5A72;margin-bottom:'+(n.status==='pending'?'10px':'0')+'">🏆 '+esc(t?t.name:'Torneio')+' · '+(n.created||'').slice(0,10)+'</div>');
      if(n.status==='pending'){
        h.push('<div style="display:flex;gap:8px">');
        h.push('<button onclick="respondInvite(\''+n.id+'\',true)" style="flex:1;padding:9px;background:linear-gradient(135deg,#22C55E,#16803c);border:none;border-radius:8px;color:#000;font-weight:800;font-size:13px;cursor:pointer">✓ Aceitar</button>');
        h.push('<button onclick="respondInvite(\''+n.id+'\',false)" style="flex:1;padding:9px;background:transparent;border:1px solid #EF4444;border-radius:8px;color:#EF4444;font-weight:700;font-size:13px;cursor:pointer">✕ Recusar</button>');
        h.push('</div>');
      }else{
        h.push('<div style="font-size:11px;font-weight:700;color:'+(n.status==='accepted'?'#22C55E':'#4A5A72')+'">'+(n.status==='accepted'?'✓ Dupla formada':'✕ Recusado')+'</div>');
      }
    }
    if(n.type==='challenge_invite'){
      var ch=S.challenges.find(function(x){return x.id===n.challengeId});
      var fromN=ch?ch.fromIds.map(function(id){var pp=S.players.find(function(x){return x.id===id});return pp?pp.name:'?'}).join(' / '):'?';
      var toN=ch?ch.toIds.map(function(id){var pp=S.players.find(function(x){return x.id===id});return pp?pp.name:'?'}).join(' / '):'?';
      h.push('<div style="font-size:13px;margin-bottom:6px">⚔️ <b>'+esc(fromN)+'</b> desafiou <b>'+esc(toN)+'</b></div>');
      if(ch&&n.status==='accepted')h.push('<div style="font-size:12px;color:#FFD700;margin-bottom:10px">Em jogo · vencedor leva +'+challengePoints(avgCat(ch.fromIds),avgCat(ch.toIds))+' pts</div>');
      else h.push('<div style="font-size:12px;color:#4A5A72;margin-bottom:'+(n.status==='pending'?'10px':'0')+'">'+(n.created||'').slice(0,10)+'</div>');
      if(n.status==='pending'){
        h.push('<div style="display:flex;gap:8px">');
        h.push('<button onclick="respondInvite(\''+n.id+'\',true)" style="flex:1;padding:9px;background:linear-gradient(135deg,#22C55E,#16803c);border:none;border-radius:8px;color:#000;font-weight:800;font-size:13px;cursor:pointer">✓ Aceitar</button>');
        h.push('<button onclick="respondInvite(\''+n.id+'\',false)" style="flex:1;padding:9px;background:transparent;border:1px solid #EF4444;border-radius:8px;color:#EF4444;font-weight:700;font-size:13px;cursor:pointer">✕ Recusar</button>');
        h.push('</div>');
      }else if(n.status==='declined'){
        h.push('<div style="font-size:11px;font-weight:700;color:#4A5A72">✕ Recusado</div>');
      }
    }
    h.push('</div>');
  });

  // DESAFIOS ACEITOS — entrada de placar
  var activeCh=S.challenges.filter(function(c){return c.status==='accepted'&&(c.fromIds.concat(c.toIds)).some(function(id){return myIds.indexOf(id)>=0})});
  if(activeCh.length>0){
    h.push('<div style="font-size:11px;font-weight:700;color:#FFD700;margin:16px 0 8px">⚔️ DESAFIOS EM ANDAMENTO</div>');
    activeCh.forEach(function(c){
      var fromN=c.fromIds.map(function(id){var pp=S.players.find(function(x){return x.id===id});return pp?pp.name:'?'}).join(' / ');
      var toN=c.toIds.map(function(id){var pp=S.players.find(function(x){return x.id===id});return pp?pp.name:'?'}).join(' / ');
      h.push('<div style="background:#161E2E;border-radius:12px;padding:12px;margin-bottom:8px">');
      h.push('<div style="font-size:13px;font-weight:700;margin-bottom:8px">'+esc(fromN)+' <span style="color:#4A5A72">vs</span> '+esc(toN)+'</div>');
      h.push('<div style="display:flex;gap:8px;align-items:center">');
      h.push('<input id="ch-sa-'+c.id+'" class="inp" type="number" placeholder="Placar '+esc(fromN.split(' / ')[0])+'" style="margin:0"/>');
      h.push('<input id="ch-sb-'+c.id+'" class="inp" type="number" placeholder="Placar '+esc(toN.split(' / ')[0])+'" style="margin:0"/>');
      h.push('</div>');
      h.push('<button onclick="recChallengeScore(\''+c.id+'\',parseInt(document.getElementById(\'ch-sa-'+c.id+'\').value),parseInt(document.getElementById(\'ch-sb-'+c.id+'\').value))" style="width:100%;margin-top:8px;padding:9px;background:linear-gradient(135deg,#FFD700,#C8A84B);border:none;border-radius:8px;color:#000;font-weight:800;font-size:13px;cursor:pointer">Registrar Resultado</button>');
      h.push('</div>');
    });
  }
  // DESAFIOS CONCLUÍDOS recentes
  var doneCh=S.challenges.filter(function(c){return c.status==='completed'&&(c.fromIds.concat(c.toIds)).some(function(id){return myIds.indexOf(id)>=0})}).slice(-5).reverse();
  if(doneCh.length>0){
    h.push('<div style="font-size:11px;font-weight:700;color:#4A5A72;margin:16px 0 8px">HISTÓRICO DE DESAFIOS</div>');
    doneCh.forEach(function(c){
      var fromN=c.fromIds.map(function(id){var pp=S.players.find(function(x){return x.id===id});return pp?pp.name:'?'}).join(' / ');
      var toN=c.toIds.map(function(id){var pp=S.players.find(function(x){return x.id===id});return pp?pp.name:'?'}).join(' / ');
      var winN=c.winnerSide==='from'?fromN:toN;

}

// ── CONVITES DE DUPLA (notificações) ──
function sendDuplaInvite(tid,fromPid,toPid){
  if(!fromPid||!toPid||fromPid===toPid)return;
  var n={id:uid(),type:'dupla_invite',tournamentId:tid,fromPid:fromPid,toPid:toPid,status:'pending',created:new Date().toISOString()};
  var u=S.notifications.concat([n]);save('bl_n',u);
  set({notifications:u,duplaInvFrom:'',duplaInvTo:''});
  toast_('Convite enviado! 🤝');
}
function respondInvite(nid,accept){
  var n=S.notifications.find(function(x){return x.id===nid});
  if(!n)return;
  if(n.type==='challenge_invite'){respondChallenge(n.challengeId,nid,accept);return}
  var u=S.notifications.map(function(x){return x.id!==nid?x:Object.assign({},x,{status:accept?'accepted':'declined'})});
  save('bl_n',u);
  if(accept){
    var ut=S.tours.map(function(t){
      if(t.id!==n.tournamentId)return t;
      var players=t.players.slice();
      [n.fromPid,n.toPid].forEach(function(pid){if(players.indexOf(pid)<0)players.push(pid)});
      var duplas=(t.duplas||[]).concat([[n.fromPid,n.toPid]]);
      return Object.assign({},t,{players:players,duplas:duplas});
    });
    save('bl_t',ut);
    set({notifications:u,tours:ut,sel:S.sel&&S.sel.id===n.tournamentId?ut.find(function(x){return x.id===n.tournamentId}):S.sel});
    toast_('Dupla formada! 🤝');
  }else{
    set({notifications:u});
    toast_('Convite recusado','#EF4444');
  }
}

function addMatch(){
  var nm=S.nm;

  var sA=parseInt(nm.sA),sB=parseInt(nm.sB);
  if(sA===sB){toast_('Sem empate em beach tennis','#EF4444');return}
  var m={id:uid(),pA:nm.pA,pB:nm.pB,sA:sA,sB:sB,winnerId:sA>sB?nm.pA:nm.pB,arena:nm.arena,date:nm.date,created:new Date().toISOString(),type:'friendly'};
  var u=S.matches.concat([m]);save('bl_m',u);
  set({matches:u,nm:{pA:'',pB:'',sA:'',sB:'',arena:'',date:td()},modal:null});
  toast_('Vitória de '+S.players.find(function(p){return p.id===m.winnerId}).name+'! 🎾');
}

function updNt(k,v){
  S.nt[k]=v;
  // Simples força individual, sem mista
  if(k==='format'&&v==='simples'){S.nt.duplaMode='individual';if(S.nt.categoria==='mista')S.nt.categoria='masculino'}
  // Single (duplas) precisa de duplaMode != individual
  if(k==='format'&&v==='single'&&(!S.nt.duplaMode||S.nt.duplaMode==='individual')){S.nt.duplaMode='draw'}
  if(k==='numPlayers'||k==='numCourts'){updateCalc();return}
  renderSheet();
}
// Versão silenciosa: atualiza estado sem re-render — usada em inputs de texto
// para evitar que o teclado feche a cada letra digitada
function updNtQ(k,v){S.nt[k]=v}
function updateCalc(){
  var el=document.getElementById('calc-preview');
  if(!el)return;
  var nt=S.nt,n=parseInt(nt.numPlayers)||0,c=parseInt(nt.numCourts)||1;
  if(n<4){el.innerHTML='';return}
  var play=Math.min(c,Math.floor(n/4))*4,sit=n-play;
  var valid=validRR(n,nt.categoria,c);
  var cy=sit>0?Math.ceil(n/sit):(n>1?n-1:0);
  var rounds=sit>0?cy*3:(n>1?n-1:0);
  el.innerHTML='<div style="border-radius:10px;overflow:hidden;border:1px solid '+(valid?'#22C55E':'#EF4444')+';margin-bottom:14px">'+
    '<div style="background:'+(valid?'rgba(34,197,94,.12)':'rgba(239,68,68,.12)')+';padding:10px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+
    '<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:'+(valid?'#22C55E':'#EF4444')+'">'+play+'</div><div style="font-size:10px;color:#4A5A72">jogam/rod.</div></div>'+
    '<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:'+(sit>0?'#F97316':'#22C55E')+'">'+sit+'</div><div style="font-size:10px;color:#4A5A72">de fora</div></div>'+
    '<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:#C8A84B">'+(rounds||'—')+'</div><div style="font-size:10px;color:#4A5A72">rodadas</div></div>'+
    '</div><div style="padding:7px 14px;font-size:11px;color:'+(valid?(sit>0?'#F97316':'#22C55E'):'#EF4444')+'">'+
    (valid?(sit>0?'✓ Fora de uma rodada entra na próxima':'✓ Todos jogam em todas as rodadas'):(nt.categoria==='mista'?'Mista: apenas 4, 8, 16 ou 32':'Mínimo 4 jogadores'))+
    '</div></div>';
}
function createTour(){
  var nt=S.nt;if(!nt.name.trim())return;
  var t={id:uid(),name:nt.name.trim(),arena:nt.arena.trim(),date:nt.date,format:nt.format,categoria:nt.categoria||'masculino',skillCat:nt.skillCat||'Open',dancaMinutos:parseInt(nt.dancaMinutos)||30,dancaTrocas:parseInt(nt.dancaTrocas)||4,criteria:nt.criteria,endDate:nt.endDate||'',maxStages:nt.maxStages?parseInt(nt.maxStages):null,topN:nt.topN?parseInt(nt.topN):null,numCourts:parseInt(nt.numCourts)||1,maxPlayers:nt.numPlayers?parseInt(nt.numPlayers):null,numRounds:nt.numRounds?parseInt(nt.numRounds):null,duplaMode:nt.duplaMode||'individual',duplaScope:nt.duplaScope||'categoria',numGroups:nt.numGroups?parseInt(nt.numGroups):2,duplas:[],groups:[],teamMap:{},status:'registration',players:[],rounds:[],schedule:[],stages:[],champion:null,created:new Date().toISOString()};
  var u=S.tours.concat([t]);save('bl_t',u);
  set({tours:u,nt:{name:'',arena:'',date:td(),endDate:'',format:'single',categoria:'masculino',skillCat:'Pro',criteria:'wins_first',numCourts:'1',numPlayers:'',numRounds:'',maxStages:'',topN:'',duplaMode:'individual',duplaScope:'categoria',numGroups:''},modal:'tournament',sel:t,tR:0});
  toast_('"'+t.name+'" criado! 🏆');
}

// ── MODAL: TOURNAMENT ──
function selTour(id){var t=S.tours.find(function(x){return x.id===id});if(t)set({sel:t,modal:'tournament',tR:0})}
function renderModalTournament(){
  var at=S.tours.find(function(x){return x.id===S.sel.id});
  if(!at)return'';
  var h=[],isRR=at.format==='rei_rainha';
  h.push('<div style="margin-bottom:16px">');
  h.push('<div style="display:flex;justify-content:space-between;align-items:flex-start">');
  h.push('<div style="font-size:20px;font-weight:800;flex:1">'+esc(at.name)+'</div>');
  h.push('<button onclick="openEditTour(\''+at.id+'\')" style="background:transparent;border:1px solid #1C2740;border-radius:8px;color:#4A5A72;font-size:11px;padding:4px 8px;cursor:pointer;flex-shrink:0;margin-left:6px">✏️ Editar</button>');
  h.push('<button onclick="deleteTour(\''+at.id+'\')" style="background:transparent;border:1px solid #EF4444;border-radius:8px;color:#EF4444;font-size:11px;padding:4px 8px;cursor:pointer;flex-shrink:0;margin-left:4px">🗑 Apagar</button>');
  h.push('</div>');
  h.push('<div style="font-size:13px;color:#4A5A72;margin-top:3px">'+(at.arena||'—')+' · '+at.date+'</div>');
  if(isRR&&at.status!=='registration')h.push('<div style="font-size:12px;color:#A855F7;margin-top:3px">'+(at.activeCourts||at.numCourts||1)+' quadra(s) · '+((at.schedule&&at.schedule.length)||0)+' rodadas</div>');
  h.push('</div>');
  if(at.format==='ranking')h.push(renderCircuit(at));
  else if(at.format==='danca')h.push(renderDanca(at));
  else if(at.status==='registration')h.push(renderReg(at));
  else if(isRR&&at.schedule)h.push(renderRR(at));
  else if(!isRR&&at.status==='groups'&&at.groups)h.push(renderGroups(at));
  else if(!isRR&&at.rounds){S._teamMap=at.teamMap;h.push(renderBracket(at));}
  return h.join('');
}

function renderReg(at){
  var h=[],isRR=at.format==='rei_rainha';
  var enrolled=at.players.length;
  var max=at.maxPlayers;
  // Status bar
  h.push('<div style="font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between"><span>Inscrições</span><span style="color:'+(max&&enrolled>=max?'#22C55E':'#4A5A72')+'">'+enrolled+(max?'/'+max:'')+' jog.</span></div>');
  if(isRR){
    var n=enrolled,c=optC(n,at.numCourts||1),play=c*4,sit=n-play,valid=validRR(n,at.categoria,at.numCourts||1);
    var valMsg='';
    if(valid){
      valMsg='✅ '+n+' jog. · '+c+' quad. · '+play+' jogam · '+sit+' de fora';
    } else if(at.categoria==='mista'){
      var rr=at.players.map(function(id){return S.players.find(function(p){return p.id===id})}).filter(Boolean);
      var mc=rr.filter(function(p){return p.gender==='M'}).length;
      var fc=rr.filter(function(p){return p.gender==='F'}).length;
      var sc2=rr.filter(function(p){return!p.gender}).length;
      var sm=mc+'H + '+fc+'M'+(sc2>0?' ('+sc2+' sem genero)':'');
      if(sc2>0)valMsg='[!] '+sm+' - genero de '+sc2+(sc2>1?' jogadores':' jogador')+' nao cadastrado';
      else if(!RR_MISTA.includes(n)){var nx=RR_MISTA.filter(function(x){return x>n})[0];
        if(nx){var nd=nx-n,dg=mc-fc;
          if(dg===0)valMsg='[!] '+sm+' - adicione '+nd+(nd>1?' jogadores':' jogador')+' para '+nx;
          else if(dg>0)valMsg='[!] '+sm+' - faltam '+nd+(nd>1?' mulheres':' mulher')+' para completar '+nx;
          else{var da=Math.abs(dg);valMsg='[!] '+sm+' - faltam '+da+(da>1?' homens':' homem')+' para completar '+nx;}
        }else{valMsg='[!] '+sm+' - maximo 32 jogadores';}
      }else if(mc!==fc){var dg2=mc-fc;
        if(dg2>0)valMsg='[!] '+sm+' - faltam '+dg2+(dg2>1?' mulheres':' mulher');
        else{var db=Math.abs(dg2);valMsg='[!] '+sm+' - faltam '+db+(db>1?' homens':' homem');}
      }else{valMsg='[!] Mista: use 4, 8, 16 ou 32 jogadores';}
    } else {
      valMsg='⚠️ Mínimo 4 jogadores (você tem '+n+')';
    }
    h.push('<div style="margin-bottom:12px;padding:9px 12px;background:'+(valid?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)')+';border:1px solid '+(valid?'#22C55E':'#EF4444')+';border-radius:8px;font-size:12px;color:'+(valid?'#22C55E':'#EF4444')+'">'+valMsg+'</div>');
  }
  // Available players (not yet enrolled)

    h.push('<span style="font-size:12px;font-weight:700;color:#4A5A72">DISPONÍVEIS ('+avail.length+')</span>');
    h.push('<button onclick="toggleAllTour()" style="font-size:11px;padding:4px 10px;border:1px solid #1C2740;border-radius:20px;background:transparent;color:#C8A84B;cursor:pointer">'+(allSel?'Desmarcar todos':'Selecionar todos')+'</button>');
    h.push('</div>');
    avail.forEach(function(p){
      var sel=S.tourSel.indexOf(p.id)>=0;
      h.push('<div id="tsel_'+p.id+'" onclick="toggleTourSel(\''+p.id+'\')" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;background:'+(sel?'rgba(200,168,75,.1)':'transparent')+';margin-bottom:4px">');
      h.push('<div class="sel-dot" style="width:20px;height:20px;border-radius:50%;border:2px solid '+(sel?'#C8A84B':'#4A5A72')+';background:'+(sel?'#C8A84B':'transparent')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(sel?'<span style="font-size:11px;color:#000;font-weight:900">✓</span>':'')+'</div>');
      h.push('<div style="flex:1"><span style="font-weight:600;font-size:14px">'+esc(p.name)+'</span></div>');
      if(p.gender)h.push('<span style="font-size:11px;color:#4A5A72">'+p.gender+'</span>');
      h.push('</div>');
    });
    h.push('<button id="add-sel-btn" onclick="addSelectedToTour(\''+at.id+'\')" style="width:100%;margin-top:10px;padding:11px;background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:10px;color:#000;font-weight:800;font-size:14px;cursor:pointer;display:'+(S.tourSel.length>0?'block':'none')+'">+ Adicionar '+S.tourSel.length+' jogador'+(S.tourSel.length>1?'es':'')+'</button>');
    h.push('</div>');
  }
  // Already enrolled
  if(at.players.length>0){
    h.push('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">');
    h.push('<div style="font-size:11px;color:#4A5A72;font-weight:700">INSCRITOS ('+at.players.length+')</div>');
    h.push('<button onclick="set({tourBulk:S.tourBulk.length?[]:at.players.slice()})" style="font-size:11px;padding:3px 10px;border:1px solid #1C2740;border-radius:20px;background:transparent;color:#4A5A72;cursor:pointer">'+(S.tourBulk.length?'Desmarcar':'Sel. todos')+'</button>');
    h.push('</div>');
    if(S.tourBulk.length>0){
      h.push('<button onclick="bulkRemoveFromTour(\''+at.id+'\')" style="width:100%;padding:9px;background:#EF4444;border:none;border-radius:10px;color:#fff;font-weight:800;font-size:13px;cursor:pointer;margin-bottom:8px">🗑 Remover '+S.tourBulk.length+' selecionado'+(S.tourBulk.length>1?'s':'')+'</button>');
    }
    at.players.forEach(function(pid){
      var pg=S.players.find(function(p){return p.id===pid});
      var tbSel=S.tourBulk.indexOf(pid)>=0;
      h.push('<div onclick="toggleTourBulk(\''+pid+'\')" style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:'+(tbSel?'rgba(239,68,68,.1)':'#161E2E')+';border-radius:8px;margin-bottom:5px;cursor:pointer;border:1px solid '+(tbSel?'#EF4444':'transparent')+'">');
      h.push('<div style="display:flex;align-items:center;gap:8px">');
      h.push('<div style="width:18px;height:18px;border-radius:50%;border:2px solid '+(tbSel?'#EF4444':'#4A5A72')+';background:'+(tbSel?'#EF4444':'transparent')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(tbSel?'<span style="color:#fff;font-size:10px;font-weight:900">✓</span>':'')+'</div>');
      h.push('<span style="font-size:16px">'+(pg&&pg.gender==='F'?'👩':pg&&pg.gender==='M'?'👨':'🎾')+'</span>');
      h.push('<span style="font-weight:600;font-size:14px">'+nm_(pid)+'</span></div>');
      h.push('<button onclick="event.stopPropagation();removeFromTour(\''+at.id+'\',\''+pid+'\')" style="background:transparent;border:none;color:#EF4444;cursor:pointer;font-size:16px;padding:2px 6px">×</button>');
      h.push('</div>');
    });
    // Substituição — aqui na lista de inscritos, antes do início
    if(!at.schedule||!at.schedule.length){
      var nonPlayersReg=S.players.filter(function(p){return at.players.indexOf(p.id)<0});
      if(nonPlayersReg.length>0){
        h.push('<div style="background:#1C2740;border-radius:10px;padding:10px 12px;margin-top:8px">');
        h.push('<div style="font-size:11px;font-weight:700;color:#F97316;margin-bottom:8px">🔄 SUBSTITUIR INSCRITO</div>');
        h.push('<div style="display:flex;gap:6px;margin-bottom:6px">');
        h.push('<select class="inp" style="margin:0;flex:1" onchange="set({subOut:this.value})"><option value="">Sai...</option>');
        at.players.forEach(function(pid){h.push('<option value="'+pid+'"'+(S.subOut===pid?' selected':'')+'>'+nm_(pid)+'</option>');});
        h.push('</select>');
        h.push('<select class="inp" style="margin:0;flex:1" onchange="set({subIn:this.value})"><option value="">Entra...</option>');
        nonPlayersReg.forEach(function(p){h.push('<option value="'+p.id+'"'+(S.subIn===p.id?' selected':'')+'>'+esc(p.name)+'</option>');});
        h.push('</select></div>');
        if(S.subOut&&S.subIn){
          h.push('<button onclick="substituirPlayer(\''+at.id+'\',\''+S.subOut+'\',\''+S.subIn+'\')" style="width:100%;padding:9px;background:linear-gradient(135deg,#F97316,#C2410C);border:none;border-radius:8px;color:#fff;font-weight:800;font-size:13px;cursor:pointer">Confirmar Substituição</button>');
        }
        h.push('</div>');
      }
    }
  }
  h.push('<div style="height:14px"></div>');
  // Duplas Fixas via convite — jogador convida parceiro, que precisa aceitar
  if(!isRR&&at.duplaMode==='fixed'){
    var myIds3=load('bl_myids')||[];
    var myAvail=S.players.filter(function(p){return myIds3.indexOf(p.id)>=0&&at.players.indexOf(p.id)<0});
    var allOthers=S.players.filter(function(p){return at.players.indexOf(p.id)<0});
    var myPending=S.notifications.filter(function(n){return n.tournamentId===at.id&&n.type==='dupla_invite'&&n.status==='pending'&&myIds3.indexOf(n.fromPid)>=0});
    h.push('<div style="background:#161E2E;border-radius:12px;padding:12px;margin-bottom:12px">');
    h.push('<div style="font-size:12px;font-weight:700;color:#C8A84B;margin-bottom:10px">🤝 CONVIDAR PARCEIRO</div>');
    if(myAvail.length===0){
      h.push('<div style="font-size:12px;color:#4A5A72">Você precisa ter um jogador cadastrado neste dispositivo para convidar um parceiro.</div>');
    }else{
      h.push('<select class="inp" style="margin:0 0 8px" onchange="set({duplaInvFrom:this.value})"><option value="">Eu sou...</option>');
      myAvail.forEach(function(p){h.push('<option value="'+p.id+'"'+(S.duplaInvFrom===p.id?' selected':'')+'>'+esc(p.name)+'</option>')});
      h.push('</select>');
      h.push('<select class="inp" style="margin:0 0 10px" onchange="set({duplaInvTo:this.value})"><option value="">Convidar...</option>');
      allOthers.filter(function(p){return p.id!==S.duplaInvFrom}).forEach(function(p){h.push('<option value="'+p.id+'"'+(S.duplaInvTo===p.id?' selected':'')+'>'+esc(p.name)+'</option>')});
      h.push('</select>');
      if(S.duplaInvFrom&&S.duplaInvTo){
        h.push('<button onclick="sendDuplaInvite(\''+at.id+'\',\''+S.duplaInvFrom+'\',\''+S.duplaInvTo+'\')" style="width:100%;padding:10px;background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:10px;color:#000;font-weight:800;font-size:13px;cursor:pointer">Enviar Convite</button>');
      }
    }
    if(myPending.length>0){
      h.push('<div style="font-size:11px;color:#4A5A72;font-weight:700;margin:10px 0 6px">CONVITES ENVIADOS (aguardando)</div>');
      myPending.forEach(function(n){
        var to=S.players.find(function(p){return p.id===n.toPid});
        h.push('<div style="font-size:12px;color:#4A5A72;padding:6px 0">⏳ '+esc(to?to.name:'?')+'</div>');
      });
    }
    h.push('</div>');
  }
  // Duplas fixas — gestão manual antes do início
  if(!isRR&&at.duplaMode==='fixed'){
    var paired=(at.duplas||[]).reduce(function(a,d){return a.concat(d)},[]);
    var unpaired=at.players.filter(function(pid){return paired.indexOf(pid)<0});
    h.push('<div style="background:#161E2E;border-radius:12px;padding:12px;margin-bottom:12px">');
    h.push('<div style="font-size:12px;font-weight:700;color:#C8A84B;margin-bottom:10px">🤝 DUPLAS FIXAS ('+(at.duplas||[]).length+')</div>');
    (at.duplas||[]).forEach(function(d,i){
      h.push('<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#06080D;border-radius:8px;margin-bottom:5px">');
      h.push('<span style="font-size:13px;font-weight:600">'+esc(nm_(d[0]))+' / '+esc(nm_(d[1]))+'</span>');
      h.push('<button onclick="removeDupla(\''+at.id+'\','+i+')" style="background:transparent;border:none;color:#EF4444;cursor:pointer;font-size:15px;padding:2px 6px">×</button>');
      h.push('</div>');
    });
    if(unpaired.length>0){
      h.push('<div style="font-size:11px;color:#4A5A72;font-weight:700;margin:8px 0 6px">JOGADORES SEM DUPLA — selecione 2</div>');
      unpaired.forEach(function(pid){
        var sel=(S.duplaSel||[]).indexOf(pid)>=0;
        h.push('<div onclick="toggleDuplaSel(\''+pid+'\')" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;background:'+(sel?'rgba(200,168,75,.12)':'transparent')+';margin-bottom:3px">');
        h.push('<div style="width:18px;height:18px;border-radius:50%;border:2px solid '+(sel?'#C8A84B':'#4A5A72')+';background:'+(sel?'#C8A84B':'transparent')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(sel?'<span style="font-size:10px;color:#000;font-weight:900">✓</span>':'')+'</div>');
        h.push('<span style="font-size:13px;font-weight:600">'+esc(nm_(pid))+'</span></div>');
      });
      if((S.duplaSel||[]).length===2){
        h.push('<button onclick="formDupla(\''+at.id+'\')" style="width:100%;margin-top:8px;padding:10px;background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:10px;color:#000;font-weight:800;font-size:13px;cursor:pointer">Formar Dupla</button>');
      }
    }
    h.push('</div>');
  }
  var canStart=true,startMsg='';
  if(!isRR&&at.duplaMode==='fixed'){
    var paired2=(at.duplas||[]).reduce(function(a,d){return a.concat(d)},[]);
    if(at.players.length<2){canStart=false;startMsg='Mín. 2 jogadores';}
    else if(paired2.length<at.players.length){canStart=false;startMsg='Forme todas as duplas antes de iniciar';}
  }
  if(!canStart)h.push('<div style="text-align:center;font-size:12px;color:#EF4444;margin-bottom:8px">'+startMsg+'</div>');
  h.push('<button class="btn-gold" '+(canStart?'':'disabled style="opacity:.4;cursor:not-allowed"')+' onclick="'+(canStart?'startTour(\''+at.id+'\')':'')+'">'+(isRR?'👑':'🏆')+' Iniciar</button>');
  return h.join('');
}
function toggleDuplaSel(pid){
  S.duplaSel=S.duplaSel||[];
  var i=S.duplaSel.indexOf(pid);
  if(i>=0)S.duplaSel.splice(i,1);
  else if(S.duplaSel.length<2)S.duplaSel.push(pid);
  renderSheet();
}
function formDupla(tid){
  if(!S.duplaSel||S.duplaSel.length!==2)return;
  var u=S.tours.map(function(t){return t.id!==tid?t:Object.assign({},t,{duplas:(t.duplas||[]).concat([S.duplaSel.slice()])})});
  save('bl_t',u);
  S.duplaSel=[];
  set({tours:u,sel:u.find(function(x){return x.id===tid})});
}
function removeDupla(tid,idx){
  var u=S.tours.map(function(t){return t.id!==tid?t:Object.assign({},t,{duplas:(t.duplas||[]).filter(function(_,i){return i!==idx})})});
  save('bl_t',u);
  set({tours:u,sel:u.find(function(x){return x.id===tid})});
}

function toggleTourSel(pid){
  var idx=S.tourSel.indexOf(pid);
  if(idx>=0)S.tourSel.splice(idx,1);
  else S.tourSel.push(pid);
  // DOM update — sem re-render completo
  var row=document.getElementById('tsel_'+pid);
  if(row){

// ── SUBSTITUIÇÃO NO REI/RAINHA ──
// Troca um jogador em todas as rodadas restantes (não jogadas) do schedule
// Substituição em etapa de circuito em andamento
function substituirStage(cid,sid,outPid,inPid){
  if(!outPid||!inPid)return;
  var u=S.tours.map(function(t){
    if(t.id!==cid)return t;
    var stages=(t.stages||[]).map(function(s){
      if(s.id!==sid)return s;
      var players=s.players.map(function(p){return p===outPid?inPid:p});
      var schedule=(s.schedule||[]).map(function(r){
        return Object.assign({},r,{
          sitters:(r.sitters||[]).map(function(p){return p===outPid?inPid:p}),
          courts:r.courts.map(function(c){
            if(c.sA!=null)return c; // já jogado, não mexe
            return Object.assign({},c,{
              t1:c.t1.map(function(p){return p===outPid?inPid:p}),
              t2:c.t2.map(function(p){return p===outPid?inPid:p})
            });
          })
        });
      });
      return Object.assign({},s,{players:players,schedule:schedule});
    });
    return Object.assign({},t,{stages:stages});
  });
  save('bl_t',u);
  var circuit=u.find(function(x){return x.id===cid});
  var stage=circuit&&(circuit.stages||[]).find(function(s){return s.id===sid});
  set({tours:u,sel:stage?Object.assign({},stage,{_isStage:true,_circuitId:cid}):S.sel,subOut:'',subIn:''});
  toast_('Substituição realizada 🔄');
}
function substituirPlayer(tid,outPid,inPid){
  if(!outPid||!inPid||outPid===inPid){toast_('Selecione jogadores diferentes','#EF4444');return}
  var u=S.tours.map(function(t){
    if(t.id!==tid)return t;
    var players=t.players.slice();
    var idx=players.indexOf(outPid);
    if(idx>=0)players[idx]=inPid;
    else players.push(inPid);
    // Substituir nas rodadas ainda não jogadas
    var sched=(t.schedule||[]).map(function(r){
      var allDone=r.courts.every(function(c){return c.sA!=null});
      if(allDone)return r;
      var courts=r.courts.map(function(c){
        if(c.sA!=null)return c; // já jogado, não mexe
        var t1=c.t1.map(function(x){return x===outPid?inPid:x});
        var t2=c.t2.map(function(x){return x===outPid?inPid:x});
        var sitters=(c.sitters||[]).map(function(x){return x===outPid?inPid:x});
        return Object.assign({},c,{t1:t1,t2:t2,sitters:sitters});
      });
      var sitters=(r.sitters||[]).map(function(x){return x===outPid?inPid:x});
      return Object.assign({},r,{courts:courts,sitters:sitters});
    });
    return Object.assign({},t,{players:players,schedule:sched});
  });
  save('bl_t',u);
  set({tours:u,sel:u.find(function(x){return x.id===tid}),subOut:'',subIn:''});
  toast_('Substituição realizada ✓');
}

// ── EXPORTAR RESULTADO ──
function exportarResultado(tid){
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t)return;
  var lines=['🏆 TORNEIO BEACHLINE™',''];
  lines.push(t.name);
  if(t.arena)lines.push('📍 '+t.arena);
  if(t.date)lines.push('📅 '+t.date);
  var catLabel={Pro:'Pró',A:'A',B:'B',C:'C',D:'D','masculino':'Masculino','feminino':'Feminino','mista':'Mista'};
  var catStr=[t.skillCat&&catLabel[t.skillCat],catLabel[t.categoria]||t.categoria].filter(Boolean).join(' ');
  if(catStr)lines.push('🎾 '+catStr);
  lines.push('');
  var medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣'];
  // Rei/Rainha
  if(t.format==='rei_rainha'&&t.schedule){
    var st=calcSt(t.schedule,t.players,t.criteria||'wins_first');
    st.forEach(function(s,i){
      lines.push((medals[i]||((i+1)+'.'))+' '+nm_(s.pid)+' ('+s.wins+'V '+s.losses+'D)');
    });
  }else if(!t.format||t.format==='single'||t.format==='simples'){
    // Bracket: tenta inferir posições pelo bracket
    var pos=[];
    (t.rounds||[]).forEach(function(r){
      r.matches.forEach(function(m){
        if(m.winnerId&&m.p1&&m.p2){
          var loserId=m.winnerId===m.p1?m.p2:m.p1;
          if(pos.findIndex(function(x){return x.pid===m.winnerId})<0)pos.push({pid:m.winnerId,wins:(pos.find(function(x){return x.pid===m.winnerId})||{wins:0}).wins+1,lastRound:r.round});
        }
      });
    });
    pos.sort(function(a,b){return b.wins-a.wins||b.lastRound-a.lastRound});
    if(t.champion){lines.push('🥇 '+nm_(t.champion));pos=pos.filter(function(x){return x.pid!==t.champion});}
    pos.slice(0,7).forEach(function(x,i){lines.push((medals[i+1]||((i+2)+'.'))+' '+nm_(x.pid));});
  }
  lines.push('');
  lines.push('📱 Gerado pelo BeachLine™ App');
  var text=lines.join('\n');
  if(navigator.share){navigator.share({title:'Resultado BeachLine™',text:text}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast_('Resultado copiado! Cole no WhatsApp 📋');});}
  else{prompt('Copie o resultado:',text);}
}

function salvarPlacarArbitro(){
  var tid=S.arbitroTid,ridx=S.arbitroRound,cid=S.arbitroCourt;
  // Get winner from sport engine
  var sa,sb;
  if(S.sportMode==='bt'&&S.bt&&S.bt.winner){
    sa=S.bt.winner==='A'?S.bt.gA:S.bt.gB;
    sb=S.bt.winner==='A'?S.bt.gB:S.bt.gA;
    if(sa===sb)sa=S.bt.winner==='A'?1:0, sb=1-sa;
  } else if((S.sportMode==='vb'||S.sportMode==='fv')&&S.rl&&S.rl.winner){
    sa=S.rl.winner==='A'?1:0; sb=1-sa;
  } else {
    sa=S.arbitroA||0; sb=S.arbitroB||0;
  }
  if(sa===sb){toast_('Não pode terminar empatado','#EF4444');return}
  if(S.arbitroMode==='bracket'){
    S.se={tid:tid,rid:ridx,cid:'',mid:cid,sA:String(sa),sB:String(sb),p1:S.arbitroP1,p2:S.arbitroP2};
    recScore();
    set({modal:'tournament',arbitroA:0,arbitroB:0});
  }else{
    var u=S.tours.map(function(t){
      if(t.id!==tid)return t;
      var sched=(t.schedule||[]).map(function(r,ri){
        return ri!==ridx?r:Object.assign({},r,{courts:r.courts.map(function(c){
          return c.id!==cid?c:Object.assign({},c,{sA:sa,sB:sb});
        })});
      });
      return Object.assign({},t,{schedule:sched});
    });
    save('bl_t',u);
    set({tours:u,sel:u.find(function(x){return x.id===tid}),modal:'tournament',arbitroA:0,arbitroB:0});
  }
  toast_('Placar salvo! ✓');
}

function deleteTour(tid){

  save('bl_t',u);set({tours:u,modal:null,sel:null,tourSel:[]});

}
function joinTour(tid,pid){
  if(!pid)return;
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t||t.players.indexOf(pid)>=0)return;
  if(t.maxPlayers&&t.players.length>=t.maxPlayers){toast_('Torneio cheio ('+t.maxPlayers+')','#F97316');return}
  var u=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{players:x.players.concat([pid])})});
  save('bl_t',u);set({tours:u,sel:u.find(function(x){return x.id===tid})});toast_(nm_(pid).replace(/&amp;/g,'&')+' inscrito!');
}
function startTour(tid){
  var t=S.tours.find(function(x){return x.id===tid});if(!t)return;
  if(t.format==='rei_rainha'){
    var n=t.players.length;
    if(!validRR(n,t.categoria,t.numCourts||1)){toast_(t.categoria==='mista'?'Mista: 4,8,16 ou 32. Tem '+n+'.':'Mín. 4 jog. Tem '+n+'.','#EF4444');return}
    if(t.categoria==='mista'){
      var reg=t.players.map(function(id){return S.players.find(function(p){return p.id===id})}).filter(Boolean);
      var mC=reg.filter(function(p){return p.gender==='M'}).length,fC=reg.filter(function(p){return p.gender==='F'}).length;
      if(mC!==fC||reg.some(function(p){return!p.gender})){toast_('Mista: M=F e gênero de todos cadastrado.','#EF4444');return}
    }
    var schedule,c;
    if(t.categoria==='mista'){
      schedule=genSchedMista(t.players,S.players,t.numRounds||null,t.numCourts||1);
      c=optC(n,t.numCourts||1);
    }else{
      c=optC(n,t.numCourts||1);
      schedule=genSched(t.players,c,t.numRounds||null);
    }
    var u=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{status:'active',schedule:schedule,activeCourts:c})});
    save('bl_t',u);set({tours:u,sel:u.find(function(x){return x.id===tid}),tR:0});
    toast_('👑 Iniciado! '+c+' quadra(s) · '+schedule.length+' rodadas');
  }else{
    if(t.players.length<2){toast_('Mín. 2 jogadores','#EF4444');return}
    var dm=t.duplaMode||'individual';
    if(dm==='individual'){
      var rounds=genBracket(t.players,S.matches);
      var u=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{status:'active',rounds:rounds})});
      save('bl_t',u);set({tours:u,sel:u.find(function(x){return x.id===tid}),tR:0});
      toast_('🏆 Torneio iniciado!');
    }else{
      var duplas;
      if(dm==='fixed'){
        duplas=t.duplas||[];
        var paired=duplas.reduce(function(a,d){return a.concat(d)},[]);
        if(paired.length<t.players.length||duplas.length<1){toast_('Forme todas as duplas antes de iniciar','#EF4444');return}
      }else{
        duplas=pairByScope(t.players,t.duplaScope||'categoria',S.players);
      }
      var tmap=teamMapFromDuplas(duplas);
      var teamIds=Object.keys(tmap);
      if(dm==='draw_groups'){
        var ng=Math.max(2,t.numGroups||2);
        if(teamIds.length<ng*2){toast_('Poucas duplas para '+ng+' grupos','#EF4444');return}
        var groupsArr=splitGroups(teamIds,tmap,S.matches,ng);
        var groups=groupsArr.map(function(g){return{teamIds:g,schedule:roundRobinAll(g),done:false}});
        var u2=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{status:'groups',duplas:duplas,teamMap:tmap,groups:groups})});
        save('bl_t',u2);set({tours:u2,sel:u2.find(function(x){return x.id===tid}),tR:0});
        toast_('🎲 Duplas sorteadas! Fase de grupos iniciada');
      }else{
        var rounds2=genBracketTeams(teamIds,tmap,S.matches);
        var u3=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{status:'active',duplas:duplas,teamMap:tmap,rounds:rounds2})});
        save('bl_t',u3);set({tours:u3,sel:u3.find(function(x){return x.id===tid}),tR:0});
        toast_('🎲 Duplas sorteadas! Torneio iniciado');
      }
    }
  }
}

function recGroupScore(){
  var se=S.se;if(se.sA===''||se.sB===''||se.sA==null||se.sB==null)return;
  var sa=parseInt(se.sA),sb=parseInt(se.sB);

  var u=S.tours.map(function(t){
    if(t.id!==se.tid)return t;
    var groups=t.groups.map(function(g,gi){
      if(gi!==se.gi)return g;
      var schedule=g.schedule.map(function(r,ri){return ri!==se.ri?r:Object.assign({},r,{courts:r.courts.map(function(c){return c.id!==se.cid?c:Object.assign({},c,{sA:sa,sB:sb})})})});
      return Object.assign({},g,{schedule:schedule});
    });
    return Object.assign({},t,{groups:groups});
  });
  save('bl_t',u);
  Object.assign(S,{tours:u,sel:u.find(function(x){return x.id===se.tid}),se:{tid:'',rid:0,cid:'',mid:'',sA:'',sB:'',p1:'',p2:''}});

}
// Após a fase de grupos: top2 de cada grupo avança, sorteia NOVAS duplas (pode misturar parceiros) para o mata-mata
function drawKnockout(tid){
  var t=S.tours.find(function(x){return x.id===tid});if(!t)return;
  var advTeams=[];
  t.groups.forEach(function(g){
    var st=calcSt(g.schedule,g.teamIds,t.criteria||'wins_first');
    advTeams=advTeams.concat(st.slice(0,2).map(function(s){return s.pid}));
  });
  // Pool de jogadores que avançaram (das duplas classificadas)
  var advPlayers=[];
  advTeams.forEach(function(tid2){advPlayers=advPlayers.concat(t.teamMap[tid2])});
  var newDuplas=pairByScope(advPlayers,t.duplaScope||'categoria',S.players);
  var newMap=teamMapFromDuplas(newDuplas);
  var newTeamIds=Object.keys(newMap);
  var rounds=genBracketTeams(newTeamIds,newMap,S.matches);
  var u=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{status:'active',duplas:newDuplas,teamMap:newMap,rounds:rounds})});
  save('bl_t',u);set({tours:u,sel:u.find(function(x){return x.id===tid}),tR:0});
  toast_('🎲 Novas duplas sorteadas para o mata-mata!');
}

function recRR(){
  var se=S.se;if(!se.sA||!se.sB)return;
  var sa=parseInt(se.sA),sb=parseInt(se.sB);
  if(sa===sb){toast_('Sem empate','#EF4444');return}
  var ut=S.tours.map(function(t){
    if(t.id!==se.tid)return t;
    var schedule=t.schedule.map(function(r,ri){return ri!==se.rid?r:Object.assign({},r,{courts:r.courts.map(function(c){return c.id!==se.cid?c:Object.assign({},c,{sA:sa,sB:sb})})})});
    var done=schedule.every(function(r){return r.courts.every(function(c){return c.sA!=null})});
    var champ=t.champion,status=t.status;
    if(done){var st=calcSt(schedule,t.players,t.criteria||'wins_first');champ=st[0]?st[0].pid:null;status='finished'}
    return Object.assign({},t,{schedule:schedule,champion:champ,status:status});
  });
  save('bl_t',ut);
  var tt=ut.find(function(x){return x.id===se.tid});
  Object.assign(S,{tours:ut,sel:tt,se:{tid:'',rid:0,cid:'',mid:'',sA:'',sB:'',p1:'',p2:''}});
  renderSheet();
  if(tt.status==='finished')toast_('👑 '+S.players.find(function(p){return p.id===tt.champion}).name+' REI/RAINHA!','#C8A84B');
  else toast_('Salvo! 🎾');
}

function recScore(){
  var se=S.se;if(!se.sA||!se.sB)return;
  var sa=parseInt(se.sA),sb=parseInt(se.sB);
  if(sa===sb){toast_('Sem empate','#EF4444');return}
  var wid=sa>sb?se.p1:se.p2;
  var ut=S.tours.map(function(t){
    if(t.id!==se.tid)return t;
    var rounds=t.rounds.map(function(r,ri){return ri!==se.rid?r:Object.assign({},r,{matches:r.matches.map(function(m){return m.id!==se.mid?m:Object.assign({},m,{sA:sa,sB:sb,winnerId:wid})})})});
    return Object.assign({},t,{rounds:rounds});
  });
  var tt=ut.find(function(x){return x.id===se.tid});
  if(tt.rounds[se.rid].matches.every(function(m){return m.winnerId})){
    var nr=advR(tt.rounds);
    var champ=nr[nr.length-1].matches.length===1&&nr[nr.length-1].matches[0].winnerId?nr[nr.length-1].matches[0].winnerId:null;
    ut=ut.map(function(t){return t.id!==se.tid?t:Object.assign({},t,{rounds:nr,champion:champ,status:champ?'finished':'active'})});
    if(champ){toast_('🏆 '+S.players.find(function(p){return p.id===champ}).name+' CAMPEÃO!','#C8A84B')}
    else{toast_('Rodada completa!','#38BDF8');set({tR:se.rid+1})}
  }
  var gm={id:uid(),pA:se.p1,pB:se.p2,sA:sa,sB:sb,winnerId:wid,arena:tt.arena,date:tt.date,created:new Date().toISOString(),type:'tournament',tournamentId:se.tid};
  var isTeamMatch=tt.teamMap&&(tt.teamMap[se.p1]||tt.teamMap[se.p2]);
  var um=isTeamMatch?S.matches:S.matches.concat([gm]);
  if(!isTeamMatch)save('bl_m',um);
  save('bl_t',ut);
  Object.assign(S,{tours:ut,matches:um,sel:ut.find(function(x){return x.id===se.tid}),se:{tid:'',rid:0,cid:'',mid:'',sA:'',sB:'',p1:'',p2:''}});
  renderSheet();
}

function handlePhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=300,ratio=Math.min(max/img.width,max/img.height,1);
      var cv=document.createElement('canvas');
      cv.width=Math.round(img.width*ratio);cv.height=Math.round(img.height*ratio);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      var b64=cv.toDataURL('image/jpeg',.75);
      S.np.photo=b64;
      var pr=document.getElementById('photo-preview');
      if(pr){pr.src=b64;pr.style.display='block';pr.style.width='80px';pr.style.height='80px';pr.style.borderRadius='50%';pr.style.objectFit='cover';}
      var ph=document.getElementById('photo-placeholder');
      if(ph)ph.style.display='none';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// Record scores for stages
function recStageRR(cid,sid){
  var se=S.se;if(!se.sA||!se.sB)return;
  var sa=parseInt(se.sA),sb=parseInt(se.sB);
  if(sa===sb){toast_('Sem empate','#EF4444');return}
  var u=S.tours.map(function(t){
    if(t.id!==cid)return t;
    var stages=(t.stages||[]).map(function(s){
      if(s.id!==sid)return s;
      var sched=s.schedule.map(function(r,ri){return ri!==S.tR?r:Object.assign({},r,{courts:r.courts.map(function(c){return c.id!==se.cid?c:Object.assign({},c,{sA:sa,sB:sb})})})});
      return Object.assign({},s,{schedule:sched});
    });
    return Object.assign({},t,{stages:stages});
  });
  save('bl_t',u);
  var circuit=u.find(function(x){return x.id===cid});
  var stage=circuit.stages.find(function(s){return s.id===sid});
  setS({tours:u,se:{},sel:Object.assign({},stage,{_isStage:true,_circuitId:cid})});
  renderSheet();toast_('Salvo! 🎾');
}

function finishStage(cid,sid){
  var circuit=S.tours.find(function(x){return x.id===cid});
  var stage=(circuit.stages||[]).find(function(s){return s.id===sid});
  if(!stage)return;
  var results=getStageResults(stage);
  var champ=null;
  Object.keys(results).forEach(function(pid){if(results[pid]===1)champ=pid;});
  var u=S.tours.map(function(t){
    if(t.id!==cid)return t;
    var stages=(t.stages||[]).map(function(s){return s.id!==sid?s:Object.assign({},s,{status:'finished',results:results,champion:champ})});
    return Object.assign({},t,{stages:stages});
  });
  save('bl_t',u);
  var updCircuit=u.find(function(x){return x.id===cid});
  set({tours:u,sel:updCircuit,modal:'tournament',tR:0});
  if(champ)toast_('🏅 Etapa concluída! Campeão: '+S.players.find(function(p){return p.id===champ})?.name,'#FFD700');
  else toast_('Etapa finalizada! 🏅','#FFD700');
}

function recStageScore(cid,sid){
  var se=S.se;if(!se.sA||!se.sB)return;
  var sa=parseInt(se.sA),sb=parseInt(se.sB);
  if(sa===sb){toast_('Sem empate','#EF4444');return}
  var wid=sa>sb?se.p1:se.p2;
  var u=S.tours.map(function(t){
    if(t.id!==cid)return t;
    var stages=(t.stages||[]).map(function(s){
      if(s.id!==sid)return s;
      var rounds=s.rounds.map(function(r,ri){return ri!==S.tR?r:Object.assign({},r,{matches:r.matches.map(function(m){return m.id!==se.mid?m:Object.assign({},m,{sA:sa,sB:sb,winnerId:wid})})})});
      var updS=Object.assign({},s,{rounds:rounds});
      // Check if stage done
      var last=rounds[rounds.length-1];
      if(last&&last.matches.every(function(m){return m.winnerId})){
        var newR=advR(rounds);
        var champ=newR[newR.length-1].matches.length===1&&newR[newR.length-1].matches[0].winnerId?newR[newR.length-1].matches[0].winnerId:null;
        if(champ){
          var results=getStageResults(Object.assign({},updS,{rounds:newR,champion:champ}));
          updS=Object.assign({},updS,{rounds:newR,champion:champ,status:'finished',results:results});
          setTimeout(function(){finishStageQuiet(cid,sid,updS)},100);
        } else {
          updS=Object.assign({},updS,{rounds:newR});
          setTimeout(function(){set({tR:S.tR+1})},100);
        }
      }
      return updS;
    });
    return Object.assign({},t,{stages:stages});
  });
  save('bl_t',u);
  var circuit=u.find(function(x){return x.id===cid});
  var stage=circuit.stages.find(function(s){return s.id===sid});
  setS({tours:u,se:{},sel:Object.assign({},stage,{_isStage:true,_circuitId:cid})});
  renderSheet();
}
function finishStageQuiet(cid,sid,updStage){

  var u=S.tours.map(function(t){
    if(t.id!==cid)return t;
    var stages=(t.stages||[]).map(function(s){return s.id!==sid?s:updStage});

  });
  save('bl_t',u);
  var circuit=u.find(function(x){return x.id===cid});
  set({tours:u,sel:circuit,modal:'tournament',tR:0});

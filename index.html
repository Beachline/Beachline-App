<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BeachLine™</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#06080D;color:#E2EAF4;font-family:'Trebuchet MS','Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
#app{max-width:460px;margin:0 auto;min-height:100vh}
input,select,button,textarea{font-family:inherit;font-size:inherit}
input[type=number]::-webkit-inner-spin-button{display:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1C2740;border-radius:2px}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.fu{animation:fu .28s ease both}
.su{animation:su .3s ease}
.inp{width:100%;background:#06080D;border:1.5px solid #1C2740;border-radius:12px;padding:13px 15px;color:#E2EAF4;font-size:15px;outline:none;display:block;margin-bottom:10px}
.inp:focus{border-color:#C8A84B}
.btn-gold{width:100%;background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:14px;padding:15px;color:#000;font-weight:800;font-size:16px;cursor:pointer}
.card{background:#0B0F18;border:1px solid #1C2740;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0B0F18;border-radius:20px 20px 0 0;width:100%;max-width:460px;padding:22px 20px 40px;max-height:92vh;overflow-y:auto}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#0B0F18;border-top:1px solid #1C2740;display:flex;z-index:30}
.nav-btn{flex:1;background:none;border:none;padding:13px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.handle{width:36px;height:4px;background:#1C2740;border-radius:2px;margin:0 auto 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.score-row{display:flex;gap:10px;margin-bottom:10px}
.score-inp{flex:1;background:#06080D;border:1.5px solid #1C2740;border-radius:12px;padding:12px;color:#E2EAF4;font-size:26px;font-weight:900;text-align:center;outline:none}
.rounds-row{overflow-x:auto;display:flex;gap:6px;padding-bottom:6px;margin-bottom:14px}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px">
    <div style="width:44px;height:44px;border:3px solid #1C2740;border-top:3px solid #C8A84B;border-radius:50%;animation:spin 1s linear infinite"></div>
    <div style="color:#4A5A72;font-size:14px">BeachLine™</div>
  </div>
</div>
<script>
// ── STATE ──
var S={tab:'ranking',players:[],matches:[],tours:[],modal:null,sel:null,toast:null,tR:0,
  np:{name:'',city:'',arena:'',gender:''},
  nm:{pA:'',pB:'',sA:'',sB:'',arena:'',date:td()},
  nt:{name:'',arena:'',date:td(),format:'single',categoria:'masculino',criteria:'wins_first',numCourts:'1',numPlayers:'',numRounds:''},
  se:{tid:'',rid:0,cid:'',mid:'',sA:'',sB:'',p1:'',p2:''}
};

function td(){return new Date().toISOString().split('T')[0]}
function uid(){return Math.random().toString(36).substr(2,9)}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function set(upd){Object.assign(S,upd);render()}
function setS(upd){Object.assign(S,upd)}

// ── BLI ──
function bli(pid,matches){
  var now=Date.now();
  return Math.round(matches.filter(function(m){return m.winnerId===pid}).reduce(function(s,m){
    var d=(now-new Date(m.date).getTime())/86400000;
    return s+100*(d>90?.4:d>30?.7:1);
  },0));
}
function stats(pid,matches){
  var pm=matches.filter(function(m){return m.pA===pid||m.pB===pid});
  var w=pm.filter(function(m){return m.winnerId===pid}).length;
  return{played:pm.length,wins:w,losses:pm.length-w,rate:pm.length>0?Math.round(w/pm.length*100):0};
}
function bliHist(pid,matches){
  var s=matches.filter(function(m){return m.pA===pid||m.pB===pid}).sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  var r=[],d=[];s.forEach(function(m){r.push(m);d.push({v:bli(pid,r)})});return d;
}

// ── REI/RAINHA ──
var RR_MISTA=[4,8,16,32];
function validRR(n,cat,c){if(n<4)return false;if(cat==='mista')return RR_MISTA.indexOf(n)>=0;return Math.min(c,Math.floor(n/4))>=1}
function optC(n,max){return Math.min(max,Math.floor(n/4))}
function berger(active,r){
  var n=active.length;if(n<4||n%4!==0)return[];
  var wh=active.slice(1),st=r%(n-1);
  var rot=wh.slice(st).concat(wh.slice(0,st));
  var arr=[active[0]].concat(rot);
  var pairs=[];for(var i=0;i<n/2;i++)pairs.push([arr[i],arr[n-1-i]]);
  var cs=[];for(var c=0;c<n/4;c++)cs.push({id:uid(),t1:pairs[c*2],t2:pairs[c*2+1],sA:null,sB:null});
  return cs;
}
function genSched(pids,nc,nrO){
  var n=pids.length,c=optC(n,nc),play=c*4,sit=n-play;
  if(sit===0){var mr=nrO||(n-1);return Array.from({length:mr},function(_,r){return{round:r+1,sitters:[],courts:berger(pids,r)}})}
  var ls={},pl={};pids.forEach(function(p){ls[p]=-999;pl[p]=0});
  var cy=Math.ceil(n/sit),nr=nrO||cy*3;
  return Array.from({length:nr},function(_,r){
    var sorted=pids.slice().sort(function(a,b){return ls[b]!==ls[a]?ls[b]-ls[a]:pl[a]-pl[b]});
    var active=sorted.slice(0,play),sitters=sorted.slice(play);
    var courts=berger(active,r);
    active.forEach(function(p){pl[p]++});sitters.forEach(function(p){ls[p]=r});
    return{round:r+1,sitters:sitters,courts:courts};
  });
}
function calcSt(sched,pids,crit){
  var all=sched.reduce(function(a,r){return a.concat(r.courts)},[]);
  var st=pids.map(function(pid){
    var mine=all.filter(function(c){return c.sA!==null&&(c.t1.indexOf(pid)>=0||c.t2.indexOf(pid)>=0)});
    var w=0,gF=0,gA=0;
    mine.forEach(function(c){var t1=c.t1.indexOf(pid)>=0;var my=t1?c.sA:c.sB,op=t1?c.sB:c.sA;if(my>op)w++;gF+=my||0;gA+=op||0});
    return{pid:pid,played:mine.length,wins:w,losses:mine.length-w,gF:gF,gA:gA,saldo:gF-gA};
  });
  function h2h(a,b){
    var d=all.filter(function(c){return c.sA!==null&&((c.t1.indexOf(a)>=0&&c.t2.indexOf(b)>=0)||(c.t1.indexOf(b)>=0&&c.t2.indexOf(a)>=0))});
    var aw=0;d.forEach(function(c){var t1=c.t1.indexOf(a)>=0;if((t1?c.sA:c.sB)>(t1?c.sB:c.sA))aw++});
    return aw-(d.length-aw);
  }
  return st.sort(function(a,b){var vd=b.wins-a.wins,sd=b.saldo-a.saldo;var p=crit==='saldo_first'?(sd||vd):(vd||sd);return p||h2h(b.pid,a.pid)});
}

// ── BRACKET ──
function npow2(n){var p=1;while(p<n)p*=2;return p}
function genBracket(pids,matches){
  var s=pids.slice().sort(function(a,b){return bli(b,matches)-bli(a,matches)});
  var sz=npow2(s.length),pad=s.concat(Array(sz-s.length).fill(null));
  var r1=Array.from({length:sz/2},function(_,i){var p1=pad[i],p2=pad[sz-1-i];return{id:uid(),p1:p1,p2:p2,winnerId:(!p1&&p2)?p2:(!p2&&p1)?p1:null,sA:null,sB:null}});
  return[{round:1,name:'1ª Rodada',matches:r1}];
}
function advR(rounds){
  var last=rounds[rounds.length-1];
  if(!last.matches.every(function(m){return m.winnerId}))return rounds;
  var w=last.matches.map(function(m){return m.winnerId}).filter(Boolean);
  if(w.length===1)return rounds;
  var rn=rounds.length+1,rname=rn>=5?'Final':rn===4?'Semifinal':rn===3?'Quartas':rn+'ª Rodada';
  var nm=[];for(var i=0;i<w.length;i+=2)nm.push({id:uid(),p1:w[i],p2:w[i+1]||null,winnerId:w[i+1]?null:w[i],sA:null,sB:null});
  return rounds.concat([{round:rn,name:rname,matches:nm}]);
}

// ── HELPERS ──
function nm_(id){var p=S.players.find(function(p){return p.id===id});return p?esc(p.name):'?'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function rank(){return S.players.map(function(p){return Object.assign({},p,{bli:bli(p.id,S.matches)},stats(p.id,S.matches))}).sort(function(a,b){return b.bli-a.bli})}
function toast_(msg,c){set({toast:{msg:msg,c:c||'#22C55E'}});setTimeout(function(){set({toast:null})},2800)}
function fmtSaldo(n){return(n>=0?'+':'')+n}

// ── MINI CHART ──
function miniChart(hist){
  if(!hist||hist.length<2)return'';
  var vals=hist.map(function(d){return d.v});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1;
  var W=260,H=65,P=8;
  var pts=vals.map(function(v,i){return[P+(i/(vals.length-1))*(W-P*2),H-P-((v-mn)/rng)*(H-P*2)]});
  var poly=pts.map(function(p){return p.join(',')}).join(' ');
  var last=pts[pts.length-1];
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C8A84B" stop-opacity="0.3"/><stop offset="100%" stop-color="#C8A84B" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#bg)" points="'+pts[0][0]+','+H+' '+poly+' '+last[0]+','+H+'"/><polyline fill="none" stroke="#C8A84B" stroke-width="2.5" stroke-linejoin="round" points="'+poly+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="#C8A84B"/><text x="'+(last[0]+6)+'" y="'+(last[1]+4)+'" fill="#C8A84B" font-size="10" font-weight="bold">'+vals[vals.length-1]+'</text></svg>';
}

// ── RENDER ──
function render(){
  var h=[];
  h.push('<div style="background:#06080D;min-height:100vh;color:#E2EAF4">');

  // TOAST
  if(S.toast){
    h.push('<div style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:'+S.toast.c+';color:#000;padding:12px 22px;border-radius:40px;font-weight:800;font-size:14px;z-index:300;animation:pop .3s ease;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5)">'+esc(S.toast.msg)+'</div>');
  }

  // HEADER
  h.push('<div style="padding:16px 20px 12px;border-bottom:1px solid #1C2740;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#06080D;z-index:20">');
  h.push('<div style="display:flex;align-items:baseline;gap:2px"><span style="font-size:24px;font-weight:900;letter-spacing:-1.5px">Beach</span><span style="font-size:24px;font-weight:900;letter-spacing:-1.5px;color:#C8A84B">Line</span><span style="font-size:11px;color:#C8A84B;margin-left:1px">™</span></div>');
  h.push('<div style="display:flex;gap:8px">');
  h.push('<button onclick="openModal(\'tc\')" style="background:#161E2E;color:#C8A84B;border:1px solid #1C2740;border-radius:20px;padding:7px 13px;font-weight:700;font-size:12px;cursor:pointer">🏆 Torneio</button>');
  h.push('<button onclick="openModal(\'match\')" style="background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:20px;padding:7px 15px;font-weight:800;font-size:12px;cursor:pointer;color:#000">+ Partida</button>');
  h.push('</div></div>');

  // CONTENT
  h.push('<div style="padding:20px;padding-bottom:90px">');
  if(S.tab==='ranking') h.push(renderRanking());
  if(S.tab==='tournaments') h.push(renderTournaments());
  if(S.tab==='players') h.push(renderPlayers());
  h.push('</div>');

  // NAV
  h.push('<nav class="nav">');
  [['ranking','📊','Ranking'],['tournaments','🏆','Torneios'],['players','👥','Jogadores']].forEach(function(x){
    var active=S.tab===x[0];
    h.push('<button class="nav-btn" onclick="set({tab:\''+x[0]+'\',tR:0})" style="color:'+(active?'#C8A84B':'#4A5A72')+'"><span style="font-size:20px">'+x[1]+'</span><span style="font-size:10px;font-weight:700">'+x[2]+'</span></button>');
  });
  h.push('</nav>');

  // MODAL
  if(S.modal){
    h.push('<div class="overlay" onclick="if(event.target===this)set({modal:null})">');
    h.push('<div class="sheet su"><div class="handle"></div>');
    if(S.modal==='player') h.push(renderModalPlayer());
    if(S.modal==='match') h.push(renderModalMatch());
    if(S.modal==='tc') h.push(renderModalTC());
    if(S.modal==='tournament') h.push(renderModalTournament());
    if(S.modal==='profile') h.push(renderModalProfile());
    h.push('</div></div>');
  }

  h.push('</div>');
  document.getElementById('app').innerHTML=h.join('');
}

function openModal(m){set({modal:m})}

// ── RANKING ──
function renderRanking(){
  var r=rank(),h=[];
  h.push('<div style="margin-bottom:20px"><div style="font-size:22px;font-weight:900;letter-spacing:-1px">Ranking BLI</div><div style="font-size:12px;color:#4A5A72;margin-top:3px">'+S.players.length+' jogadores</div></div>');
  if(!r.length){
    h.push('<div style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:12px">🏖️</div><div style="font-weight:800;font-size:18px;margin-bottom:8px">Sem jogadores</div><div style="color:#4A5A72">Vá para Jogadores para começar</div></div>');
    return h.join('');
  }
  var medals=['🥇','🥈','🥉'];
  r.forEach(function(p,i){
    var top=i===0;
    h.push('<div class="card fu" onclick="selPlayer(\''+p.id+'\')" style="background:'+(top?'linear-gradient(135deg,#0B0F18,#130D00)':'#0B0F18')+';border-color:'+(top?'#5A3800':'#1C2740')+';animation-delay:'+(i*.05)+'s">');
    if(top)h.push('<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(135deg,#C8A84B,#8A6020)"></div>');
    h.push('<div style="display:flex;align-items:center;gap:14px">');
    h.push('<div style="width:38px;text-align:center;flex-shrink:0">'+(i<3?'<span style="font-size:26px">'+medals[i]+'</span>':'<span style="font-weight:800;color:#4A5A72;font-size:15px">#'+(i+1)+'</span>')+'</div>');
    h.push('<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</div><div style="font-size:12px;color:#4A5A72;margin-top:3px;display:flex;gap:8px"><span>'+(p.arena||p.city||'—')+'</span><span style="color:#22C55E">✓'+p.wins+'</span><span style="color:#EF4444">✗'+p.losses+'</span></div></div>');
    h.push('<div style="text-align:right;flex-shrink:0"><div style="font-size:22px;font-weight:900;color:#C8A84B">'+p.bli+'</div><div style="font-size:10px;color:#4A5A72">BLI</div></div>');
    h.push('</div></div>');
  });
  return h.join('');
}

// ── TOURNAMENTS ──
function renderTournaments(){
  var h=[];
  h.push('<div style="margin-bottom:20px"><div style="font-size:22px;font-weight:900;letter-spacing:-1px">Torneios</div><div style="font-size:12px;color:#4A5A72;margin-top:3px">'+S.tours.length+' registrados</div></div>');
  if(!S.tours.length){
    h.push('<div style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:12px">🏆</div><div style="font-weight:800;font-size:18px;margin-bottom:16px">Sem torneios</div><button onclick="openModal(\'tc\')" class="btn-gold" style="width:auto;padding:10px 24px;border-radius:20px;font-size:14px">Criar torneio</button></div>');
    return h.join('');
  }
  var tours=S.tours.slice().reverse();
  tours.forEach(function(t){
    var isRR=t.format==='rei_rainha';
    var statusColor=t.status==='finished'?'#C8A84B':t.status==='active'?'#22C55E':'#4A5A72';
    var statusLabel=t.status==='finished'?'Finalizado':t.status==='active'?'Ativo':'Inscrições';
    h.push('<div class="card fu" onclick="selTour(\''+t.id+'\')">');
    h.push('<div style="display:flex;justify-content:space-between;align-items:flex-start">');
    h.push('<div style="flex:1"><div style="font-weight:800;font-size:16px">'+esc(t.name)+'</div><div style="font-size:12px;color:#4A5A72;margin-top:3px">'+(t.arena||'—')+' · '+t.date+'</div>');
    h.push('<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">');
    h.push('<span class="pill" style="background:'+(isRR?'#A855F722':'#161E2E')+';color:'+(isRR?'#A855F7':'#4A5A72')+'">'+(isRR?'👑 Rei/Rainha':'🏆 Eliminação')+'</span>');
    h.push('<span class="pill" style="background:'+(t.status==='finished'?'#5A380033':'#161E2E')+';color:'+statusColor+'">'+statusLabel+'</span>');
    h.push('</div></div>');
    h.push('<div style="text-align:right;flex-shrink:0;margin-left:8px"><div style="font-size:22px;font-weight:900;color:#C8A84B">'+((t.players&&t.players.length)||0)+'</div><div style="font-size:10px;color:#4A5A72">jog.</div></div>');
    h.push('</div>');
    if(t.champion)h.push('<div style="margin-top:10px;padding:8px 12px;background:rgba(200,168,75,.1);border-radius:8px;font-size:13px;color:#C8A84B;font-weight:700">'+(isRR?'👑':'🏆')+' '+nm_(t.champion)+'</div>');
    h.push('</div>');
  });
  return h.join('');
}

// ── PLAYERS ──
function renderPlayers(){
  var h=[];
  h.push('<div style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:22px;font-weight:900;letter-spacing:-1px">Jogadores</div><div style="font-size:12px;color:#4A5A72;margin-top:3px">'+S.players.length+' cadastrados</div></div><button onclick="openModal(\'player\')" style="background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:20px;padding:8px 16px;color:#000;font-weight:800;font-size:12px;cursor:pointer">+ Novo</button></div>');
  if(!S.players.length){
    h.push('<div style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:12px">👤</div><div style="font-weight:800;font-size:18px;margin-bottom:16px">Sem jogadores</div><button onclick="openModal(\'player\')" class="btn-gold" style="width:auto;padding:10px 24px;border-radius:20px;font-size:14px">Cadastrar</button></div>');
    return h.join('');
  }
  S.players.slice().reverse().forEach(function(p){
    var icon=p.gender==='M'?'👨':p.gender==='F'?'👩':'🎾';
    h.push('<div class="card fu" onclick="selPlayer(\''+p.id+'\')" style="display:flex;gap:12px;align-items:center">');
    h.push('<div style="width:40px;height:40px;border-radius:50%;background:#161E2E;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+icon+'</div>');
    h.push('<div style="flex:1;min-width:0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</div><div style="font-size:12px;color:#4A5A72">'+(p.arena||p.city||'—')+(p.gender?' · '+p.gender:'')+'</div></div>');
    h.push('<div style="font-size:16px;font-weight:800;color:#C8A84B;flex-shrink:0">'+bli(p.id,S.matches)+' BLI</div>');
    h.push('</div>');
  });
  return h.join('');
}

// ── MODAL: PLAYER ──
function renderModalPlayer(){
  var np=S.np;
  return '<div style="font-size:20px;font-weight:800;margin-bottom:20px">Novo Jogador</div>'+
    '<input class="inp" placeholder="Nome *" value="'+esc(np.name)+'" oninput="updNp(\'name\',this.value)"/>'+
    '<input class="inp" placeholder="Arena / Clube" value="'+esc(np.arena)+'" oninput="updNp(\'arena\',this.value)"/>'+

function updNt(k,v){

  // name, arena, date: sem re-render
}
function updateCalc(){
  var el=document.getElementById('calc-preview');
  if(!el)return;
  var nt=S.nt,n=parseInt(nt.numPlayers)||0,c=parseInt(nt.numCourts)||1;
  if(n<4){el.innerHTML='';return}
  var play=Math.min(c,Math.floor(n/4))*4,sit=n-play;
  var valid=validRR(n,nt.categoria,c);
  var cy=sit>0?Math.ceil(n/sit):(n>1?n-1:0);
  var rounds=sit>0?cy*3:(n>1?n-1:0);
  el.innerHTML='<div style="border-radius:10px;overflow:hidden;border:1px solid '+(valid?'#22C55E':'#EF4444')+';margin-bottom:14px">'+
    '<div style="background:'+(valid?'rgba(34,197,94,.12)':'rgba(239,68,68,.12)')+';padding:10px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+
    '<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:'+(valid?'#22C55E':'#EF4444')+'">'+play+'</div><div style="font-size:10px;color:#4A5A72">jogam/rod.</div></div>'+

    '</div><div style="padding:7px 14px;font-size:11px;color:'+(valid?(sit>0?'#F97316':'#22C55E'):'#EF4444')+'">'+

    '</div></div>';
}

  var h=[],isRR=at.format==='rei_rainha';

  }
  var opts=S.players.filter(function(p){return at.players.indexOf(p.id)<0}).map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+(p.gender?' ('+p.gender+')':'')+'</option>'}).join('');

  at.players.forEach(function(pid){
    var pg=S.players.find(function(p){return p.id===pid});

  });
  h.push('<div style="height:14px"></div>');
  h.push('<button class="btn-gold" onclick="startTour(\''+at.id+'\')">'+(isRR?'👑':'🏆')+' Iniciar</button>');

function joinTour(tid,pid){
  if(!pid)return;
  var t=S.tours.find(function(x){return x.id===tid});
  if(!t||t.players.indexOf(pid)>=0)return;
  if(t.maxPlayers&&t.players.length>=t.maxPlayers){toast_('Torneio cheio ('+t.maxPlayers+')','#F97316');return}
  var u=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{players:x.players.concat([pid])})});
  save('bl_t',u);set({tours:u,sel:u.find(function(x){return x.id===tid})});toast_(nm_(pid).replace(/&amp;/g,'&')+' inscrito!');
}
function startTour(tid){
  var t=S.tours.find(function(x){return x.id===tid});if(!t)return;
  if(t.format==='rei_rainha'){
    var n=t.players.length;
    if(!validRR(n,t.categoria,t.numCourts||1)){toast_(t.categoria==='mista'?'Mista: 4,8,16 ou 32. Tem '+n+'.':'Mín. 4 jog. Tem '+n+'.','#EF4444');return}
    if(t.categoria==='mista'){
      var reg=t.players.map(function(id){return S.players.find(function(p){return p.id===id})}).filter(Boolean);
      var mC=reg.filter(function(p){return p.gender==='M'}).length,fC=reg.filter(function(p){return p.gender==='F'}).length;
      if(mC!==fC||reg.some(function(p){return!p.gender})){toast_('Mista: M=F e gênero de todos cadastrado.','#EF4444');return}
    }
    var c=optC(n,t.numCourts||1);
    var schedule=genSched(t.players,c,t.numRounds||null);
    var u=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{status:'active',schedule:schedule,activeCourts:c})});
    save('bl_t',u);set({tours:u,sel:u.find(function(x){return x.id===tid}),tR:0});
    toast_('👑 Iniciado! '+c+' quadra(s) · '+schedule.length+' rodadas');
  }else{
    if(t.players.length<2){toast_('Mín. 2 jogadores','#EF4444');return}
    var rounds=genBracket(t.players,S.matches);
    var u=S.tours.map(function(x){return x.id!==tid?x:Object.assign({},x,{status:'active',rounds:rounds})});
    save('bl_t',u);set({tours:u,sel:u.find(function(x){return x.id===tid}),tR:0});
    toast_('🏆 Torneio iniciado!');
  }
}

  var h=[],sched=at.schedule,tR=S.tR;

    });
  }
  return h.join('');
}

function renderBracket(at){
  var h=[],rounds=at.rounds,tR=S.tR;
  h.push('<div class="rounds-row">');
  rounds.forEach(function(r,i){
    h.push('<button onclick="set({tR:'+i+'})" style="padding:7px 13px;border:1.5px solid '+(tR===i?'#C8A84B':'#1C2740')+';border-radius:20px;background:'+(tR===i?'rgba(200,168,75,.15)':'#161E2E')+';color:'+(tR===i?'#C8A84B':'#4A5A72')+';font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0;white-space:nowrap">'+esc(r.name)+'</button>');
  });
  h.push('</div>');
  var cur=rounds[tR];
  if(cur){
    cur.matches.forEach(function(m){
      h.push('<div style="background:#0B0F18;border:1px solid '+(m.winnerId?'#22C55E':'#1C2740')+';border-radius:12px;padding:14px;margin-bottom:10px">');
      h.push('<div style="display:flex;align-items:center;gap:8px">');
      h.push('<div style="flex:1;text-align:center;opacity:'+(m.winnerId&&m.winnerId!==m.p1?0.5:1)+'"><div style="font-weight:700">'+(m.p1?nm_(m.p1):'BYE')+'</div></div>');
      h.push('<div style="font-weight:900;color:'+(m.winnerId?'#C8A84B':'#4A5A72')+';font-size:'+(m.winnerId?20:14)+'px;min-width:48px;text-align:center">'+(m.sA!==null?m.sA+'×'+m.sB:'VS')+'</div>');
      h.push('<div style="flex:1;text-align:center;opacity:'+(m.winnerId&&m.winnerId!==m.p2?0.5:1)+'"><div style="font-weight:700">'+(m.p2?nm_(m.p2):'BYE')+'</div></div>');
      h.push('</div>');
      if(!m.winnerId&&m.p1&&m.p2&&at.status==='active'){
        var editing=S.se.mid===m.id;
        if(editing){
          h.push('<div style="margin-top:12px"><div class="score-row"><input class="score-inp" type="number" placeholder="0" value="'+esc(S.se.sA)+'" oninput="updSe(\'sA\',this.value)"><input class="score-inp" type="number" placeholder="0" value="'+esc(S.se.sB)+'" oninput="updSe(\'sB\',this.value)"></div>');
          h.push('<div style="display:flex;gap:8px"><button onclick="setSe0()" style="flex:1;padding:10px;background:transparent;border:1px solid #1C2740;border-radius:10px;color:#4A5A72;cursor:pointer">Cancelar</button><button onclick="recScore()" style="flex:2;padding:10px;background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;border-radius:10px;color:#000;font-weight:800;cursor:pointer">Salvar</button></div></div>');
        }else{
          h.push('<button onclick="startEditScore(\''+at.id+'\','+tR+',\''+m.id+'\',\''+m.p1+'\',\''+m.p2+'\')" style="width:100%;margin-top:10px;padding:9px;background:#161E2E;border:1px solid #1C2740;border-radius:10px;color:#4A5A72;cursor:pointer;font-size:13px">✏️ Registrar placar</button>');
        }
      }
      h.push('</div>');
    });
  }
  return h.join('');
}

// score editing
function startEditRR(tid,rid,cid){set({se:{tid:tid,rid:rid,cid:cid,mid:'',sA:'',sB:'',p1:'',p2:''}})}
function startEditScore(tid,rid,mid,p1,p2){set({se:{tid:tid,rid:rid,cid:'',mid:mid,sA:'',sB:'',p1:p1,p2:p2}})}
function updSe(k,v){S.se[k]=v}
function setSe0(){set({se:{tid:'',rid:0,cid:'',mid:'',sA:'',sB:'',p1:'',p2:''}})}

function recRR(){
  var se=S.se;if(!se.sA||!se.sB)return;
  var sa=parseInt(se.sA),sb=parseInt(se.sB);
  if(sa===sb){toast_('Sem empate','#EF4444');return}
  var ut=S.tours.map(function(t){
    if(t.id!==se.tid)return t;
    var schedule=t.schedule.map(function(r,ri){return ri!==se.rid?r:Object.assign({},r,{courts:r.courts.map(function(c){return c.id!==se.cid?c:Object.assign({},c,{sA:sa,sB:sb})})})});
    var done=schedule.every(function(r){return r.courts.every(function(c){return c.sA!==null})});
    var champ=t.champion,status=t.status;
    if(done){var st=calcSt(schedule,t.players,t.criteria||'wins_first');champ=st[0]?st[0].pid:null;status='finished'}
    return Object.assign({},t,{schedule:schedule,champion:champ,status:status});
  });
  save('bl_t',ut);
  var tt=ut.find(function(x){return x.id===se.tid});
  set({tours:ut,sel:tt,se:{tid:'',rid:0,cid:'',mid:'',sA:'',sB:'',p1:'',p2:''}});
  if(tt.status==='finished')toast_('👑 '+S.players.find(function(p){return p.id===tt.champion}).name+' REI/RAINHA!','#C8A84B');
  else toast_('Salvo! 🎾');
}

function recScore(){
  var se=S.se;if(!se.sA||!se.sB)return;
  var sa=parseInt(se.sA),sb=parseInt(se.sB);
  if(sa===sb){toast_('Sem empate','#EF4444');return}
  var wid=sa>sb?se.p1:se.p2;
  var ut=S.tours.map(function(t){
    if(t.id!==se.tid)return t;
    var rounds=t.rounds.map(function(r,ri){return ri!==se.rid?r:Object.assign({},r,{matches:r.matches.map(function(m){return m.id!==se.mid?m:Object.assign({},m,{sA:sa,sB:sb,winnerId:wid})})})});
    return Object.assign({},t,{rounds:rounds});
  });
  var tt=ut.find(function(x){return x.id===se.tid});
  if(tt.rounds[se.rid].matches.every(function(m){return m.winnerId})){
    var nr=advR(tt.rounds);
    var champ=nr[nr.length-1].matches.length===1&&nr[nr.length-1].matches[0].winnerId?nr[nr.length-1].matches[0].winnerId:null;
    ut=ut.map(function(t){return t.id!==se.tid?t:Object.assign({},t,{rounds:nr,champion:champ,status:champ?'finished':'active'})});
    if(champ){toast_('🏆 '+S.players.find(function(p){return p.id===champ}).name+' CAMPEÃO!','#C8A84B')}
    else{toast_('Rodada completa!','#38BDF8');set({tR:se.rid+1})}
  }
  var gm={id:uid(),pA:se.p1,pB:se.p2,sA:sa,sB:sb,winnerId:wid,arena:tt.arena,date:tt.date,created:new Date().toISOString(),type:'tournament',tournamentId:se.tid};
  var um=S.matches.concat([gm]);save('bl_m',um);save('bl_t',ut);
  set({tours:ut,matches:um,sel:ut.find(function(x){return x.id===se.tid}),se:{tid:'',rid:0,cid:'',mid:'',sA:'',sB:'',p1:'',p2:''}});
}

// ── MODAL: PROFILE ──
function selPlayer(id){var p=S.players.find(function(x){return x.id===id});if(p)set({sel:p,modal:'profile'})}
function renderModalProfile(){
  var p=S.sel;var s=stats(p.id,S.matches);var hist=bliHist(p.id,S.matches);
  var h=[];
  var icon=p.gender==='F'?'👩':'👨';
  h.push('<div style="text-align:center;margin-bottom:20px">');
  h.push('<div style="font-size:48px;margin-bottom:8px">'+icon+'</div>');
  h.push('<div style="font-size:22px;font-weight:900">'+esc(p.name)+'</div>');
  h.push('<div style="font-size:14px;color:#4A5A72;margin-top:3px">'+(p.arena||p.city||'—')+'</div>');
  h.push('<div style="font-size:32px;font-weight:900;color:#C8A84B;margin-top:8px">'+bli(p.id,S.matches)+' BLI</div>');
  h.push('</div>');
  h.push('<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">');
  [['Jogos',s.played,'#E2EAF4'],['Vitórias',s.wins,'#22C55E'],['%',s.rate+'%','#C8A84B']].forEach(function(x){
    h.push('<div style="background:#161E2E;border-radius:10px;padding:12px 8px;text-align:center"><div style="font-size:22px;font-weight:900;color:'+x[2]+'">'+x[1]+'</div><div style="font-size:11px;color:#4A5A72;margin-top:2px">'+x[0]+'</div></div>');
  });
  h.push('</div>');
  if(hist.length>1){
    h.push('<div style="margin-bottom:16px;background:#161E2E;border-radius:12px;padding:12px 0 8px"><div style="font-size:12px;font-weight:700;padding-left:14px;margin-bottom:8px;color:#4A5A72">EVOLUÇÃO BLI</div>'+miniChart(hist)+'</div>');
  }
  var badges=[];
  if(s.wins>=1)badges.push('🎯 Primeira vitória');
  if(s.wins>=10)badges.push('🔥 10 vitórias');
  if(s.wins>=25)badges.push('💎 25 vitórias');
  if(s.played>=20)badges.push('⚡ Veterano');
  if(S.tours.some(function(t){return t.champion===p.id&&t.status==='finished'}))badges.push('🏆 Campeão');
  if(badges.length){
    h.push('<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:#4A5A72;margin-bottom:8px">CONQUISTAS</div><div style="display:flex;flex-wrap:wrap;gap:6px">');
    badges.forEach(function(b){h.push('<span style="background:rgba(200,168,75,.15);color:#C8A84B;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">'+b+'</span>')});
    h.push('</div></div>');
  }
  h.push('<div style="font-size:12px;font-weight:700;color:#4A5A72;margin-bottom:8px">ÚLTIMAS PARTIDAS</div>');
  var myMatches=S.matches.filter(function(m){return m.pA===p.id||m.pB===p.id}).slice(-5).reverse();
  if(!myMatches.length)h.push('<div style="color:#4A5A72;font-size:13px;text-align:center;padding:16px">Nenhuma partida ainda</div>');
  myMatches.forEach(function(m){
    var won=m.winnerId===p.id;var opp=m.pA===p.id?m.pB:m.pA;
    var myS=m.pA===p.id?m.sA:m.sB,opS=m.pA===p.id?m.sB:m.sA;
    h.push('<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161E2E;border-radius:8px;margin-bottom:6px">');
    h.push('<span style="font-size:16px">'+(won?'✓':'✗')+'</span>');
    h.push('<div style="flex:1"><div style="font-size:13px;font-weight:600">vs '+nm_(opp)+'</div><div style="font-size:11px;color:#4A5A72">'+(m.arena||'—')+' · '+m.date+'</div></div>');
    h.push('<div style="font-weight:800;color:'+(won?'#22C55E':'#EF4444')+'">'+myS+'×'+opS+'</div>');
    h.push('</div>');
  });
  return h.join('');
}

// ── INIT ──
var stored_p=load('bl_p');var stored_m=load('bl_m');var stored_t=load('bl_t');
if(stored_p)S.players=stored_p;
if(stored_m)S.matches=stored_m;
if(stored_t)S.tours=stored_t;
render();
</script>

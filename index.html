<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BeachLine™</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07080A;--panel:#0F1115;--panel2:#161A20;--border:#1E2328;--sand:#C8A84B;--sand2:rgba(200,168,75,.1);--green:#22C55E;--red:#EF4444;--blue:#38BDF8;--text:#E2E8F0;--sub:#64748B}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;overscroll-behavior:none}
#app{min-height:100vh;padding-bottom:70px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0B0E14;border-top:1px solid var(--border);display:flex;z-index:100;height:60px}
nav button{flex:1;background:none;border:none;padding:8px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--sub)}
nav button.active{color:var(--sand)}
.header{padding:16px 16px 12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:50}
.header h1{font-size:22px;font-weight:900;letter-spacing:-.5px}
.header h1 em{color:var(--sand);font-style:normal}
.header-sub{font-size:12px;color:var(--sub);margin-top:2px}
.sport-bar{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.sp-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:transparent;color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sp-btn.active{border-color:var(--sand);background:var(--sand2);color:var(--sand)}
.list{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
.card-title{font-size:15px;font-weight:800;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--sub)}
.card-row{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-blue{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.2)}
.badge-sand{background:var(--sand2);color:var(--sand);border:1px solid rgba(200,168,75,.25)}
.badge-green{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.badge-red{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,#C8A84B,#8A6020);color:#000}
.btn-green{background:linear-gradient(135deg,#22C55E,#16803c);color:#000}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--sub)}
.btn-red-outline{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn-sm{padding:8px 14px;width:auto;font-size:12px;border-radius:10px;font-weight:700;border:none;cursor:pointer}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--sub);text-transform:uppercase;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none}
.field input:focus{border-color:var(--sand)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:8px 14px;border:1.5px solid var(--border);border-radius:20px;background:transparent;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
.pill.on{border-color:var(--sand);background:var(--sand2);color:var(--sand)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end}
.modal-box{background:var(--panel);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px 16px 48px}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:900;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--sub);margin-bottom:18px}
.match-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.match-card.done{border-color:var(--green)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.team-name{font-size:13px;font-weight:700}
.team-name.win{color:var(--green)}
.team-name.r{text-align:right}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score-inp{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:10px;text-align:center;font-size:24px;font-weight:900;color:var(--text);width:100%;outline:none}
.score-inp:focus{border-color:var(--sand)}
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.rank-pos{font-size:18px;font-weight:900;color:var(--sub);width:28px;text-align:center;flex-shrink:0}
.rank-pos.top{color:var(--sand)}
.p-avatar{width:40px;height:40px;border-radius:50%;background:var(--sand2);border:1.5px solid var(--sand);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--sand);flex-shrink:0}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty-icon{font-size:48px;margin-bottom:12px}
.fab{position:fixed;bottom:76px;right:16px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#C8A84B,#8A6020);border:none;color:#000;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(200,168,75,.4);z-index:90;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:#1E293B;color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:999;transition:transform .25s;border:1px solid var(--border);max-width:90vw;text-align:center;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--sand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sec{padding:14px 16px}
.sec-title{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.p-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.back-btn{background:none;border:none;color:var(--sand);font-size:14px;font-weight:700;cursor:pointer;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.detail-hdr{padding:14px 16px;border-bottom:1px solid var(--border)}
.status-bar{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.step{font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.step.done{color:var(--green)}.step.active{color:var(--sand)}.step.off{color:var(--sub)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.round-label{font-size:10px;letter-spacing:2px;color:var(--sand);font-weight:700;text-transform:uppercase;margin:14px 16px 8px}
</style>
</head>
<body>

<div id="splash">
  <div style="font-size:38px;font-weight:900;letter-spacing:-.5px">Beach<span style="color:var(--sand)">Line</span>™</div>
  <div class="spin"></div>
  <div style="font-size:12px;color:var(--sub)">Carregando...</div>
</div>

<div id="toast"></div>
<div id="app"></div>

<script>
/* ── STATE ── */
var DB={players:ld('bl_p')||[],tours:ld('bl_t')||[],sport:ld('bl_sp')||'bt'};
var UI={tab:'tours',modal:null,mData:null,detailId:null,form:{}};

function ld(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function sv(){try{localStorage.setItem('bl_p',JSON.stringify(DB.players));localStorage.setItem('bl_t',JSON.stringify(DB.tours));localStorage.setItem('bl_sp',DB.sport);}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function today(){return new Date().toISOString().slice(0,10);}
function initials(name){return name.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();}

/* ── TOAST ── */
var _tt;
function toast(msg,bg){var el=document.getElementById('toast');el.textContent=msg;el.style.background=bg||'#1E293B';el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('show');},2500);}

/* ── SPORT NAMES ── */
var SPORTS={bt:'🎾 Beach Tennis',vb:'🏐 Vôlei',fv:'⚽ Futevôlei'};
var FMT={elim:'🏆 Eliminação',grupos:'👥 Grupos+Chaves',rei:'👑 Rei/Rainha',danca:'💃 Dança das Quadras'};
var STATUS_LABEL={open:'Inscrições abertas',running:'Em andamento',done:'Concluído'};
var STATUS_BADGE={open:'badge-blue',running:'badge-sand',done:'badge-green'};

/* ── SPORT BAR ── */
function sportBar(){
  var h='<div class="sport-bar">';
  [['bt','🎾 BT'],['vb','🏐 VB'],['fv','⚽ FV']].forEach(function(s){
    h+='<button class="sp-btn'+(DB.sport===s[0]?' active':'')+'" data-sp="'+s[0]+'">'+s[1]+'</button>';
  });
  return h+'</div>';
}

/* ══════════════════════════════
   PAGES
══════════════════════════════ */
function pageTours(){
  var tours=DB.tours.filter(function(t){return t.sport===DB.sport;});
  var h='<div class="header"><h1>Beach<em>Line</em>™</h1><div class="header-sub">Torneios · '+SPORTS[DB.sport]+'</div></div>'+sportBar();
  if(!tours.length) return h+'<div class="empty"><div class="empty-icon">🏆</div><div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px">Nenhum torneio</div><div>Toque em + para criar</div></div>';
  h+='<div class="list">';
  tours.forEach(function(t){
    h+='<div class="card" style="cursor:pointer" data-a="tour" data-id="'+t.id+'"><div class="card-row" style="margin-bottom:8px"><div class="card-title">'+esc(t.name)+'</div><span class="badge '+STATUS_BADGE[t.status]+'">'+STATUS_LABEL[t.status]+'</span></div>';
    h+='<div class="card-sub">'+esc(t.arena||'—')+' · '+esc(t.date||'')+'</div>';
    h+='<div class="card-sub" style="margin-top:4px">'+(FMT[t.format]||t.format)+' · '+(t.players?t.players.length:0)+' inscritos · '+t.courts+' quadra(s)</div></div>';
  });
  return h+'</div>';
}

function pageInsc(){
  var open=DB.tours.filter(function(t){return t.status==='open';});
  var h='<div class="header"><h1>📋 Inscrições</h1><div class="header-sub">Torneios com inscrições abertas</div></div>';
  if(!open.length) return h+'<div class="empty"><div class="empty-icon">📋</div><div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px">Nenhum torneio aberto</div><div>Crie um torneio para aparecer aqui</div></div>';
  h+='<div class="list">';
  open.forEach(function(t){
    var n=t.players?t.players.length:0, mx=t.maxPlayers||0, full=mx&&n>=mx;
    var icon={bt:'🎾',vb:'🏐',fv:'⚽'}[t.sport]||'🎾';
    h+='<div class="card"><div class="card-row" style="margin-bottom:8px"><div class="card-title">'+icon+' '+esc(t.name)+'</div><span class="badge '+(full?'badge-red':'badge-green')+'">'+(full?'LOTADO':n+(mx?'/'+mx:'')+' inscritos')+'</span></div>';
    h+='<div class="card-sub">'+esc(t.arena||'—')+' · '+esc(t.date||'')+'</div>';
    if(t.players&&t.players.length){
      h+='<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">';
      t.players.forEach(function(pid){var p=DB.players.find(function(x){return x.id===pid;});h+='<span style="background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--sub)">'+(p?esc(p.name):'?')+'</span>';});
      h+='</div>';
    }
    h+='<div class="g2" style="margin-top:12px;gap:8px">';
    h+='<button class="btn-sm btn-green" data-a="insc-self" data-id="'+t.id+'"'+(full?' disabled style="opacity:.4"':'')+'>✋ Inscrever-me</button>';
    h+='<button class="btn-sm" style="background:transparent;border:1.5px solid var(--border);color:var(--sub);border-radius:10px;font-weight:700;padding:8px 14px;cursor:pointer;font-size:12px" data-a="insc-add" data-id="'+t.id+'">+ Adicionar</button>';
    h+='</div></div>';
  });
  return h+'</div>';
}

function pagePlayers(){
  var h='<div class="header"><h1>👥 Atletas</h1><div class="header-sub">'+DB.players.length+' cadastrados</div></div>';
  if(!DB.players.length) return h+'<div class="empty"><div class="empty-icon">👤</div><div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px">Nenhum atleta</div><div>Toque em + para cadastrar</div></div>';
  h+='<div style="padding:0 16px">';
  DB.players.forEach(function(p){
    h+='<div class="p-row"><div class="p-avatar">'+initials(p.name)+'</div><div style="flex:1"><div style="font-weight:700;font-size:14px">'+esc(p.name)+'</div><div style="font-size:11px;color:var(--sub)">'+(p.gender?p.gender+' · ':'')+( p.cat?'Cat '+p.cat:'')+'</div></div>';
    h+='<button class="btn-sm btn-red-outline" data-a="del-p" data-id="'+p.id+'" style="padding:6px 10px;border-radius:8px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-size:12px;cursor:pointer">✕</button></div>';
  });
  return h+'</div>';
}

function pageRank(){
  var h='<div class="header"><h1>📊 Ranking</h1><div class="header-sub">'+SPORTS[DB.sport]+'</div></div>'+sportBar();
  var pts={};
  DB.players.forEach(function(p){pts[p.id]=0;});
  DB.tours.filter(function(t){return t.status==='done'&&t.sport===DB.sport;}).forEach(function(t){
    (t.matches||[]).forEach(function(m){
      if(!m.winner) return;
      var rp={final:100,semi:60,quarter:40,group:20}[m.round]||10;
      // winner is a dupla key like "id1_id2"
      var wids=m.winner.split('_');
      wids.forEach(function(wid){if(pts[wid]!==undefined)pts[wid]+=rp;});
    });
  });
  var ranked=DB.players.map(function(p){return{p:p,pts:pts[p.id]||0};}).filter(function(x){return x.pts>0;}).sort(function(a,b){return b.pts-a.pts;});
  if(!ranked.length) return h+'<div class="empty"><div class="empty-icon">📊</div><div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px">Ranking vazio</div><div>Conclua torneios para ver pontuações</div></div>';
  ranked.forEach(function(x,i){
    h+='<div class="rank-row"><div class="rank-pos '+(i<3?'top':'')+'">'+(i+1)+'</div><div style="flex:1"><div style="font-weight:700;font-size:14px">'+esc(x.p.name)+'</div><div style="font-size:11px;color:var(--sub)">'+(x.p.cat?'Cat '+x.p.cat:'')+'</div></div><div style="font-size:16px;font-weight:900;color:var(--sand)">'+x.pts+' pts</div></div>';
  });
  return h;
}

/* ══════════════════════════════
   DETAIL
══════════════════════════════ */
function pageDetail(){
  var t=DB.tours.find(function(x){return x.id===UI.detailId;});
  if(!t){UI.detailId=null;return pageTours();}
  var h='<div class="detail-hdr"><button class="back-btn" data-a="back">← Torneios</button>';
  h+='<div style="font-size:20px;font-weight:900">'+esc(t.name)+'</div>';
  h+='<div style="font-size:12px;color:var(--sub);margin-top:2px">'+esc(t.arena||'—')+' · '+esc(t.date||'')+'</div></div>';
  // Status steps
  h+='<div class="status-bar">';
  [{k:'open',l:'📋 Inscrições'},{k:'running',l:'🎮 Em jogo'},{k:'done',l:'🏆 Concluído'}].forEach(function(s){
    var cls=t.status===s.k?'active':(t.status==='done'||t.status==='running'&&s.k==='open')?'done':'off';
    h+='<div class="step '+cls+'">'+s.l+'</div>';
  });
  h+='</div>';
  if(t.status==='open') return h+detailOpen(t);
  if(t.status==='running') return h+detailRunning(t);
  return h+detailDone(t);
}

function detailOpen(t){
  var n=t.players?t.players.length:0,mx=t.maxPlayers||0;
  var h='<div class="sec"><div class="g2">';
  h+='<div class="card" style="cursor:default"><div style="font-size:11px;color:var(--sub)">Formato</div><div style="font-weight:800;margin-top:4px;font-size:13px">'+(FMT[t.format]||t.format)+'</div></div>';
  h+='<div class="card" style="cursor:default"><div style="font-size:11px;color:var(--sub)">Quadras</div><div style="font-weight:800;margin-top:4px;font-size:24px">'+t.courts+'</div></div>';
  h+='</div></div>';
  // Players
  h+='<div class="sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="sec-title" style="margin:0">Inscritos ('+n+(mx?'/'+mx:'')+')</div>';
  h+='<button class="btn-sm btn-gold" data-a="add-p-tour" data-id="'+t.id+'" style="padding:8px 14px;background:var(--sand2);border:1px solid rgba(200,168,75,.3);color:var(--sand);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer">+ Adicionar</button></div>';
  if(!n){h+='<div style="text-align:center;padding:16px;color:var(--sub);font-size:13px">Nenhum atleta inscrito</div>';}
  else{
    (t.players||[]).forEach(function(pid){
      var p=DB.players.find(function(x){return x.id===pid;});
      if(!p) return;
      h+='<div class="p-row"><div class="p-avatar">'+initials(p.name)+'</div><div style="flex:1;font-weight:700">'+esc(p.name)+'</div>';
      h+='<button class="btn-sm" style="background:transparent;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer" data-a="rm-p" data-tour="'+t.id+'" data-id="'+pid+'">✕</button></div>';
    });
  }
  h+='</div>';
  // Duplas
  h+='<div class="sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="sec-title" style="margin:0">Duplas ('+(t.duplas?t.duplas.length:0)+')</div>';
  h+='<button class="btn-sm" style="background:var(--sand2);border:1px solid rgba(200,168,75,.3);color:var(--sand);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;padding:8px 14px" data-a="add-dupla" data-id="'+t.id+'">+ Formar dupla</button></div>';
  if(t.duplas&&t.duplas.length){
    t.duplas.forEach(function(d,i){
      var p1=DB.players.find(function(x){return x.id===d[0];});
      var p2=DB.players.find(function(x){return x.id===d[1];});
      h+='<div class="card" style="cursor:default;margin-bottom:8px"><div style="font-size:11px;color:var(--sub);margin-bottom:4px">Dupla '+(i+1)+'</div>';
      h+='<div style="font-weight:700;font-size:14px">'+(p1?esc(p1.name):'?')+' & '+(p2?esc(p2.name):'?')+'</div></div>';
    });
  } else {
    h+='<div style="text-align:center;padding:14px;color:var(--sub);font-size:13px">Nenhuma dupla formada ainda</div>';
  }
  h+='</div>';
  // Actions
  var canStart=(t.duplas&&t.duplas.length>=2)||(n>=2&&(!t.duplas||!t.duplas.length));
  h+='<div class="form">';
  if(canStart) h+='<button class="btn btn-gold" data-a="start" data-id="'+t.id+'" style="margin-bottom:10px">▶ Iniciar Torneio</button>';
  else h+='<div style="text-align:center;font-size:13px;color:var(--sub);padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px">Adicione pelo menos 2 duplas para iniciar</div>';
  h+='<button class="btn" style="background:transparent;border:1.5px solid var(--red);color:var(--red)" data-a="del-tour" data-id="'+t.id+'">🗑 Excluir Torneio</button>';
  h+='</div>';
  return h;
}

function detailRunning(t){
  var matches=t.matches||[];
  var byRound={};
  matches.forEach(function(m){(byRound[m.round]=byRound[m.round]||[]).push(m);});
  var order=['group','quarter','semi','final'];
  var labels={group:'Fase de Grupos',quarter:'Quartas de Final',semi:'Semifinal',final:'Final'};
  var h='<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px">';
  h+='<button class="btn btn-outline" style="border-color:var(--green);color:var(--green)" data-a="finish" data-id="'+t.id+'">🏆 Finalizar</button>';
  h+='</div>';
  order.forEach(function(r){
    if(!byRound[r]) return;
    h+='<div class="round-label">'+labels[r]+'</div><div style="padding:0 16px">';
    byRound[r].forEach(function(m){ h+=matchCard(t,m); });
    h+='</div>';
  });
  return h;
}

function matchCard(t,m){
  var d1=getDupla(t,m.d1),d2=getDupla(t,m.d2);
  var n1=d1?dName(d1):'—',n2=d2?dName(d2):'—';
  var done=m.scoreA!==null&&m.scoreB!==null;
  var w1=done&&m.scoreA>m.scoreB,w2=done&&m.scoreB>m.scoreA;
  var h='<div class="match-card'+(done?' done':'')+'"><div class="teams">';
  h+='<div class="team-name'+(w1?' win':'')+'">'+esc(n1)+'</div><div style="font-size:11px;color:var(--sub)">vs</div>';
  h+='<div class="team-name r'+(w2?' win':'')+'">'+esc(n2)+'</div></div>';
  if(!done){
    h+='<div class="score-row"><input type="number" class="score-inp" min="0" max="99" placeholder="0" data-mid="'+m.id+'" data-team="A">';
    h+='<input type="number" class="score-inp" min="0" max="99" placeholder="0" data-mid="'+m.id+'" data-team="B"></div>';
    h+='<button class="btn btn-gold" style="margin-top:10px" data-a="save-score" data-tour="'+t.id+'" data-mid="'+m.id+'">✓ Confirmar</button>';
  } else {
    h+='<div style="text-align:center;font-size:20px;font-weight:900;color:var(--sub);margin-top:4px">'+m.scoreA+' — '+m.scoreB+'</div>';
  }
  return h+'</div>';
}

function detailDone(t){
  var matches=t.matches||[];
  var fin=matches.find(function(m){return m.round==='final'&&m.winner;});
  var h='';
  if(fin){
    var wd=getDupla(t,fin.winner);
    h+='<div style="text-align:center;padding:28px 20px;border-bottom:1px solid var(--border)"><div style="font-size:48px;margin-bottom:8px">🏆</div><div style="font-size:12px;color:var(--sub);margin-bottom:6px">CAMPEÃO</div>';
    h+='<div style="font-size:22px;font-weight:900;color:var(--sand)">'+(wd?esc(dName(wd)):'—')+'</div></div>';
  }
  h+='<div class="sec"><div class="sec-title">Resultados</div>';
  matches.filter(function(m){return m.winner;}).forEach(function(m){
    var d1=getDupla(t,m.d1),d2=getDupla(t,m.d2);
    h+='<div class="card" style="cursor:default;margin-bottom:8px"><div style="font-size:11px;color:var(--sub);margin-bottom:4px">'+({group:'Grupo',quarter:'Quartas',semi:'Semi',final:'Final'}[m.round]||m.round)+'</div>';
    h+='<div style="font-size:14px;font-weight:700">'+esc(d1?dName(d1):'—')+'<span style="color:var(--sub);font-weight:400"> '+m.scoreA+'–'+m.scoreB+' </span>'+esc(d2?dName(d2):'—')+'</div></div>';
  });
  h+='</div>';
  return h;
}

/* ══════════════════════════════
   TOURNAMENT LOGIC
══════════════════════════════ */
function startTour(tid){
  var t=DB.tours.find(function(x){return x.id===tid;});
  if(!t) return;
  var duplas=t.duplas||[];
  // Auto-pair if no duplas
  if(!duplas.length&&t.players&&t.players.length>=2){
    var ps=t.players.slice();
    for(var i=0;i<ps.length;i+=2){if(i+1<ps.length)duplas.push([ps[i],ps[i+1]]);}
    t.duplas=duplas;
  }
  if(duplas.length<2){toast('Adicione pelo menos 2 duplas','var(--red)');return;}
  var keys=duplas.map(function(d){return d[0]+'_'+d[1];});
  t.matches=genMatches(keys,t.format,t.courts);
  t.status='running';
  sv();toast('Torneio iniciado! 🎮','var(--green)');render();
}

function genMatches(keys,fmt,courts){
  var matches=[];
  if(fmt==='elim'||fmt==='danca'){
    var n=keys.length,r=n<=2?'final':n<=4?'semi':n<=8?'quarter':'group';
    for(var i=0;i<n-1;i+=2)matches.push({id:uid(),round:r,d1:keys[i],d2:keys[i+1],scoreA:null,scoreB:null,winner:null});
  } else if(fmt==='grupos'){
    for(var i=0;i<keys.length;i++)for(var j=i+1;j<keys.length;j++)matches.push({id:uid(),round:'group',d1:keys[i],d2:keys[j],scoreA:null,scoreB:null,winner:null});
  } else if(fmt==='rei'){
    for(var i=0;i<keys.length;i++){var j=(i+1)%keys.length;matches.push({id:uid(),round:'group',court:'Q'+(i%courts+1),d1:keys[i],d2:keys[j],scoreA:null,scoreB:null,winner:null});}
  } else {
    for(var i=0;i<keys.length-1;i+=2)matches.push({id:uid(),round:'group',d1:keys[i],d2:keys[i+1],scoreA:null,scoreB:null,winner:null});
  }
  return matches;
}

function saveScore(tid,mid){
  var t=DB.tours.find(function(x){return x.id===tid;});
  if(!t) return;
  var m=t.matches.find(function(x){return x.id===mid;});
  if(!m) return;
  var inA=document.querySelector('[data-mid="'+mid+'"][data-team="A"]');
  var inB=document.querySelector('[data-mid="'+mid+'"][data-team="B"]');
  if(!inA||!inB){toast('Preencha os placares','var(--red)');return;}
  var sA=parseInt(inA.value),sB=parseInt(inB.value);
  if(isNaN(sA)||isNaN(sB)){toast('Digite os placares','var(--red)');return;}
  if(sA===sB){toast('Resultado não pode ser empate','var(--red)');return;}
  m.scoreA=sA;m.scoreB=sB;m.winner=sA>sB?m.d1:m.d2;
  advanceBracket(t);sv();
  toast('Placar salvo! ✅','var(--green)');render();
}

function advanceBracket(t){
  var order=['group','quarter','semi','final'];
  var ms=t.matches;
  for(var ri=0;ri<order.length-1;ri++){
    var curr=order[ri],next=order[ri+1];
    var cm=ms.filter(function(m){return m.round===curr;});
    if(!cm.length||!cm.every(function(m){return m.winner;})) continue;
    if(ms.some(function(m){return m.round===next;})) continue;
    var wins=cm.map(function(m){return m.winner;});
    for(var i=0;i<wins.length-1;i+=2)ms.push({id:uid(),round:next,d1:wins[i],d2:wins[i+1],scoreA:null,scoreB:null,winner:null});
  }
}

/* ── HELPERS ── */
function getDupla(t,key){
  if(!key) return null;
  var ids=key.split('_');
  var p1=DB.players.find(function(x){return x.id===ids[0];}),p2=DB.players.find(function(x){return x.id===ids[1];});
  return p1&&p2?[p1,p2]:null;
}
function dName(d){return d&&d[0]&&d[1]?d[0].name.split(' ')[0]+' & '+d[1].name.split(' ')[0]:'—';}

function render(){
  var pages={tours:pageTours,inscricoes:pageInsc,players:pagePlayers,ranking:pageRank};
  var content=UI.detailId?pageDetail():(pages[UI.tab]||pageTours)();
  var nav='<nav>';
  [['tours','🏆','Torneios'],['inscricoes','📋','Inscrições'],['players','👥','Atletas'],['ranking','📊','Ranking']].forEach(function(t){
    nav+='<button class="'+((!UI.detailId&&UI.tab===t[0])?'active':'')+'" data-a="tab" data-tab="'+t[0]+'"><span>'+t[1]+'</span><span>'+t[2]+'</span></button>';
  });
  nav+='</nav>';
  var fab='';
  if(!UI.detailId&&UI.tab!=='ranking'&&UI.tab!=='inscricoes'){
    fab='<button class="fab" data-a="fab">＋</button>';
  }
  var modal=renderModal();
  document.getElementById('app').innerHTML=nav+content+fab+modal;
  bind();
}

function bind(){
  document.getElementById('app').addEventListener('click',handler,{once:true});
  var bg=document.getElementById('mbg');
  if(bg) bg.addEventListener('click',function(e){if(e.target===bg){UI.modal=null;UI.form={};render();}},{once:true});
}

function handler(e){
  var el=e.target.closest('[data-a],[data-sp],[data-fp]');
  if(!el) return;

  // Sport
  if(el.dataset.sp){DB.sport=el.dataset.sp;sv();render();return;}
  // Form pill
  if(el.dataset.fp){
    var v=isNaN(el.dataset.v)?el.dataset.v:parseInt(el.dataset.v);
    UI.form[el.dataset.fp]=v;render();return;
  }

  var a=el.dataset.a;
  if(!a) return;

  if(a==='tab'){UI.tab=el.dataset.tab;UI.detailId=null;render();return;}
  if(a==='back'){UI.detailId=null;render();return;}
  if(a==='close-m'){UI.modal=null;UI.form={};render();return;}
  if(a==='tour'){UI.detailId=el.dataset.id;render();return;}

  if(a==='fab'){
    if(UI.tab==='tours'){UI.modal='new-tour';UI.form={fmt:'elim',cat:'Open',gen:'masculino',courts:3,maxP:0};}
    else if(UI.tab==='players'){UI.modal='new-player';UI.form={};}
    render();return;
  }

  if(a==='ok-tour'){
    var name=(document.getElementById('fn')||{}).value||'';
    var arena=(document.getElementById('fa')||{}).value||'';
    var date=(document.getElementById('fd')||{}).value||today();
    if(!name.trim()){toast('Digite o nome do torneio','var(--red)');render();return;}
    var t={id:uid(),name:name.trim(),arena:arena.trim(),date:date,format:UI.form.fmt||'elim',sport:DB.sport,cat:UI.form.cat||'Open',categoria:UI.form.gen||'masculino',courts:UI.form.courts||3,maxPlayers:UI.form.maxP||0,status:'open',players:[],duplas:[],matches:[],created:new Date().toISOString()};
    DB.tours.push(t);sv();UI.modal=null;UI.form={};UI.detailId=t.id;
    toast('Torneio criado! 🎉','var(--green)');render();return;
  }

  if(a==='ok-player'){
    var name=(document.getElementById('fpn')||{}).value||'';
    var phone=(document.getElementById('fpp')||{}).value||'';
    if(!name.trim()){toast('Digite o nome do atleta','var(--red)');render();return;}
    DB.players.push({id:uid(),name:name.trim(),phone:phone.trim(),cat:UI.form.pcat||'',gender:UI.form.pgen||''});
    sv();UI.modal=null;UI.form={};toast('Atleta cadastrado! ✅','var(--green)');render();return;
  }

  if(a==='del-p'){DB.players=DB.players.filter(function(p){return p.id!==el.dataset.id;});sv();toast('Atleta removido');render();return;}

  if(a==='del-tour'){
    if(!confirm('Apagar "'+DB.tours.find(function(t){return t.id===el.dataset.id;})||{name:'?'}.name+'"? Não pode ser desfeito.'))return;
    DB.tours=DB.tours.filter(function(t){return t.id!==el.dataset.id;});
    sv();UI.detailId=null;toast('Torneio apagado');render();return;
  }

  if(a==='add-p-tour'){UI.modal='add-p';UI.mData=el.dataset.id;render();return;}
  if(a==='add-dupla'){UI.modal='add-dupla';UI.mData=el.dataset.id;UI.form={ds:[]};render();return;}
  if(a==='insc-self'){UI.modal='insc-self';UI.mData=el.dataset.id;render();return;}
  if(a==='insc-add'){UI.modal='add-p';UI.mData=el.dataset.id;render();return;}

  if(a==='enroll'||a==='self-enroll'){
    var t=DB.tours.find(function(x){return x.id===el.dataset.tour;});
    if(!t)return;
    if((t.players||[]).indexOf(el.dataset.pid)<0){
      t.players=(t.players||[]).concat([el.dataset.pid]);
      sv();toast('Inscrito! ✅','var(--green)');
    } else toast('Já está inscrito','var(--sand)');
    if(a==='self-enroll'){UI.modal=null;}
    render();return;
  }

  if(a==='rm-p'){
    var t=DB.tours.find(function(x){return x.id===el.dataset.tour;});
    if(t){t.players=(t.players||[]).filter(function(p){return p!==el.dataset.id;});sv();render();}return;
  }

  if(a==='sel-ds'){
    var sel=UI.form.ds||[];var pid=el.dataset.pid;
    if(sel.indexOf(pid)>=0) sel=sel.filter(function(x){return x!==pid;});
    else if(sel.length<2) sel=sel.concat([pid]);
    UI.form.ds=sel;render();return;
  }

  if(a==='reset-ds'){UI.form.ds=[];render();return;}

  if(a==='ok-dupla'){
    var t=DB.tours.find(function(x){return x.id===el.dataset.tour;});
    var sel=UI.form.ds||[];
    if(!t||sel.length!==2){toast('Selecione 2 jogadores','var(--red)');return;}
    t.duplas=(t.duplas||[]).concat([sel]);
    sv();toast('Dupla formada! 👥','var(--green)');UI.modal=null;UI.form={};render();return;
  }

  if(a==='start'){startTour(el.dataset.id);return;}
  if(a==='finish'){
    var t=DB.tours.find(function(x){return x.id===el.dataset.id;});
    if(t){t.status='done';sv();toast('Torneio concluído! 🏆','var(--green)');render();}return;
  }
  if(a==='save-score'){saveScore(el.dataset.tour,el.dataset.mid);return;}
}

/* ── BOOT ── */
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    document.getElementById('splash').style.display='none';
    render();
  },600);
});
</script>
</body>
</html>

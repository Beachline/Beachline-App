// Gráfico de linha simples (sem dependência externa)
function SimpleLineChart({ data }) {
  if (!data || data.length < 2) return null;
  const vals = data.map(d => d.bli);
  const labels = data.map(d => d.date);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min || 1;
  const W = 300, H = 80, P = 12;
  const pts = vals.map((v, i) => {
    const x = P + (i / (vals.length - 1)) * (W - P * 2);
    const y = H - P - ((v - min) / range) * (H - P * 2);
    return [x, y];
  });
  const polyline = pts.map(p => p.join(',')).join(' ');
  const last = pts[pts.length - 1];
  const first = pts[0];
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:'block',padding:'0 4px'}}>
      <defs>
        <linearGradient id="blg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#C8A84B" stopOpacity="0.3"/>
          <stop offset="100%" stopColor="#C8A84B" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon
        fill="url(#blg)"
        points={`${pts[0][0]},${H} ${polyline} ${last[0]},${H}`}
      />
      <polyline fill="none" stroke="#C8A84B" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" points={polyline} />
      <circle cx={last[0]} cy={last[1]} r="4" fill="#C8A84B" />
      <text x={last[0]+6} y={last[1]+4} fill="#C8A84B" fontSize="9" fontWeight="bold">{vals[vals.length-1]}</text>
    </svg>
  );
}



// ══ CONSTANTES REI/RAINHA ══
const RR_VALID_MISTA   = [4, 8, 16, 32];
const RR_LABEL = {
  wins_first:  'Vitórias → Saldo → Confronto',
  saldo_first: 'Saldo → Vitórias → Confronto'
};

// Valida se a contagem é válida para Rei/Rainha
function isValidRR(n, categoria, numCourts) {
  if (n < 4) return false;
  if (categoria === 'mista') return RR_VALID_MISTA.includes(n);
  // Gênero único: válido se tiver pelo menos 1 quadra útil
  const usableCourts = Math.min(numCourts, Math.floor(n / 4));
  return usableCourts >= 1;
}

// Retorna número ótimo de quadras para n jogadores
function optimalCourts(n, maxCourts) {
  return Math.min(maxCourts, Math.floor(n / 4));
}

// ─── Gera partidas para os jogadores ativos usando método de Berger ───
// active.length deve ser múltiplo de 4
function bergerRound(active, r) {
  const n = active.length;
  if (n < 4 || n % 4 !== 0) return [];
  const pin = active[0];
  const wheel = active.slice(1);
  const steps = r % (n - 1);
  const rotated = wheel.slice(steps).concat(wheel.slice(0, steps));
  const arr = [pin, ...rotated];
  const pairs = Array.from({ length: n / 2 }, (_, i) => [arr[i], arr[n - 1 - i]]);
  return Array.from({ length: n / 4 }, (_, c) => ({
    id: uid(),
    team1: pairs[c * 2],
    team2: pairs[c * 2 + 1],
    scoreA: null,
    scoreB: null
  }));
}

// ─── Gerador principal de Rei/Rainha ───
// Suporta qualquer n para gênero único, com qualquer número de quadras.
// Garante: todos que ficaram de fora na rodada N jogam na rodada N+1.
function generateFlexSchedule(pids, numCourts, numRoundsOverride) {
  const n = pids.length;
  const c = optimalCourts(n, numCourts);
  const play_n = c * 4;
  const sit_n  = n - play_n;

  // Sem "descanso" — todos jogam simultaneamente (n é múltiplo de 4c)
  if (sit_n === 0) {
    const maxR = numRoundsOverride || (n - 1);
    const pin = pids[0];
    const wheel = pids.slice(1);
    const sched = [];
    for (let r = 0; r < maxR; r++) {
      const courts = bergerRound(pids, r);
      sched.push({ round: r + 1, sitters: [], courts });
      wheel.push(wheel.shift()); // rotaciona para próxima rodada
    }
    return sched;
  }

  // Com jogadores de fora: rotação por prioridade
  // lastSatAt: rodada em que o jogador ficou por último de fora
  // Maior lastSatAt = ficou de fora mais recentemente = maior prioridade pra jogar
  const lastSatAt = Object.fromEntries(pids.map(p => [p, -999]));
  const played    = Object.fromEntries(pids.map(p => [p, 0]));

  // Número de rodadas: o suficiente para cada jogador ter ficado de fora igual número de vezes
  // Ciclo = quantas rodadas até todos terem ficado fora uma vez = ceil(n / sit_n)
  const cycle     = Math.ceil(n / sit_n);
  const numRounds = numRoundsOverride || (cycle * 3); // 3 ciclos por padrão

  const schedule = [];

  for (let r = 0; r < numRounds; r++) {
    // Ordena por prioridade: quem ficou fora mais recentemente joga primeiro
    // Em caso de empate: quem jogou menos
    const sorted = [...pids].sort((a, b) => {
      if (lastSatAt[b] !== lastSatAt[a]) return lastSatAt[b] - lastSatAt[a];
      return played[a] - played[b];
    });

    const active  = sorted.slice(0, play_n);
    const sitters = sorted.slice(play_n);

    // Garante que active é múltiplo de 4 (é, pois play_n = 4c)
    const courts = bergerRound(active, r);
    schedule.push({ round: r + 1, sitters, courts });

    active.forEach(p  => played[p]++);
    sitters.forEach(p => { lastSatAt[p] = r; });
  }

  return schedule;
}

// Calcula standings do Rei/Rainha
function calcReiRainhaStandings(schedule, playerIds, criteria) {
  const allCourts = schedule.flatMap(r => r.courts);

  const standings = playerIds.map(pid => {
    const myCourts = allCourts.filter(c =>
      c.scoreA !== null &&
      (c.team1.includes(pid) || c.team2.includes(pid))
    );

    let wins = 0, gamesFor = 0, gamesAgainst = 0;
    myCourts.forEach(c => {
      const inT1 = c.team1.includes(pid);
      const myScore = inT1 ? c.scoreA : c.scoreB;
      const opScore = inT1 ? c.scoreB : c.scoreA;
      if (myScore > opScore) wins++;
      gamesFor += myScore || 0;
      gamesAgainst += opScore || 0;
    });

    return {
      pid,
      played: myCourts.length,
      wins,
      losses: myCourts.length - wins,
      gamesFor,
      gamesAgainst,
      saldo: gamesFor - gamesAgainst
    };
  });

  // Função de confronto direto entre dois jogadores (em quadras onde foram adversários)
  const h2h = (aPid, bPid) => {
    const direct = allCourts.filter(c =>
      c.scoreA !== null &&
      ((c.team1.includes(aPid) && c.team2.includes(bPid)) ||
       (c.team1.includes(bPid) && c.team2.includes(aPid)))
    );
    let aW = 0, bW = 0;
    direct.forEach(c => {
      const aInT1 = c.team1.includes(aPid);
      const aScore = aInT1 ? c.scoreA : c.scoreB;
      const bScore = aInT1 ? c.scoreB : c.scoreA;
      if (aScore > bScore) aW++; else bW++;
    });
    return aW - bW; // positivo = a venceu mais
  };

  return standings.sort((a, b) => {
    // Critério primário configurável
    const vitDiff = b.wins - a.wins;
    const saldoDiff = b.saldo - a.saldo;

    if (criteria === 'saldo_first') {
      if (saldoDiff !== 0) return saldoDiff;
      if (vitDiff !== 0)   return vitDiff;
    } else {
      if (vitDiff !== 0)   return vitDiff;
      if (saldoDiff !== 0) return saldoDiff;
    }

    // Confronto direto
    return h2h(b.pid, a.pid);
  });
}

// Valida Rei/Rainha Mista: precisa de M e F em igual quantidade
function validateMista(playerIds, players) {
  const reg = playerIds.map(id => players.find(p => p.id === id)).filter(Boolean);
  const m = reg.filter(p => p.gender === 'M').length;
  const f = reg.filter(p => p.gender === 'F').length;
  const sem = reg.filter(p => !p.gender).length;
  return { m, f, sem, valid: m === f && sem === 0 };
}

function App() {
  const [tab,      setTab]      = useState('ranking');
  const [players,  setPlayers]  = useState([]);
  const [matches,  setMatches]  = useState([]);
  const [tours,    setTours]    = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [modal,    setModal]    = useState(null);
  const [selected, setSelected] = useState(null);

  const [scoreEdit, setScoreEdit] = useState({ tid:'', rid:0, cid:'', sA:'', sB:'', p1:'', p2:'' });
  const [activeTRound, setActiveTRound] = useState(0);

  useEffect(() => {
    (async () => {

      const m = await db.get('bl_matches') || [];
      const t = await db.get('bl_tours')   || [];
      setPlayers(p); setMatches(m); setTours(t); setLoading(false);
    })();
  }, []);

  const showToast = (msg, c=C.green) => { setToast({ msg, c }); setTimeout(() => setToast(null), 2800); };
  const getName   = id => players.find(p => p.id === id)?.name || '?';
  const rank = [...players].map(p => ({ ...p, bli:calcBLI(p.id, matches), ...calcStats(p.id, matches) })).sort((a, b) => b.bli - a.bli);

  // ── Jogadores ──
  async function addPlayer() {
    if (!np.name.trim()) return;
    const p = { id:uid(), name:np.name.trim(), city:np.city.trim(), arena:np.arena.trim(), gender:np.gender||'', joined:new Date().toISOString() };
    const u = [...players, p]; setPlayers(u); await db.set('bl_players', u);
    setNp({ name:'', city:'', arena:'', gender:'' }); setModal(null);
    showToast(`${p.name} cadastrado! 🏖️`);
  }

  // ── Partidas amistosas ──
  async function addMatch() {
    if (!nm.pA || !nm.pB || nm.pA === nm.pB || !nm.sA || !nm.sB) return;
    const sA = parseInt(nm.sA), sB = parseInt(nm.sB);
    if (sA === sB) { showToast('Sem empate em beach tennis', C.red); return; }
    const m = { id:uid(), pA:nm.pA, pB:nm.pB, sA, sB, winnerId:sA>sB?nm.pA:nm.pB, arena:nm.arena.trim(), date:nm.date, created:new Date().toISOString(), type:'friendly' };
    const u = [...matches, m]; setMatches(u); await db.set('bl_matches', u);
    setNm({ pA:'', pB:'', sA:'', sB:'', arena:'', date:new Date().toISOString().split('T')[0] });
    setModal(null); showToast(`Vitória de ${getName(m.winnerId)} registrada! 🎾`);
  }

  // ── Criar torneio ──
  async function createTournament() {
    if (!nt.name.trim()) return;
    const t = {
      id: uid(), name: nt.name.trim(), arena: nt.arena.trim(), date: nt.date,
      format: nt.format, categoria: nt.categoria, criteria: nt.criteria,
      numCourts: parseInt(nt.numCourts)||1, numRounds: nt.numRounds?parseInt(nt.numRounds):null,
      maxPlayers: nt.numPlayers?parseInt(nt.numPlayers):null,
      status: 'registration', players: [], rounds: [], schedule: [],
      champion: null, created: new Date().toISOString()
    };
    const u = [...tours, t]; setTours(u); await db.set('bl_tours', u);
    setNt({ name:'', arena:'', date:new Date().toISOString().split('T')[0], format:'single', categoria:'masculino', criteria:'wins_first' });
    setModal(null); setSelected(t); setModal('tournament'); setActiveTRound(0);
    showToast(`Torneio "${t.name}" criado! 🏆`);
  }

  // ── Inscrever jogador ──
  async function joinTournament(tid, pid) {
    const t = tours.find(x => x.id === tid);
    if (!t || t.players.includes(pid)) return;
    if (t.maxPlayers && t.players.length >= t.maxPlayers) { showToast(`Torneio cheio (${t.maxPlayers} jogadores)`, C.orange); return; }

    // Validação Rei/Rainha
    if (t.format === 'rei_rainha') {
      const newCount = t.players.length + 1;
      // Mista: verifica gênero
      if (t.categoria === 'mista') {
        const player = players.find(p => p.id === pid);
        if (!player?.gender) {
          showToast('Cadastre o gênero do jogador primeiro', C.orange);
          return;
        }
      }
    }

    const u = tours.map(x => x.id !== tid ? x : { ...x, players:[...x.players, pid] });
    setTours(u); await db.set('bl_tours', u);
    const updated = u.find(x => x.id === tid); setSelected(updated);
    showToast(`${getName(pid)} inscrito!`);
  }

  // ── Iniciar torneio ──
  async function startTournament(tid) {
    const t = tours.find(x => x.id === tid);
    if (!t) return;

    if (t.format === 'rei_rainha') {
      const n = t.players.length;

      // Validação: mista exige 4,8,16,32; gênero único exige >= 4
      if (!isValidRR(n, t.categoria, t.numCourts||1)) {
        const msg = t.categoria === 'mista'
          ? `Mista exige 4, 8, 16 ou 32 jogadores. Você tem ${n}.`
          : `Mínimo 4 jogadores para Rei/Rainha. Você tem ${n}.`;
        showToast(msg, C.red); return;
      }

      // Validação mista: número igual de M e F
      if (t.categoria === 'mista') {
        const v = validateMista(t.players, players);
        if (!v.valid) {
          if (v.sem > 0) showToast(`${v.sem} jogador(es) sem gênero cadastrado.`, C.red);
          else showToast(`Mista precisa de igual nº de homens (${v.m}) e mulheres (${v.f}).`, C.red);
          return;
        }
      }

      const c = optimalCourts(n, t.numCourts||1);
      const schedule = generateFlexSchedule(t.players, c, t.numRounds||null);
      const sitters_n = n - c*4;
      const u = tours.map(x => x.id !== tid ? x : { ...x, status:'active', schedule, activeCourts:c });
      setTours(u); await db.set('bl_tours', u);
      const updated = u.find(x => x.id === tid); setSelected(updated); setActiveTRound(0);
      showToast(`Rei/Rainha iniciado! ${c} quadra(s) · ${schedule.length} rodadas · ${sitters_n>0?sitters_n+' de fora por rodada':'todos jogam'} 🏆`);
    } else {
      if (t.players.length < 2) { showToast('Mínimo 2 jogadores', C.red); return; }
      const rounds = generateBracket(t.players, matches);
      const u = tours.map(x => x.id !== tid ? x : { ...x, status:'active', rounds });
      setTours(u); await db.set('bl_tours', u);
      const updated = u.find(x => x.id === tid); setSelected(updated); setActiveTRound(0);
      showToast('Torneio iniciado! Boa sorte! 🏆');
    }
  }

  // ── Registrar placar — Eliminação ──
  async function recordTournamentScore() {
    const { tid, rid, mid, sA, sB, p1, p2 } = scoreEdit;
    if (!sA || !sB) return;
    const sa = parseInt(sA), sb = parseInt(sB);
    if (sa === sb) { showToast('Sem empate em torneio', C.red); return; }
    const winnerId = sa > sb ? p1 : p2;

    let updatedT = tours.map(t => {
      if (t.id !== tid) return t;
      const rounds = t.rounds.map((r, ri) => ri !== rid ? r : {
        ...r, matches: r.matches.map(m => m.id !== mid ? m : { ...m, sA:sa, sB:sb, winnerId })
      });
      return { ...t, rounds };
    });
    const tt = updatedT.find(x => x.id === tid);
    const curRound = tt.rounds[rid];
    if (curRound.matches.every(m => m.winnerId)) {
      const newRounds = advanceRound(tt.rounds, matches);
      const champ = getTournamentChampion(newRounds);
      updatedT = updatedT.map(t => t.id !== tid ? t : { ...t, rounds:newRounds, champion:champ, status:champ?'finished':'active' });
      if (champ) showToast(`🏆 ${getName(champ)} é o CAMPEÃO!`, C.sand);
      else { showToast('Rodada completa!', C.blue); setActiveTRound(rid + 1); }
    }
    const gm = { id:uid(), pA:p1, pB:p2, sA:sa, sB:sb, winnerId, arena:tt.arena, date:tt.date, created:new Date().toISOString(), type:'tournament', tournamentId:tid };
    const um = [...matches, gm]; setMatches(um); await db.set('bl_matches', um);
    setTours(updatedT); await db.set('bl_tours', updatedT);
    setSelected(updatedT.find(x => x.id === tid));
    setScoreEdit({ tid:'', rid:0, mid:'', sA:'', sB:'', p1:'', p2:'' });
  }

  // ── Registrar placar — Rei/Rainha ──
  async function recordRRScore() {
    const { tid, rid, cid, sA, sB } = scoreEdit;
    if (!sA || !sB) return;
    const sa = parseInt(sA), sb = parseInt(sB);
    if (sa === sb) { showToast('Sem empate em beach tennis', C.red); return; }

    let updatedTours = tours.map(t => {
      if (t.id !== tid) return t;
      const schedule = t.schedule.map((r, ri) => ri !== rid ? r : {
        ...r, courts: r.courts.map(c => c.id !== cid ? c : { ...c, scoreA:sa, scoreB:sb })
      });

      // Verifica se torneio terminou
      const allDone = schedule.every(r => r.courts.every(c => c.scoreA !== null));
      let champion = t.champion;
      let status = t.status;

      if (allDone) {
        const standings = calcReiRainhaStandings(schedule, t.players, t.criteria || 'wins_first');
        champion = standings[0]?.pid || null;
        status = 'finished';
      }

      return { ...t, schedule, champion, status };
    });

    setTours(updatedTours); await db.set('bl_tours', updatedTours);
    const tt = updatedTours.find(x => x.id === tid);
    setSelected(tt);
    setScoreEdit({ tid:'', rid:0, cid:'', sA:'', sB:'', p1:'', p2:'' });

    if (tt.status === 'finished') {
      showToast(`👑 ${getName(tt.champion)} é o REI/RAINHA da Praia!`, C.sand);
    } else {
      showToast('Resultado registrado! 🎾');
    }
  }

  // ── Atualizar critério de ranking ──
  async function updateCriteria(tid, criteria) {
    const u = tours.map(t => t.id !== tid ? t : { ...t, criteria });
    setTours(u); await db.set('bl_tours', u);
    const updated = u.find(x => x.id === tid); setSelected(updated);
    showToast('Critério atualizado!');
  }

  if (loading) return (
    <div style={{ background:C.bg, minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16 }}>
      <div style={{ width:44, height:44, border:`3px solid ${C.border}`, borderTop:`3px solid ${C.sand}`, borderRadius:'50%', animation:'spin 1s linear infinite' }} />
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  const activeTour = selected && (modal === 'tournament') ? tours.find(x => x.id === selected.id) : null;

  return (
    <div style={{ background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'Trebuchet MS','Segoe UI',system-ui,sans-serif", maxWidth:460, margin:'0 auto', position:'relative' }}>
      <style>{`
        *{box-sizing:border-box}
        input[type=number]::-webkit-inner-spin-button{display:none}
        input::placeholder,select::placeholder{color:${C.muted}}
        select option{background:${C.panel2};color:${C.text}}
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:${C.border};border-radius:2px}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes toastPop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
        .fu{animation:fadeUp .3s ease both}

              <div style={{ height:10 }} />

                  </div>

                  </div>
                )}
                {/* ── Calculadora ao vivo ── */}
                {(() => {
                  const n = parseInt(nt.numPlayers)||0;
                  const c = parseInt(nt.numCourts)||1;
                  const play = c * 4;
                  const sit  = Math.max(0, n - play);
                  const cycle = sit > 0 ? Math.ceil(n / sit) : (n > 1 ? n - 1 : 0);
                  const rounds = sit > 0 ? cycle * 3 : (n > 1 ? n - 1 : 0);
                  const validMista = nt.categoria === 'mista' && [4,8,16,32].includes(n);
                  const validSingle = nt.categoria !== 'mista' && n >= 4;
                  const valid = validMista || validSingle;
                  return (<>
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:14 }}>
                      <div>
                        <div style={{ fontSize:12, color:C.muted, marginBottom:6, fontWeight:700 }}>JOGADORES</div>

                      </div>
                      <div>
                        <div style={{ fontSize:12, color:C.muted, marginBottom:6, fontWeight:700 }}>QUADRAS</div>

                      </div>
                    </div>
                    {n >= 4 && c >= 1 && (
                      <div style={{ marginBottom:14, borderRadius:12, overflow:'hidden', border:`1px solid ${valid?C.green:C.red}` }}>
                        <div style={{ background:valid?'rgba(34,197,94,.12)':'rgba(239,68,68,.12)', padding:'10px 14px', display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
                          <div style={{ textAlign:'center' }}>
                            <div style={{ fontSize:22, fontWeight:900, color:valid?C.green:C.red }}>{Math.min(play,n)}</div>
                            <div style={{ fontSize:10, color:C.muted }}>jogam/rodada</div>
                          </div>
                          <div style={{ textAlign:'center' }}>
                            <div style={{ fontSize:22, fontWeight:900, color:sit>0?C.orange:C.green }}>{sit}</div>
                            <div style={{ fontSize:10, color:C.muted }}>de fora</div>
                          </div>
                          <div style={{ textAlign:'center' }}>
                            <div style={{ fontSize:22, fontWeight:900, color:C.sand }}>{rounds||'—'}</div>
                            <div style={{ fontSize:10, color:C.muted }}>rodadas</div>
                          </div>
                        </div>
                        {!valid && (
                          <div style={{ padding:'8px 14px', background:'rgba(239,68,68,.08)', fontSize:11, color:C.red }}>
                            {nt.categoria==='mista'?`Mista exige 4, 8, 16 ou 32 jogadores`:`Mínimo 4 jogadores`}
                          </div>
                        )}
                        {valid && sit > 0 && (
                          <div style={{ padding:'8px 14px', background:'rgba(249,115,22,.08)', fontSize:11, color:C.orange }}>
                            ✓ Quem ficou fora sempre entra na rodada seguinte
                          </div>
                        )}
                        {valid && sit === 0 && (
                          <div style={{ padding:'8px 14px', background:'rgba(34,197,94,.08)', fontSize:11, color:C.green }}>
                            ✓ Todos jogam simultaneamente em todas as rodadas
                          </div>
                        )}
                      </div>
                    )}
                  </>);
                })()}
                <div style={{ fontSize:12, color:C.muted, marginBottom:6, fontWeight:700 }}>RODADAS (opcional)</div>

                  <button key={key} onClick={() => setNt(p => ({...p,criteria:val}))}
                    style={{ width:'100%', padding:'12px', marginBottom:8, border:`1.5px solid ${nt.criteria===val?C.sand:C.border}`, borderRadius:10, background:nt.criteria===val?'rgba(200,168,75,.1)':C.dim, color:nt.criteria===val?C.sand:C.muted, cursor:'pointer', fontWeight:700, fontSize:13, textAlign:'left', fontFamily:'inherit' }}>
                    {nt.criteria===val?'✓ ':''}{RR_LABEL[val]}
                  </button>
                ))}
              </>)}

              {nt.format === 'single' && (<>
                <div style={{ fontSize:12, color:C.muted, marginBottom:6, fontWeight:700 }}>CATEGORIA</div>
                <select className="inp" style={{...inp,marginBottom:14}} value={nt.categoria} onChange={e => setNt(p => ({...p,categoria:e.target.value}))}>

                  <option value="feminino">Feminino</option>

              <button onClick={createTournament} style={{ width:'100%', background:C.sandG, border:'none', borderRadius:14, padding:'16px', color:'#000', fontWeight:800, fontSize:16, cursor:'pointer', fontFamily:'inherit', marginTop:8 }}>Criar Torneio</button>
            </>)}

            {/* ─ Torneio Ativo ─ */}
            {modal === 'tournament' && activeTour && (<>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:16 }}>
                <div>
                  <div style={{ fontSize:20, fontWeight:800 }}>{activeTour.name}</div>
                  <div style={{ fontSize:13, color:C.muted, marginTop:3 }}>{activeTour.arena||'—'} · {activeTour.date}</div>

                    <div style={{ fontSize:12, color:C.purple, marginTop:3 }}>
                      {activeTour.activeCourts||activeTour.numCourts||1} quadra(s) · {activeTour.players.length} jogadores · {activeTour.schedule?.length||0} rodadas
                    </div>
                  )}
                  <div style={{ marginTop:6, display:'flex', gap:6, flexWrap:'wrap' }}>
                    <span style={pill(activeTour.format==='rei_rainha'?'#A855F722':C.dim, activeTour.format==='rei_rainha'?C.purple:C.muted)}>
                      {activeTour.format==='rei_rainha'?'👑 Rei/Rainha':'🏆 Eliminação'}
                    </span>
                    <span style={pill(C.dim,C.muted)}>{activeTour.categoria||'—'}</span>
                  </div>
                </div>
                {activeTour.champion && <div style={{ textAlign:'center', flexShrink:0 }}>
                  <div style={{ fontSize:28 }}>{activeTour.format==='rei_rainha'?'👑':'🏆'}</div>
                  <div style={{ fontSize:11, color:C.sand, fontWeight:700 }}>{getName(activeTour.champion)}</div>
                </div>}
              </div>

              {/* INSCRIÇÕES */}
              {activeTour.status === 'registration' && (<>
                <div style={{ fontSize:14, fontWeight:700, marginBottom:10 }}>
                  Inscrições ({activeTour.players.length}{activeTour.format==='rei_rainha'?` — precisa de ${RR_VALID.join(', ')} `:' '})
                </div>
                {activeTour.format === 'rei_rainha' && (() => {
                  const n  = activeTour.players.length;
                  const c  = optimalCourts(n, activeTour.numCourts||1);
                  const play = c * 4;
                  const sit  = n - play;
                  const valid = isValidRR(n, activeTour.categoria, activeTour.numCourts||1);
                  return (
                    <div style={{ marginBottom:12, padding:10, background:valid?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)', border:`1px solid ${valid?C.green:C.red}`, borderRadius:8, fontSize:12 }}>
                      {valid ? (
                        <div>
                          <div style={{color:C.green,fontWeight:700}}>✅ {n} jogadores · {c} quadra(s) · {play} jogam por rodada{sit>0?` · ${sit} de fora (entram na próxima)`:' · todos jogam'}</div>
                          {activeTour.categoria==='mista'&&<div style={{color:C.muted,marginTop:4}}>Verifique igualdade M/F antes de iniciar</div>}
                        </div>
                      ) : (
                        <div style={{color:C.red}}>
                          ⚠️ {activeTour.categoria==='mista'?`Mista exige 4, 8, 16 ou 32. Você tem ${n}.`:`Mínimo 4 jogadores. Você tem ${n}.`}
                        </div>
                      )}
                    </div>
                  );
                })()}
                <div style={{ marginBottom:12 }}>
                  <select style={{...inp,marginBottom:8}} defaultValue="" onChange={e => { if(e.target.value) joinTournament(activeTour.id, e.target.value); e.target.value=''; }}>
                    <option value="">+ Inscrever jogador...</option>
                    {players.filter(p => !activeTour.players.includes(p.id)).map(p => <option key={p.id} value={p.id}>{p.name}{p.gender?` (${p.gender})`:''}</option>)}
                  </select>
                </div>
                {activeTour.players.map(pid => (
                  <div key={pid} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 14px', background:C.dim, borderRadius:8, marginBottom:6 }}>
                    <div style={{ fontWeight:600 }}>{getName(pid)}</div>
                    <div style={{ fontSize:12, color:C.muted }}>
                      {players.find(p=>p.id===pid)?.gender||'—'}
                    </div>
                  </div>
                ))}
                <div style={{ height:16 }} />
                <button onClick={() => startTournament(activeTour.id)}
                  style={{ width:'100%', background:C.sandG, border:'none', borderRadius:14, padding:'16px', color:'#000', fontWeight:800, fontSize:16, cursor:'pointer', fontFamily:'inherit' }}>
                  {activeTour.format==='rei_rainha'?'👑':'🏆'} Iniciar Torneio
                </button>
              </>)}

              {/* REI/RAINHA ATIVO */}
              {activeTour.status !== 'registration' && activeTour.format === 'rei_rainha' && activeTour.schedule && (<>

                {/* Critério (editável se ativo) */}
                {activeTour.status === 'active' && (
                  <div style={{ marginBottom:14, padding:10, background:C.dim, borderRadius:8 }}>
                    <div style={{ fontSize:11, color:C.muted, fontWeight:700, marginBottom:6 }}>CRITÉRIO DE CLASSIFICAÇÃO</div>
                    <div style={{ display:'flex', gap:6 }}>
                      {['wins_first','saldo_first'].map(c => (
                        <button key={c} onClick={() => updateCriteria(activeTour.id, c)}
                          style={{ flex:1, padding:'7px', border:`1px solid ${activeTour.criteria===c?C.sand:C.border}`, borderRadius:8, background:activeTour.criteria===c?'rgba(200,168,75,.1)':C.panel, color:activeTour.criteria===c?C.sand:C.muted, fontSize:11, fontWeight:700, cursor:'pointer', fontFamily:'inherit' }}>
                          {c==='wins_first'?'Vitórias 1º':'Saldo 1º'}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* Standings */}
                {(() => {
                  const standings = calcReiRainhaStandings(activeTour.schedule, activeTour.players, activeTour.criteria || 'wins_first');
                  return (<>
                    <div style={{ fontSize:14, fontWeight:800, marginBottom:10, color:C.sand }}>👑 Classificação</div>
                    <div style={{ marginBottom:16 }}>
                      {standings.map((s, i) => (
                        <div key={s.pid} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', background:i===0?`linear-gradient(135deg,${C.panel},#130D00)`:C.dim, borderRadius:10, marginBottom:6, border:`1px solid ${i===0?'#5A3800':C.border}` }}>
                          <div style={{ fontSize:i<3?20:13, fontWeight:800, width:28, textAlign:'center', color:i<3?undefined:C.muted, flexShrink:0 }}>
                            {i<3?['👑','🥈','🥉'][i]:`#${i+1}`}
                          </div>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontWeight:700, fontSize:14, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{getName(s.pid)}</div>
                            <div style={{ fontSize:10, color:C.muted, marginTop:2, display:'flex', gap:6 }}>
                              <span>{s.played}J</span>
                              <span style={{color:C.green}}>{s.wins}V</span>
                              <span style={{color:C.red}}>{s.losses}D</span>
                              <span style={{color:s.saldo>=0?C.blue:C.red}}>saldo {s.saldo>0?'+':''}{s.saldo}</span>
                            </div>
                          </div>
                          <div style={{ textAlign:'right', flexShrink:0 }}>
                            <div style={{ fontWeight:900, color:C.sand, fontSize:16 }}>{s.wins}</div>
                            <div style={{ fontSize:10, color:C.muted }}>vitórias</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>);
                })()}

                {/* Rodadas */}
                <div style={{ fontSize:14, fontWeight:800, marginBottom:10 }}>Rodadas</div>
                <div style={{ display:'flex', gap:6, overflowX:'auto', paddingBottom:6, marginBottom:14 }}>
                  {activeTour.schedule.map((r, i) => {
                    const done = r.courts.every(c => c.scoreA !== null);
                    return (
                      <button key={i} onClick={() => setActiveTRound(i)}
                        style={{ padding:'7px 14px', border:`1.5px solid ${activeTRound===i?C.sand:done?C.green:C.border}`, borderRadius:20, background:activeTRound===i?'rgba(200,168,75,.15)':done?'rgba(34,197,94,.1)':C.dim, color:activeTRound===i?C.sand:done?C.green:C.muted, fontWeight:700, fontSize:12, cursor:'pointer', flexShrink:0, fontFamily:'inherit' }}>
                        R{r.round} {done?'✓':''}
                      </button>
                    );
                  })}
                </div>

                {/* Quadras da rodada ativa */}
                {activeTour.schedule[activeTRound] && (() => {
                  const curRound = activeTour.schedule[activeTRound];
                  const sitters = curRound.sitters || [];
                  const nextRound = activeTour.schedule[activeTRound+1];
                  return (<>
                    {/* Jogadores de fora */}
                    {sitters.length > 0 && (
                      <div style={{ marginBottom:12, padding:'10px 14px', background:'rgba(249,115,22,.08)', border:'1px solid rgba(249,115,22,.3)', borderRadius:10 }}>
                        <div style={{ fontSize:11, color:C.orange, fontWeight:700, marginBottom:6 }}>
                          ⏳ DE FORA ESTA RODADA {nextRound?'— entram na próxima':''}
                        </div>
                        <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                          {sitters.map(pid => (
                            <span key={pid} style={{ background:'rgba(249,115,22,.15)', color:C.orange, borderRadius:20, padding:'4px 10px', fontSize:12, fontWeight:700 }}>
                              {getName(pid)}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </>);
                })()}
                {activeTour.schedule[activeTRound] && activeTour.schedule[activeTRound].courts.map((court, ci) => (
                  <div key={court.id} style={{ background:C.panel, border:`1px solid ${court.scoreA!==null?C.green:C.border}`, borderRadius:12, padding:14, marginBottom:10 }}>
                    <div style={{ fontSize:11, fontWeight:700, marginBottom:8, display:"flex", justifyContent:"space-between" }}><span style={{color:C.muted}}>QUADRA {ci+1}</span>{court.scoreA===null&&<span style={{color:C.blue,fontSize:10}}>▶ EM ANDAMENTO</span>}{court.scoreA!==null&&<span style={{color:C.green,fontSize:10}}>✓ CONCLUÍDA</span>}</div>
                    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <div style={{ flex:1, textAlign:'center' }}>
                        <div style={{ fontSize:13, fontWeight:700 }}>{getName(court.team1[0])}</div>
                        <div style={{ fontSize:11, color:C.muted }}>& {getName(court.team1[1])}</div>
                      </div>
                      <div style={{ fontWeight:900, color:court.scoreA!==null?C.sand:C.muted, fontSize:court.scoreA!==null?22:16, minWidth:60, textAlign:'center' }}>
                        {court.scoreA!==null?`${court.scoreA}×${court.scoreB}`:'VS'}
                      </div>
                      <div style={{ flex:1, textAlign:'center' }}>
                        <div style={{ fontSize:13, fontWeight:700 }}>{getName(court.team2[0])}</div>
                        <div style={{ fontSize:11, color:C.muted }}>& {getName(court.team2[1])}</div>
                      </div>
                    </div>
                    {court.scoreA === null && activeTour.status === 'active' && (
                      scoreEdit.cid === court.id
                        ? (<div style={{ marginTop:12 }}>
                            <div style={{ display:'flex', gap:8, marginBottom:8 }}>
                              <input style={{...inp,textAlign:'center',fontSize:24,fontWeight:900,padding:'10px'}} type="number" placeholder="0" value={scoreEdit.sA} onChange={e => setScoreEdit(p => ({...p,sA:e.target.value}))} />
                              <input style={{...inp,textAlign:'center',fontSize:24,fontWeight:900,padding:'10px'}} type="number" placeholder="0" value={scoreEdit.sB} onChange={e => setScoreEdit(p => ({...p,sB:e.target.value}))} />
                            </div>
                            <div style={{ display:'flex', gap:8 }}>
                              <button onClick={() => setScoreEdit({tid:'',rid:0,cid:'',sA:'',sB:''})} style={{ flex:1, padding:'10px', background:'transparent', border:`1px solid ${C.border}`, borderRadius:10, color:C.muted, cursor:'pointer', fontFamily:'inherit' }}>Cancelar</button>
                              <button onClick={recordRRScore} style={{ flex:2, padding:'10px', background:C.sandG, border:'none', borderRadius:10, color:'#000', fontWeight:800, cursor:'pointer', fontFamily:'inherit' }}>Salvar</button>
                            </div>
                          </div>)
                        : <button onClick={() => setScoreEdit({ tid:activeTour.id, rid:activeTRound, cid:court.id, sA:'', sB:'' })}
                            style={{ width:'100%', marginTop:10, padding:'9px', background:C.dim, border:`1px solid ${C.border}`, borderRadius:10, color:C.muted, cursor:'pointer', fontSize:13, fontFamily:'inherit' }}>
                            ✏️ Registrar placar
                          </button>
                    )}
                    {court.scoreA !== null && (
                      <div style={{ marginTop:8, fontSize:11, color:C.green, textAlign:'center' }}>
                        ✓ {court.scoreA > court.scoreB
                          ? `${getName(court.team1[0])} & ${getName(court.team1[1])}`
                          : `${getName(court.team2[0])} & ${getName(court.team2[1])}`} venceram
                      </div>
                    )}
                  </div>
                ))}
              </>)}

              {/* ELIMINAÇÃO ATIVA */}
              {activeTour.status !== 'registration' && activeTour.format === 'single' && activeTour.rounds && (<>
                <div style={{ display:'flex', gap:6, overflowX:'auto', paddingBottom:6, marginBottom:14 }}>
                  {activeTour.rounds.map((r, i) => (
                    <button key={i} onClick={() => setActiveTRound(i)}
                      style={{ padding:'7px 14px', border:`1.5px solid ${activeTRound===i?C.sand:C.border}`, borderRadius:20, background:activeTRound===i?'rgba(200,168,75,.15)':C.dim, color:activeTRound===i?C.sand:C.muted, fontWeight:700, fontSize:12, cursor:'pointer', flexShrink:0, fontFamily:'inherit' }}>
                      {r.name}
                    </button>
                  ))}
                </div>
                {activeTour.rounds[activeTRound] && activeTour.rounds[activeTRound].matches.map(m => (
                  <div key={m.id} style={{ background:C.panel, border:`1px solid ${m.winnerId?C.green:C.border}`, borderRadius:12, padding:14, marginBottom:10 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <div style={{ flex:1, textAlign:'center', opacity:m.winnerId&&m.winnerId!==m.p1?.id?.toString&&m.p1?0.5:1 }}>
                        <div style={{ fontWeight:700 }}>{m.p1?getName(m.p1):'BYE'}</div>
                      </div>
                      <div style={{ fontWeight:900, color:m.winnerId?C.sand:C.muted, fontSize:m.winnerId?20:14, minWidth:50, textAlign:'center' }}>
                        {m.sA!==null?`${m.sA}×${m.sB}`:'VS'}
                      </div>
                      <div style={{ flex:1, textAlign:'center', opacity:m.winnerId&&m.winnerId!==m.p2?0.5:1 }}>
                        <div style={{ fontWeight:700 }}>{m.p2?getName(m.p2):'BYE'}</div>
                      </div>
                    </div>
                    {!m.winnerId && m.p1 && m.p2 && activeTour.status==='active' && (
                      scoreEdit.mid === m.id
                        ? (<div style={{ marginTop:12 }}>
                            <div style={{ display:'flex', gap:8, marginBottom:8 }}>
                              <div style={{ flex:1, textAlign:'center', fontSize:11, color:C.muted }}>{getName(m.p1)}</div>
                              <div style={{ flex:1, textAlign:'center', fontSize:11, color:C.muted }}>{getName(m.p2)}</div>
                            </div>
                            <div style={{ display:'flex', gap:8, marginBottom:8 }}>
                              <input style={{...inp,textAlign:'center',fontSize:24,fontWeight:900,padding:'10px'}} type="number" placeholder="0" value={scoreEdit.sA} onChange={e => setScoreEdit(p => ({...p,sA:e.target.value}))} />
                              <input style={{...inp,textAlign:'center',fontSize:24,fontWeight:900,padding:'10px'}} type="number" placeholder="0" value={scoreEdit.sB} onChange={e => setScoreEdit(p => ({...p,sB:e.target.value}))} />
                            </div>
                            <div style={{ display:'flex', gap:8 }}>
                              <button onClick={() => setScoreEdit({tid:'',rid:0,mid:'',sA:'',sB:'',p1:'',p2:''})} style={{ flex:1, padding:'10px', background:'transparent', border:`1px solid ${C.border}`, borderRadius:10, color:C.muted, cursor:'pointer', fontFamily:'inherit' }}>Cancelar</button>
                              <button onClick={recordTournamentScore} style={{ flex:2, padding:'10px', background:C.sandG, border:'none', borderRadius:10, color:'#000', fontWeight:800, cursor:'pointer', fontFamily:'inherit' }}>Salvar</button>
                            </div>
                          </div>)
                        : <button onClick={() => setScoreEdit({ tid:activeTour.id, rid:activeTRound, mid:m.id, sA:'', sB:'', p1:m.p1, p2:m.p2 })}
                            style={{ width:'100%', marginTop:10, padding:'9px', background:C.dim, border:`1px solid ${C.border}`, borderRadius:10, color:C.muted, cursor:'pointer', fontSize:13, fontFamily:'inherit' }}>
                            ✏️ Registrar placar
                          </button>
                    )}
                  </div>
                ))}
              </>)}
            </>)}

            {/* ─ Perfil ─ */}
            {modal === 'profile' && selected && (() => {
              const s = calcStats(selected.id, matches);
              const history = bliHistory(selected.id, matches);
              const badges = getBadges(selected.id, matches, tours);
              return (<>
                <div style={{ textAlign:'center', marginBottom:20 }}>
                  <div style={{ fontSize:48, marginBottom:8 }}>{selected.gender==='F'?'👩':'👨'}</div>
                  <div style={{ fontSize:22, fontWeight:900 }}>{selected.name}</div>
                  <div style={{ fontSize:14, color:C.muted, marginTop:3 }}>{selected.arena || selected.city || '—'}</div>
                  <div style={{ fontSize:32, fontWeight:900, color:C.sand, marginTop:8 }}>{calcBLI(selected.id, matches)} BLI</div>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:16 }}>
                  {[['Jogos',s.played,C.text],['Vitórias',s.wins,C.green],['%',s.rate+'%',C.sand]].map(([l,v,c]) => (
                    <div key={l} style={{ background:C.dim, borderRadius:10, padding:'12px 8px', textAlign:'center' }}>
                      <div style={{ fontSize:22, fontWeight:900, color:c }}>{v}</div>
                      <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>{l}</div>
                    </div>
                  ))}
                </div>
                {history.length > 1 && (
                  <div style={{ marginBottom:16, background:C.dim, borderRadius:12, padding:'14px 0 8px' }}>
                    <div style={{ fontSize:12, fontWeight:700, paddingLeft:14, marginBottom:8, color:C.muted }}>EVOLUÇÃO BLI</div>
                    <SimpleLineChart data={history} />
                  </div>
                )}
                {badges.length > 0 && (
                  <div style={{ marginBottom:16 }}>
                    <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:8 }}>CONQUISTAS</div>
                    <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                      {badges.map((b, i) => <span key={i} style={pill('rgba(200,168,75,.15)', C.sand)}>{b.icon} {b.label}</span>)}
                    </div>
                  </div>
                )}
                <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:8 }}>ÚLTIMAS PARTIDAS</div>
                {matches.filter(m => m.pA === selected.id || m.pB === selected.id).slice(-5).reverse().map(m => {
                  const won = m.winnerId === selected.id;
                  const opp = m.pA === selected.id ? m.pB : m.pA;
                  return (
                    <div key={m.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', background:C.dim, borderRadius:8, marginBottom:6 }}>
                      <span style={{ fontSize:16 }}>{won?'✓':'✗'}</span>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:13, fontWeight:600 }}>vs {getName(opp)}</div>
                        <div style={{ fontSize:11, color:C.muted }}>{m.arena||'—'} · {m.date}</div>
                      </div>
                      <div style={{ fontWeight:800, color:won?C.green:C.red }}>{m.pA===selected.id?m.sA:m.sB}×{m.pA===selected.id?m.sB:m.sA}</div>
                    </div>
                  );
                })}
              </>);
            })()}

          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
